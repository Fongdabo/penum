<title>ORIEN ฝ่ายขาย</title>
<header><div class="brand"><img src="icons/icon-192.png" alt=""><h1>ORIEN ฝ่ายขาย<small>บริษัท โอเรียน จำกัด · ขายและดูแลลูกค้า PENUM PM · MEP · BIM</small></h1></div><span class="sp"></span>

<script>
let PRI=null;const PUBX='wyXLWhvzv-0vF50q9rOZ8sMoh2QIg9Nsr_5IpR8f7jo',KK='penum.sales.key';
const KEY='penum.sales.v1';
const PLAN={pilot:['ทดลองใช้ฟรี',0,10],starter:['เริ่มต้น',1490,10],std:['มาตรฐาน',3900,30],biz:['ธุรกิจ',7900,80],ent:['องค์กร',0,200],rent:['เช่ารายเดือน',0,0]};
// one code per customer lists the programs it opens (payload ap); a code without ap is PENUM PM only.
// PM is priced by package (PLAN), MEP and BIM per month, all three together less the bundle discount (ราคาสมมติ, from pm/files/plans.json)
const APN={pm:'PENUM PM',mep:'PENUM MEP',bim:'PENUM BIM'};
let APPR={mep:1490,bim:1990,off:20};
fetch('https://fongdabo.github.io/penum/pm/files/plans.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(!j)return;
  (j.apps||[]).forEach(a=>{if(a&&a.k in APPR&&a.price!=null)APPR[a.k]=+a.price});if(j.bundle&&j.bundle.off!=null)APPR.off=+j.bundle.off}).catch(()=>{});
const apOf=x=>Array.isArray(x&&x.ap)&&x.ap.length?x.ap:['pm'];
function priceOf(ap,pl){if(pl==='pilot')return 0;const s=(ap.includes('pm')?(PLAN[pl]||[0,0])[1]:0)+(ap.includes('mep')?APPR.mep:0)+(ap.includes('bim')?APPR.bim:0);
  return ap.length===3?Math.round(s*(100-APPR.off)/100):s}
// what a customer (or one of its codes) has: "แพ็กรวม · PM มาตรฐาน 30 คน + MEP + BIM"
function pkgTxt(x,c){const ap=apOf(x),pl=x.pl||(c&&c.pl),P=PLAN[pl],mx=x.mx||(c&&c.mx);
  return (pl==='pilot'?'ทดลองใช้ฟรี · ':ap.length===3?'แพ็กรวม · ':'')+ap.map(a=>a==='pm'?`PM ${pl!=='pilot'&&P?P[0]+' ':''}${mx} คน`:APN[a].replace('PENUM ','')).join(' + ')}
const apBox=(ap,id)=>`<div class="aps" id="${id}"><span class="mut">โปรแกรมที่เช่า (รหัสเดียวเปิดได้ทุกโปรแกรมที่เลือก · ครบ 3 โปรแกรมลดราคาแพ็กรวม)</span><div class="row">${Object.entries(APN).map(([k,v])=>`<label class="ck"><input type="checkbox" value="${k}"${ap.includes(k)?' checked':''}> ${v}</label>`).join('')}</div></div>`;
const apRead=id=>[...document.querySelectorAll('#'+id+' input:checked')].map(x=>x.value);
// แพ็กเกจ: PENUM PM's tiers when PM is ticked, otherwise ทดลองใช้ฟรี or เช่ารายเดือน (rent)
const plOpts=(pm,cur)=>Object.entries(PLAN).filter(([k])=>k==='pilot'||(pm?k!=='rent':k==='rent')).map(([k,v])=>`<option value="${k}"${k===cur?' selected':''}>${v[0]}</option>`).join('');
const plFit=(pm,pl)=>pm?(pl==='rent'?'starter':pl):(pl==='pilot'?'pilot':'rent');
// programs, package, users and price in the customer and renewal forms (f = 'f' or 'r'): ticking a program or a package sets the price
function pkgWire(f){const pl=$('#'+f+'Pl'),mx=$('#'+f+'Mx'),pr=$('#'+f+'Pr');
  const sync=tier=>{const a=apRead(f+'Ap'),pm=a.includes('pm'),v=plFit(pm,pl.value);if(v!==pl.value)tier=true;pl.innerHTML=plOpts(pm,v);pl.value=v;
    mx.disabled=!pm;if(tier&&pm)mx.value=PLAN[v][2];pr.value=priceOf(a,v)};
  $('#'+f+'Ap').onchange=()=>sync(false);pl.onchange=()=>sync(true)}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const addM=(d,m)=>{const x=new Date(d+'T00:00:00');x.setMonth(x.getMonth()+m);return x.toISOString().slice(0,10)};
const thD=d=>d?new Date(d+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'}):'–';
const thDL=d=>new Date(d+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'});
const days=d=>Math.round((new Date(d+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);
const baht=n=>Number(n||0).toLocaleString('th-TH');
const uid=()=>Math.random().toString(36).slice(2,9);
const dlgOpen=()=>{const d=$('#dlg');if(!d.open)d.showModal();$('#dlgB').scrollTop=0};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2400)}
let SHOWGONE=false,PUBREV=[];
// licence ids already published as revoked (PENUM PM checks the same list when it opens online)
fetch('https://fongdabo.github.io/penum/pm/files/revoked.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&Array.isArray(j.ids)){PUBREV=j.ids.map(String);render()}}).catch(()=>{});
// รหัสลูกค้า: fixed per customer (L26-0005). Serial number: a new 10-digit number for every code issued.
const snOf=c=>c.sn||String(((c.lics||[])[0]||{}).id||'').replace(/-R\d+$/,'');
const lk=l=>l.no||l.id;// the code's own number: its serial, or its old id
// an entry is a serial number, a customer code (all of its codes), or "customer code<YYYY-MM-DD" (only its codes issued before
// that day). PENUM PM reads the list with the same rule.
const revHit=(x,l)=>{const id=String(l.id),m=/^(.+)<(\d{4}-\d\d-\d\d)$/.exec(x);
  if(m)return (m[1]===id||m[1]===id.replace(/-R\d+$/,''))&&String(l.iat||'')<m[2];
  return x===l.no||x===id||x===id.replace(/-R\d+$/,'')};
const isRev=l=>PUBREV.some(x=>revHit(x,l));
// approval: the newest code, encrypted once for each older code of this customer (a program holding that code can read it)
async function licEntries(c){const L=(c.lics||[]).filter(l=>l.code),nw=L[L.length-1];if(!nw||L.length<2)return null;const e={};
  const sha=async t=>new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)));
  for(const l of L.slice(0,-1)){const idx=[...(await sha('i'+l.code)).slice(0,12)].map(b=>b.toString(16).padStart(2,'0')).join('');
    const k=await crypto.subtle.importKey('raw',await sha('k'+l.code),'AES-GCM',false,['encrypt']),iv=crypto.getRandomValues(new Uint8Array(12));
    e[idx]={iv:b64u(iv),ct:b64u(new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(nw.code))))}}
  return {e,nw}}
// the same entries as text for Claude to publish in pm/files/licences.json (the way before ส่งให้ลูกค้าอัตโนมัติ)
async function licPack(c){const x=await licEntries(c);if(!x)return null;
  return `อนุมัติรหัสใหม่ ${c.co} รหัสลูกค้า ${snOf(c)} Serial number ${lk(x.nw)}\n[PENUM-LIC]${JSON.stringify(x.e)}`}
async function approveAsk(c){if(!await licEntries(c))return openMail(c,'welcome');pubAsk(c)}
/* ---- ส่งให้ลูกค้าอัตโนมัติ: an approval goes to ORIEN's Supabase (tools/licence-setup.sql, the feedback box's project). The
   customer's PENUM PM, MEP and BIM look it up by the code they hold whenever they open online and switch to the new code by
   themselves, so to the customer it is the same code with a new date. Adding needs the ORIEN code the SQL prints (DB.set.fbcode,
   the one กล่องรับเรื่อง uses); an entry can only be found and opened with the older code it was made for. ---- */
async function pubAsk(c){const x=await licEntries(c);if(!x)return;if(!DB.set.fbcode)return pubSetup(c,'');
  try{await fbRpc('penum_lic_put',{p_code:DB.set.fbcode,p_e:x.e})}catch(e){return pubSetup(c,e.message)}
  x.nw.pub=today();c.sent=today()+' ส่งรหัสอัตโนมัติ';save();render();pubDone(c,x.nw)}
const dlgBtn=(t,cls,f)=>{const b=document.createElement('button');b.textContent=t;if(cls)b.className=cls;b.onclick=f;$('#dlgF').append(b);return b};
function pubSetup(c,err){
  // only offline: the ORIEN code is fine, so just say so and offer another try (the code stays approved here)
  if(err==='offline'&&DB.set.fbcode){$('#dlgT').textContent='ยังส่งให้ลูกค้าไม่ได้';
    $('#dlgB').innerHTML=`<p style="margin:0;color:var(--bad);font-weight:600">ไม่มีอินเทอร์เน็ต ยังส่งไม่ได้ ต่อเน็ตแล้วกดส่งอีกครั้ง</p><p class="mut" style="margin:0">รหัสอนุมัติไว้แล้ว ส่งทีหลังได้ที่ แท็บ ลูกค้า › ประวัติรหัสที่ออก › ส่งให้ลูกค้าอัตโนมัติ</p>`;
    $('#dlgF').innerHTML='';dlgBtn('ส่งอีกครั้ง','pri',ev=>{ev.currentTarget.disabled=true;pubAsk(c)});dlgBtn('ปิด','',()=>dlg.close());dlgOpen();return}
  const why={nosql:'ยังไม่ได้ตั้งค่าใน Supabase ทำตามขั้นตอนด้านล่างครั้งเดียว',badcode:'รหัส ORIEN ไม่ถูกต้อง คัดลอกจากผลลัพธ์ของคำสั่ง SQL ใหม่อีกครั้ง',offline:'ไม่มีอินเทอร์เน็ต ยังส่งไม่ได้ ต่อเน็ตแล้วกดส่งอีกครั้ง'}[err]||(err?'ส่งไม่ได้: '+err:'');
  $('#dlgT').textContent=err==='offline'?'ยังส่งให้ลูกค้าไม่ได้':'ตั้งค่าส่งให้ลูกค้าอัตโนมัติ (ทำครั้งเดียว)';
  $('#dlgB').innerHTML=`${why?`<p style="margin:0;color:var(--bad);font-weight:600">${esc(why)}</p>`:''}
  <p style="margin:0">อนุมัติต่ออายุหรือเปลี่ยนแพ็กเกจแล้ว ระบบส่งให้ลูกค้าเอง ลูกค้าไม่ต้องใส่รหัสใหม่ PENUM PM, MEP และ BIM ของลูกค้าจะเปลี่ยนเองเมื่อเปิดโปรแกรมตอนต่อเน็ต ส่งผ่าน Supabase ของ ORIEN (โปรเจกต์ penum-pm ตัวเดียวกับกล่องรับเรื่อง)</p>

const b64u=u8=>{let s='';u8.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const ub64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((s.length+3)%4)),c=>c.charCodeAt(0));
async function issue(c){
  // one serial number per customer; a renewal or package change keeps it and adds -R1, -R2 … so each code can still be told apart
  let id=snOf(c);if(!id)id=newCustId();c.sn=id;const no=newSerial();
  const ap=apOf(c),p={v:1,id,no,co:c.co,...(c.en?{en:c.en}:{}),...(c.tax?{tx:c.tax}:{}),...(c.phone?{ph:c.phone}:{}),an:c.an,em:c.em.toLowerCase(),pl:c.pl,mx:ap.includes('pm')?+c.mx||1:0,exp:c.exp,iat:today(),ap};
  const k=await crypto.subtle.importKey('jwk',PRI,{name:'ECDSA',namedCurve:'P-256'},false,['sign']);
  const body=b64u(new TextEncoder().encode(JSON.stringify(p))),msg=new TextEncoder().encode('PNM1.'+body);
  const sig=new Uint8Array(await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},k,msg));
  const pub=Object.assign({},PRI);delete pub.d;pub.key_ops=['verify'];
  const kp=await crypto.subtle.importKey('jwk',pub,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
  if(!await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},kp,sig,msg))throw new Error('ตรวจรหัสไม่ผ่าน');
  const code='PNM1.'+body+'.'+b64u(sig);c.lics=c.lics||[];c.lics.push({id:p.id,no,ts:Date.now(),iat:p.iat,exp:p.exp,mx:p.mx,pl:p.pl,ap,price:+c.price||0,code});save();return code}

const kdf=async(pin,salt)=>{const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},b,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])};
async function keyStore(jwk,pin){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await kdf(pin,salt),new TextEncoder().encode(JSON.stringify(jwk))));
  localStorage.setItem(KK,JSON.stringify({salt:b64u(salt),iv:b64u(iv),ct:b64u(ct)}))}
async function keyOpen(pin){const k=JSON.parse(localStorage.getItem(KK));
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(k.iv)},await kdf(pin,ub64(k.salt)),ub64(k.ct))))}

/* Gmail draft through Google sign-in: the seller's own Google Cloud client id (ตั้งค่า › Gmail).
   Gmail compose links cannot carry a long Thai body or a file, so the draft is built here and saved with the Gmail API. */
let GTOK=null,GEXP=0;
function gisLoad(){if(window.google&&google.accounts&&google.accounts.oauth2)return Promise.resolve();if(gisLoad.p)return gisLoad.p;
  return gisLoad.p=new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=ok;s.onerror=()=>{gisLoad.p=null;no(new Error('โหลดระบบล็อกอิน Google ไม่ได้ ตรวจอินเทอร์เน็ต'))};document.head.append(s)})}
function gToken(){if(GTOK&&Date.now()<GEXP)return Promise.resolve(GTOK);
  return new Promise((ok,no)=>{const c=google.accounts.oauth2.initTokenClient({client_id:DB.set.gcid,scope:'https://www.googleapis.com/auth/gmail.compose',login_hint:DB.set.from||undefined,
    callback:r=>{if(r.error)return no(new Error(r.error_description||r.error));GTOK=r.access_token;GEXP=Date.now()+(Number(r.expires_in)||3600)*1000-60000;ok(GTOK)},
    error_callback:e=>no(new Error(e&&e.type==='popup_closed'?'ปิดหน้าต่างล็อกอิน Google ก่อนเสร็จ':'เปิดหน้าต่างล็อกอิน Google ไม่ได้ (อนุญาตป๊อปอัปให้เว็บนี้)'))});
    c.requestAccessToken({prompt:''})})}
const u8b64=u=>{let t='';for(let i=0;i<u.length;i+=0x8000)t+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(t)};
const utf8b64=t=>u8b64(new TextEncoder().encode(t)),wrap76=t=>t.replace(/.{1,76}/g,'$&\r\n');
async function gDraft(x,tok,guide=true){const bd='orien-'+Date.now().toString(36);let pdf='';
  if(guide)try{const r=await fetch(DB.set.guide);if(r.ok)pdf=u8b64(new Uint8Array(await r.arrayBuffer()))}catch(e){}
  const L=[...(DB.set.from?['From: '+DB.set.from]:[]),'To: '+x.to,'Subject: =?UTF-8?B?'+utf8b64(x.su)+'?=','MIME-Version: 1.0','Content-Type: multipart/mixed; boundary="'+bd+'"','',
    '--'+bd,'Content-Type: text/plain; charset="UTF-8"','Content-Transfer-Encoding: base64','',wrap76(utf8b64(x.body))];
  if(pdf)L.push('--'+bd,'Content-Type: application/pdf; name="PENUM-PM-start-guide.pdf"','Content-Disposition: attachment; filename="PENUM-PM-start-guide.pdf"','Content-Transfer-Encoding: base64','',wrap76(pdf));
  L.push('--'+bd+'--','');
  const raw=btoa(L.join('\r\n')).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  const r=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/drafts',{method:'POST',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({message:{raw}})});
  if(r.status===401)GTOK=null;
  if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(e){}throw new Error('Gmail ไม่รับ ('+r.status+') '+m)}
  const d=await r.json();return {d,pdf:!!pdf}}

const FBSB={url:'https://uejnlxwjqsadbnzdncvb.supabase.co',key:'sb_publishable_0GTUfFnwBuWxjMw7yYULtQ_mhVVhcez'};

  if(!r.ok){let m='';try{m=(await r.json()).message||''}catch(e){}throw new Error(r.status===404?'nosql':/bad code/.test(m)?'badcode':m||('HTTP '+r.status))}
  const t=await r.text();return t?JSON.parse(t):null}

  <section class="card"><h2>รหัสอ่านกล่อง</h2><label>รหัสที่ใช้อ่าน (จากคำสั่ง SQL)<input data-s="fbcode" value="${esc(DB.set.fbcode)}" autocomplete="off"></label><p class="mut" style="margin:6px 0 0">ใช้หลายเครื่องได้ ใส่รหัสเดียวกันทุกเครื่อง สถานะ อ่านแล้ว / ปิดเรื่อง เห็นตรงกันทุกเครื่อง</p></section>`}
async function fbAct(a,t){const id=t.dataset.v,f=(FB.L||[]).find(x=>x.id==id);
  if(a==='fbLoad')fbLoad();if(a==='fbSeen')fbSet(id,'seen');if(a==='fbDone')fbSet(id,'done');if(a==='fbOpen')fbSet(id,'seen');
  if(a==='fbSql'){try{const r=await fetch('files/feedback-setup.sql',{cache:'no-store'});if(!r.ok)throw 0;copy(await r.text())}catch(e){toast('โหลดคำสั่ง SQL ไม่ได้ ขอไฟล์ feedback-setup.sql จาก Claude')}}
  if(a==='fbCopy'&&f)copy([`#${f.id} ${(FBK[f.kind]||FBK.other)[0]} · ${FBAPP[f.app]||f.app} ${f.ver}`,f.company&&('บริษัท '+f.company+(f.lic?' ('+f.lic+')':'')),f.page&&('หน้า '+f.page),'',f.message,'',f.contact&&('ติดต่อกลับ '+f.contact)].filter((x,i)=>x||i===3||i===5).join('\n'));
  if(a==='fbShot'){$('#dlgT').textContent='รูปหน้าจอ เรื่อง #'+id;$('#dlgB').innerHTML='<p class="mut">กำลังโหลด…</p>';$('#dlgF').innerHTML='';dlgOpen();
    try{const s=await fbRpc('penum_fb_shot',{p_code:DB.set.fbcode,p_id:+id});$('#dlgB').innerHTML=/^data:image\//.test(s||'')?`<img src="${s}" alt="รูปหน้าจอ" style="max-width:100%;border:1px solid var(--line);border-radius:8px">`:'<p class="mut">ไม่มีรูป</p>'}catch(e){$('#dlgB').innerHTML=`<p style="color:var(--bad)">${esc(fbErr(e))}</p>`}}
  if(a==='fbTix'&&f){const c=fbCust(f);FB.link=f.id;tixForm(null,c&&c.id);
    $('#tCh').value='กล่องในโปรแกรม';$('#tCa').value=(FBK[f.kind]||FBK.other)[1];$('#tW').value=f.contact;$('#tV').value=[FBAPP[f.app]||f.app,f.ver].filter(Boolean).join(' ');$('#tD').value=String(f.at).slice(0,10);
    $('#tT').value=f.message.split('\n')[0].slice(0,80);$('#tDe').value=f.message+(f.page?'\n\nหน้า: '+f.page:'')+(f.company&&!c?'\nบริษัท: '+f.company:'')+'\n(จากกล่องรับเรื่อง #'+f.id+')';
    if(f.status==='new')fbSet(f.id,'seen');const d=$('#dlg');d.addEventListener('close',()=>{FB.link=null},{once:true})}
  if(a==='fbCsv'){const rows=[['เลขที่','วันเวลา','โปรแกรม','รุ่น','ประเภท','สถานะ','บริษัท','รหัสลูกค้า','หน้า','ข้อความ','ติดต่อกลับ','อุปกรณ์','เรื่องช่วยเหลือ'],...(FB.L||[]).map(f=>[f.id,fbWhen(f.at),FBAPP[f.app]||f.app,f.ver,(FBK[f.kind]||FBK.other)[0],(FBST[f.status]||FBST.new)[0],f.company,f.lic,f.page,f.message,f.contact,f.device,f.note])];
    const l=document.createElement('a');l.href=URL.createObjectURL(new Blob(['﻿'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')],{type:'text/csv'}));l.download='PENUM-กล่องรับเรื่อง-'+today()+'.csv';l.click()}}
// check for new messages when the window comes back to the front (at most once a minute)
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&PRI&&DB.set.fbcode&&!FB.busy&&Date.now()-(fbLoad.t||0)>60000){fbLoad.t=Date.now();fbLoad()}});
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===TAB));
  $('#view').innerHTML=({dash:viewDash,cust:viewCust,sup:viewSup,fb:viewFb,set:viewSet})[TAB]();fbBadge();
  [['#fbSt','st'],['#fbAp','app'],['#fbKi','kind']].forEach(([s,k])=>{const e=$(s);if(e)e.onchange=()=>{FB[k]=e.value;render()}});
  [['#fSt','st'],['#fCa','cat'],['#fCu','cid']].forEach(([s,k])=>{const e=$(s);if(e)e.onchange=()=>{TF[k]=e.value;render()}});const sg=$('#showGone');if(sg)sg.onchange=()=>{SHOWGONE=sg.checked;render()};const q=$('#q');if(q)q.oninput=()=>{Q=q.value;const p=q.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)}}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-tab],[data-a]');if(!t)return;
  if(t.dataset.tab){TAB=t.dataset.tab;render();return}
  const c=DB.cust.find(x=>x.id===t.dataset.id),a=t.dataset.a;
  if(a==='new')custForm();if(a==='edit')custForm(c);if(a==='renew')renewForm(c);if(a==='mail')openMail(c,'welcome');if(a==='cp')copy(t.dataset.v);
  if(a==='revask')revAsk([t.dataset.v]);if(a==='pub'&&c)pubAsk(c);
  if(a==='rev'){const l=allLics().find(x=>lk(x)===t.dataset.v);if(l&&confirm(`ยกเลิกรหัส Serial number ${lk(l)}?${l.no?'':'\nรหัสรุ่นเก่านี้ไม่มี Serial number ยกเลิกแล้วรหัสอื่นของลูกค้ารายนี้จะถูกยกเลิกด้วย'}\nหลังประกาศแล้ว PENUM PM ที่ใช้รหัสนี้จะเปิดดูและพิมพ์ได้อย่างเดียว (ข้อมูลไม่ถูกลบ)\nถ้าลูกค้ายังต้องใช้ต่อ ให้ออกรหัสใหม่ให้ก่อน`)){l.rev=today();save();render();revAsk([lk(l)])}}
  if(a==='lock')lockNow();
  if(a==='rmkey'&&confirm('ลบกุญแจออกจากเครื่องนี้? เครื่องนี้จะออกรหัสไม่ได้จนกว่าจะเปิดไฟล์กุญแจใหม่ รายชื่อลูกค้ายังอยู่')){localStorage.removeItem(KK);lockNow()}
  if(a==='chpin'){const p=prompt('PIN ใหม่ ตัวเลข 6–12 หลัก');if(p===null)return;if(!/^\d{6,12}$/.test(p.trim())){toast('PIN ต้องเป็นตัวเลข 6–12 หลัก');return}if(prompt('ใส่ PIN ใหม่อีกครั้ง')!==p){toast('PIN ไม่ตรงกัน');return}await keyStore(PRI,p.trim());toast('เปลี่ยน PIN แล้ว')}
  if(a&&a.startsWith('fb'))fbAct(a,t);
  if(a==='info'){e.preventDefault();custInfo(c)}if(a==='tnew')tixForm();if(a==='tedit')tixForm(DB.tix.find(x=>x.id===t.dataset.t));
  if(a==='tcsv'){const rows=[['เลขที่','วันที่','บริษัท','ผู้แจ้ง','ช่องทาง','ประเภท','หัวข้อ','รายละเอียด','รุ่น','สถานะ','วิธีแก้','วันที่ปิด'],...DB.tix.map(t=>[t.id,t.date,cName(t.cid),t.who,t.ch,CAT[t.cat]||t.cat,t.title,t.detail,t.ver,TST[t.st][0],t.ans,t.closed])];
    const l=document.createElement('a');l.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')],{type:'text/csv'}));l.download='PENUM-เรื่องช่วยเหลือ-'+today()+'.csv';l.click()}
  if(a==='bk'||a==='csv'){let blob,name;if(a==='bk'){blob=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'});name='PENUM-ฝ่ายขาย-'+today()+'.json'}
    else{const rows=[['บริษัท','ชื่ออังกฤษ','เลขผู้เสียภาษี','ที่อยู่','ผู้ดูแล','อีเมล','โทร','LINE','โปรแกรม','แพ็กเกจ','ผู้ใช้','บาท/เดือน','เริ่ม','ถึง','สถานะ'],...DB.cust.map(c=>[c.co,c.en||'',c.tax||'',c.addr||'',c.an,c.em,c.phone,c.line,apOf(c).map(a=>APN[a]).join(', '),(PLAN[c.pl]||[c.pl])[0],apOf(c).includes('pm')?c.mx:'',c.price,c.start,c.exp,status(c)[0]])];
      blob=new Blob(['﻿'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')],{type:'text/csv'});name='PENUM-ลูกค้า-'+today()+'.csv'}
    const l=document.createElement('a');l.href=URL.createObjectURL(blob);l.download=name;l.click()}
  if(a==='rs'){const f=$('#rsIn');f.onchange=async()=>{try{const j=JSON.parse(await f.files[0].text());if(!Array.isArray(j.cust))throw 0;j.tix=j.tix||[];j.tseq=j.tseq||0;j.set=Object.assign({},DB.set,j.set||{});for(const k of ['gcid','from'])if(!j.set[k]&&DB.set[k])j.set[k]=DB.set[k];DB=j;save();render();toast('เปิดไฟล์สำรองแล้ว '+j.cust.length+' ราย')}catch(x){toast('ไฟล์นี้ไม่ใช่ไฟล์สำรองของฝ่ายขาย')}};f.click()}});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.s;if(k){DB.set[k]=e.target.value.trim();save();toast('บันทึกแล้ว');if(k==='fbcode')fbLoad()}});
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if(!standalone&&location.protocol==='https:'){const h=$('#instHint');h.hidden=false;h.innerHTML=/iPhone|iPad/.test(navigator.userAgent)?'<b>ติดตั้งลงมือถือ:</b> กดปุ่ม แชร์ ใน Safari แล้วเลือก เพิ่มไปยังหน้าจอโฮม':/Android/.test(navigator.userAgent)?'<b>ติดตั้งลงมือถือ:</b> กด ⋮ มุมขวาบนของ Chrome แล้วเลือก ติดตั้งแอป':'<b>ติดตั้งลงคอมพิวเตอร์:</b> กดไอคอน ติดตั้ง ท้ายช่องที่อยู่เว็บของ Edge หรือ Chrome แล้วกด ติดตั้ง'}
render();lockNow();
</script>
