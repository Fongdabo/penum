<style>
:root{--ink:#22313A;--mut:#5E6E75;--acc:#0B7F99;--acc2:#0A6479;--soft:#E7EEF4;--line:#D5DEE7;--bg:#F3F5F8;--card:#fff;--ok:#2E7D4F;--okb:#E2F2E8;--warn:#A45A12;--warnb:#FBEEDD;--bad:#B23B3B;--badb:#F8E3E3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif}
header{background:linear-gradient(120deg,#141B30,#24365C);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{margin:0;font-size:20px}header .sp{flex:1}
nav{display:flex;gap:6px}nav button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3)}nav button.on{background:#fff;color:var(--acc2)}
.w{max-width:1100px;margin:0 auto;padding:18px 16px 60px;display:flex;flex-direction:column;gap:14px}
.warn{background:#FBEDEA;border:1px solid #E9B8AE;color:#7A2C1F;border-radius:10px;padding:8px 14px;font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card h2{margin:0 0 10px;font-size:17px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.card h2 .sp{flex:1}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.kpi dt{font-size:13px;color:var(--mut)}.kpi dd{margin:2px 0 0;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 14px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:4px}
input,select,textarea{font:inherit;color:var(--ink);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%}
textarea{min-height:80px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,a.btn{font:inherit;font-size:14px;padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
button.pri,a.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}button.sm{padding:4px 9px;font-size:13px}button.del{color:var(--bad)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}th{background:var(--soft);font-size:13px;color:var(--mut);font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-size:12.5px;font-weight:600;padding:1px 9px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--okb);color:var(--ok)}.p-warn{background:var(--warnb);color:var(--warn)}.p-bad{background:var(--badb);color:var(--bad)}.p-mut{background:var(--soft);color:var(--mut)}
.mut{color:var(--mut);font-size:13px}
dialog{border:none;border-radius:14px;padding:0;max-width:760px;width:calc(100% - 32px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog .hd{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:600;font-size:17px;display:flex}dialog .hd .sp{flex:1}
dialog .bd{padding:16px 18px;display:flex;flex-direction:column;gap:10px;max-height:70vh;overflow:auto}
dialog .ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
#toast{z-index:60;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2B3A40;color:#fff;padding:8px 16px;border-radius:999px;opacity:0;transition:.2s;pointer-events:none}#toast.on{opacity:1}
[hidden]{display:none!important}
#lock{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px;overflow:auto;
  background:radial-gradient(600px 420px at 12% 18%,rgba(108,99,255,.35),transparent 70%),radial-gradient(560px 420px at 88% 22%,rgba(0,184,217,.28),transparent 70%),radial-gradient(640px 460px at 70% 100%,rgba(245,158,11,.22),transparent 70%),linear-gradient(160deg,#0E1426,#1B2747)}
#lock::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px}
#lock .lk{position:relative;background:#fff;border-radius:22px;padding:34px 30px 26px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px;text-align:center;box-shadow:0 30px 80px rgba(3,8,25,.55),0 2px 0 rgba(255,255,255,.6) inset;overflow:hidden}
#lock .lk::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,#6C63FF,#00B8D9,#F59E0B)}
#lock img{margin:0 auto 2px;width:250px;max-width:100%;height:auto}
#lock .tag{align-self:center;font-size:12.5px;font-weight:600;letter-spacing:.04em;color:#0A6479;background:#E3F5F9;border-radius:999px;padding:3px 12px}
#lock h1{margin:6px 0 0;font-size:22px}#lock .sub{margin:0 0 6px;color:var(--mut);font-size:14px}
#lock .pin{text-align:center;font-size:26px;letter-spacing:.45em;padding:12px 10px 12px calc(10px + .45em);height:58px;border-radius:14px;border:1.5px solid #CBD5E1;background:#F8FAFC;transition:.15s}
#lock .pin:focus{outline:none;border-color:#00A3C4;background:#fff;box-shadow:0 0 0 4px rgba(0,184,217,.18)}
#lock .go{width:100%;height:50px;border:none;border-radius:14px;font-size:16px;font-weight:600;color:#fff;background:linear-gradient(120deg,#0B7F99,#00A3C4);box-shadow:0 8px 20px rgba(0,140,170,.3);cursor:pointer}
#lock .go:hover{filter:brightness(1.06)}#lock .go:disabled{opacity:.5;cursor:default}
#lock .link{background:none;border:none;color:var(--mut);font-size:13.5px;text-decoration:underline;align-self:center;padding:2px 6px;cursor:pointer}
#lock .stp{display:flex;gap:12px;align-items:flex-start;text-align:left}#lock .stp>b{flex:none;width:26px;height:26px;border-radius:50%;background:#E3F5F9;color:#0A6479;display:grid;place-items:center;font-size:13.5px}
#lock .stp>div{flex:1;display:flex;flex-direction:column;gap:6px;font-size:14px}
#lock .drop{border:1.5px dashed #9FB4C8;border-radius:12px;padding:12px;background:#F8FAFC;font:inherit;color:var(--ink);cursor:pointer;text-align:center}#lock .drop.ok{border-style:solid;border-color:#2E7D4F;background:#E9F6EE;color:#2E7D4F;font-weight:600}
#lock .foot{position:relative;color:rgba(255,255,255,.55);font-size:12.5px;text-align:center}
header .brand{display:flex;align-items:center;gap:10px}header .brand img{width:38px;height:38px;border-radius:9px}header .brand small{display:block;font-size:12.5px;opacity:.8;font-weight:400}#lock .lk label{text-align:left}#lock .err{color:var(--bad);font-size:13.5px;min-height:20px}
@media(max-width:640px){header{padding:10px 14px}nav{width:100%;overflow-x:auto}nav button{padding:6px 10px;font-size:13.5px}.w{padding:12px 12px 50px}.card{padding:14px}}
button{white-space:nowrap}td:first-child{white-space:nowrap}
</style>

<title>ORIEN ฝ่ายขาย</title>
<header><div class="brand"><img src="icons/icon-192.png" alt=""><h1>ORIEN ฝ่ายขาย<small>บริษัท โอเรียน จำกัด · ขายและดูแลลูกค้า PENUM PM</small></h1></div><span class="sp"></span>
<nav><button data-tab="dash" class="on">ภาพรวม</button><button data-tab="cust">ลูกค้า</button><button data-tab="sup">ช่วยเหลือลูกค้า</button><button data-tab="set">ตั้งค่า</button></nav></header>
<div class="w">
<div class="warn" id="instHint" hidden></div>
<main id="view"></main>
</div>
<dialog id="dlg"><div class="hd"><span id="dlgT"></span><span class="sp"></span><button class="sm" onclick="dlg.close()">ปิด</button></div><div class="bd" id="dlgB"></div><div class="ft" id="dlgF"></div></dialog>
<div id="toast"></div>
<script>
let PRI=null;const PUBX='wyXLWhvzv-0vF50q9rOZ8sMoh2QIg9Nsr_5IpR8f7jo',KK='penum.sales.key';
const KEY='penum.sales.v1';
const PLAN={pilot:['ทดลองใช้ฟรี',0,10],starter:['เริ่มต้น',1490,10],std:['มาตรฐาน',3900,30],biz:['ธุรกิจ',7900,80],ent:['องค์กร',0,200]};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const addM=(d,m)=>{const x=new Date(d+'T00:00:00');x.setMonth(x.getMonth()+m);return x.toISOString().slice(0,10)};
const thD=d=>d?new Date(d+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'}):'–';
const thDL=d=>new Date(d+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'});
const days=d=>Math.round((new Date(d+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);
const baht=n=>Number(n||0).toLocaleString('th-TH');
const uid=()=>Math.random().toString(36).slice(2,9);
const dlgOpen=()=>{const d=$('#dlg');if(!d.open)d.showModal();$('#dlgB').scrollTop=0};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2400)}
let DB={cust:[],tix:[],tseq:0,seq:0,set:{from:'',sender:'',phone:'',line:'',app:'https://fongdabo.github.io/penum/pm/',guide:'https://fongdabo.github.io/penum/pm/files/PENUM-PM-start-guide.pdf'}};
try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(j)DB=Object.assign(DB,j);DB.tix=DB.tix||[];DB.tseq=DB.tseq||0;DB.set=Object.assign({app:'https://fongdabo.github.io/penum/pm/',guide:'https://fongdabo.github.io/penum/pm/files/PENUM-PM-start-guide.pdf',company:'บริษัท โอเรียน จำกัด (ORIEN)'},DB.set)}catch(e){}
// bring in codes made with the older one-page issuer
try{const old=JSON.parse(localStorage.getItem('penum.lic.log')||'[]');old.forEach(p=>{if(DB.cust.some(c=>c.lics&&c.lics.some(l=>l.id===p.id)))return;
  DB.cust.push({id:uid(),co:p.co,an:p.an,em:p.em,phone:'',line:'',pl:p.pl,mx:p.mx,price:PLAN[p.pl]?PLAN[p.pl][1]:0,start:p.iat,exp:p.exp,note:'',lics:[{id:p.id,iat:p.iat,exp:p.exp,code:''}],sent:''});DB.seq=Math.max(DB.seq,+(p.id.split('-')[1]||0))})}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('บันทึกไม่ได้ ดาวน์โหลดไฟล์สำรองไว้ก่อน')}};save();
let TAB='dash',Q='';

const b64u=u8=>{let s='';u8.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const ub64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((s.length+3)%4)),c=>c.charCodeAt(0));
async function issue(c){
  DB.seq++;const p={v:1,id:'L'+today().slice(2,4)+'-'+String(DB.seq).padStart(4,'0'),co:c.co,an:c.an,em:c.em.toLowerCase(),pl:c.pl,mx:+c.mx||1,exp:c.exp,iat:today()};
  const k=await crypto.subtle.importKey('jwk',PRI,{name:'ECDSA',namedCurve:'P-256'},false,['sign']);
  const body=b64u(new TextEncoder().encode(JSON.stringify(p))),msg=new TextEncoder().encode('PNM1.'+body);
  const sig=new Uint8Array(await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},k,msg));
  const pub=Object.assign({},PRI);delete pub.d;pub.key_ops=['verify'];
  const kp=await crypto.subtle.importKey('jwk',pub,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
  if(!await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},kp,sig,msg))throw new Error('ตรวจรหัสไม่ผ่าน');
  const code='PNM1.'+body+'.'+b64u(sig);c.lics=c.lics||[];c.lics.push({id:p.id,iat:p.iat,exp:p.exp,mx:p.mx,pl:p.pl,price:+c.price||0,code});save();return code}
// ---- the signing key lives only on this device, encrypted with the seller's PIN ----
const kdf=async(pin,salt)=>{const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},b,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])};
async function keyStore(jwk,pin){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await kdf(pin,salt),new TextEncoder().encode(JSON.stringify(jwk))));
  localStorage.setItem(KK,JSON.stringify({salt:b64u(salt),iv:b64u(iv),ct:b64u(ct)}))}
async function keyOpen(pin){const k=JSON.parse(localStorage.getItem(KK));
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(k.iv)},await kdf(pin,ub64(k.salt)),ub64(k.ct))))}
const hasKey=()=>{try{return !!localStorage.getItem(KK)}catch(e){return false}};
function unlocked(jwk){PRI=jwk;$('#lock').hidden=true;render()}
function lockSetup(){const B=$('#lkB');let K=null;
  B.innerHTML=`<h1>ตั้งค่าเครื่องนี้</h1><p class="sub">ทำครั้งเดียวต่อเครื่อง</p>
  <div class="stp"><b>1</b><div>เปิดไฟล์กุญแจ<button class="drop" id="lkF">🔑 เลือกไฟล์ PENUM-PM-sales-key.json</button><input type="file" id="lkIn" accept=".json,application/json" hidden></div></div>
  <div class="stp"><b>2</b><div>ตั้ง PIN ตัวเลข 6–12 หลัก<input class="pin" id="lkP" type="password" inputmode="numeric" autocomplete="new-password" placeholder="••••••"><input class="pin" id="lkP2" type="password" inputmode="numeric" autocomplete="new-password" placeholder="ใส่อีกครั้ง" style="letter-spacing:normal;font-size:16px"></div></div>
  <button class="go" id="lkGo">เริ่มใช้งาน</button><div class="err" id="lkE"></div>`;
  $('#lkP2').oninput=e=>{e.target.style.cssText=e.target.value?'':'letter-spacing:normal;font-size:16px'};
  $('#lkF').onclick=()=>$('#lkIn').click();
  $('#lkIn').onchange=async()=>{const f=$('#lkIn').files[0];if(!f)return;$('#lkE').textContent='';try{const j=JSON.parse(await f.text());const p=j.pri||j;
      if(p.kty!=='EC'||!p.d||p.x!==PUBX)throw 0;K=j;$('#lkF').textContent='✓ '+f.name;$('#lkF').classList.add('ok')}catch(e){K=null;$('#lkF').classList.remove('ok');$('#lkE').textContent='ไฟล์นี้ไม่ใช่ไฟล์กุญแจของ PENUM PM'}};
  $('#lkGo').onclick=async()=>{const p=$('#lkP').value.trim();if(!K){$('#lkE').textContent='เปิดไฟล์กุญแจก่อน';return}
    if(!/^\d{6,12}$/.test(p)){$('#lkE').textContent='PIN ต้องเป็นตัวเลข 6–12 หลัก';return}if(p!==$('#lkP2').value.trim()){$('#lkE').textContent='PIN สองช่องไม่ตรงกัน';return}
    const jwk=K.pri||K;await keyStore(jwk,p);
    if(K.set)for(const k in K.set)if(!DB.set[k])DB.set[k]=K.set[k];save();unlocked(jwk);toast('พร้อมใช้งาน')}}
function lockPin(){const B=$('#lkB');let tries=0;
  const h=new Date().getHours(),hi=h<12?'สวัสดีตอนเช้า':h<17?'สวัสดีตอนบ่าย':'สวัสดีตอนเย็น',who=(DB.set.sender||'').replace(/^(นาย|นาง|นางสาว)\s*/,'').split(/\s+/)[0];
  B.innerHTML=`<h1>${hi}${who?' คุณ'+esc(who):''}</h1><p class="sub">ใส่ PIN เพื่อเปิดโปรแกรม</p>
  <input class="pin" id="lkP" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••••" aria-label="PIN" autofocus>
  <button class="go" id="lkGo">เปิดโปรแกรม</button><div class="err" id="lkE"></div>
  <button class="link" id="lkReset">ลืม PIN?</button>`;
  const go=async()=>{try{unlocked(await keyOpen($('#lkP').value.trim()))}catch(e){tries++;$('#lkE').textContent='PIN ไม่ถูกต้อง';$('#lkP').select();if(tries>=5){$('#lkGo').disabled=true;setTimeout(()=>$('#lkGo').disabled=false,30000);$('#lkE').textContent='ผิดหลายครั้ง รอ 30 วินาที'}}};
  $('#lkGo').onclick=go;$('#lkP').onkeydown=e=>{if(e.key==='Enter')go()};setTimeout(()=>$('#lkP').focus(),50);
  $('#lkReset').onclick=()=>{if(confirm('ลืม PIN: ลบกุญแจออกจากเครื่องนี้ แล้วเปิดไฟล์กุญแจใหม่และตั้ง PIN ใหม่ รายชื่อลูกค้าในเครื่องยังอยู่ครบ ทำต่อไหม')){localStorage.removeItem(KK);lockSetup()}}}
function lockNow(){PRI=null;$('#lock').hidden=false;hasKey()?lockPin():lockSetup()}

const lastCode=c=>{const l=(c.lics||[]).slice().reverse().find(x=>x.code);return l&&l.code};
const actLink=c=>DB.set.app+'#lic='+lastCode(c);
function status(c){if(!(c.lics||[]).length)return ['ยังไม่ออกรหัส','p-mut'];const d=days(c.exp);
  if(d<-7)return ['หมดอายุ','p-bad'];if(d<0)return ['ช่วงผ่อนผัน','p-bad'];if(d<=30)return ['ใกล้หมดอายุ','p-warn'];return ['ใช้งานอยู่','p-ok']}

const LONGNOTE='(ลิงก์ยาวเพราะมีรหัสใช้งานของบริษัทอยู่ในลิงก์ เป็นเรื่องปกติ กดที่ลิงก์ได้เลย ถ้าคัดลอกไปวางเอง ต้องคัดลอกให้ครบทั้งลิงก์)';
function mail(c,kind){const P=PLAN[c.pl]||['',0],S=DB.set,sig=[S.sender,S.company,S.phone&&('โทร '+S.phone),S.line&&('LINE '+S.line),S.from&&('อีเมล '+S.from)].filter(Boolean).join('\n');
  const head=`เรียน ${c.an}\n\n`;
  const plan=`แพ็กเกจ: ${P[0]}  ผู้ใช้ได้ ${c.mx} คน  ใช้ได้ถึง ${thDL(c.exp)}`;
  if(kind==='renew')return {su:`ต่ออายุ PENUM PM ของ ${c.co}`,body:head+`ต่ออายุการใช้งาน PENUM PM ให้ ${c.co} แล้วครับ\n${plan}\n\nวิธีใส่รหัสใหม่: ผู้ดูแลระบบเปิดลิงก์ด้านล่างบนคอมพิวเตอร์ที่ใช้ PENUM PM อยู่ แล้วกด "ใช้รหัสนี้"\n\n${actLink(c)}\n\n${LONGNOTE}\n\nหรือคัดลอกรหัสด้านล่างไปวางที่ ตั้งค่า › สิทธิ์การใช้งาน › ต่ออายุหรือเปลี่ยนแพ็กเกจ แล้วกด "ใช้รหัสนี้"\n${lastCode(c)}\n\nข้อมูลเดิมอยู่ครบ ไม่ต้องตั้งค่าใหม่\n\n${sig}`};
  return {su:`เปิดใช้งาน PENUM PM สำหรับ ${c.co}`,body:head+`ขอบคุณที่เลือกใช้ PENUM PM ครับ เราเปิดสิทธิ์ให้ ${c.co} เรียบร้อยแล้ว\n${plan}\n\n`+

/* Gmail draft through Google sign-in: the seller's own Google Cloud client id (ตั้งค่า › Gmail).
   Gmail compose links cannot carry a long Thai body or a file, so the draft is built here and saved with the Gmail API. */
let GTOK=null,GEXP=0;
function gisLoad(){if(window.google&&google.accounts&&google.accounts.oauth2)return Promise.resolve();if(gisLoad.p)return gisLoad.p;
  return gisLoad.p=new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=ok;s.onerror=()=>{gisLoad.p=null;no(new Error('โหลดระบบล็อกอิน Google ไม่ได้ ตรวจอินเทอร์เน็ต'))};document.head.append(s)})}
function gToken(){if(GTOK&&Date.now()<GEXP)return Promise.resolve(GTOK);
  return new Promise((ok,no)=>{const c=google.accounts.oauth2.initTokenClient({client_id:DB.set.gcid,scope:'https://www.googleapis.com/auth/gmail.compose',login_hint:DB.set.from||undefined,
    callback:r=>{if(r.error)return no(new Error(r.error_description||r.error));GTOK=r.access_token;GEXP=Date.now()+(Number(r.expires_in)||3600)*1000-60000;ok(GTOK)},
    error_callback:e=>no(new Error(e&&e.type==='popup_closed'?'ปิดหน้าต่างล็อกอิน Google ก่อนเสร็จ':'เปิดหน้าต่างล็อกอิน Google ไม่ได้ (อนุญาตป๊อปอัปให้เว็บนี้)'))});
    c.requestAccessToken({prompt:''})})}
const u8b64=u=>{let t='';for(let i=0;i<u.length;i+=0x8000)t+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(t)};
const utf8b64=t=>u8b64(new TextEncoder().encode(t)),wrap76=t=>t.replace(/.{1,76}/g,'$&\r\n');
async function gDraft(x,tok){const bd='orien-'+Date.now().toString(36);let pdf='';
  try{const r=await fetch(DB.set.guide);if(r.ok)pdf=u8b64(new Uint8Array(await r.arrayBuffer()))}catch(e){}
  const L=[...(DB.set.from?['From: '+DB.set.from]:[]),'To: '+x.to,'Subject: =?UTF-8?B?'+utf8b64(x.su)+'?=','MIME-Version: 1.0','Content-Type: multipart/mixed; boundary="'+bd+'"','',
    '--'+bd,'Content-Type: text/plain; charset="UTF-8"','Content-Transfer-Encoding: base64','',wrap76(utf8b64(x.body))];
  if(pdf)L.push('--'+bd,'Content-Type: application/pdf; name="PENUM-PM-start-guide.pdf"','Content-Disposition: attachment; filename="PENUM-PM-start-guide.pdf"','Content-Transfer-Encoding: base64','',wrap76(pdf));
  L.push('--'+bd+'--','');
  const raw=btoa(L.join('\r\n')).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  const r=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/drafts',{method:'POST',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({message:{raw}})});
  if(r.status===401)GTOK=null;
  if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(e){}throw new Error('Gmail ไม่รับ ('+r.status+') '+m)}
  const d=await r.json();return {d,pdf:!!pdf}}

  // Gmail and mail apps reject very long links (Thai text grows ~9x when encoded), so long bodies go via the clipboard

    const l=document.createElement('a');l.href=URL.createObjectURL(blob);l.download=name;l.click()}
  if(a==='rs'){const f=$('#rsIn');f.onchange=async()=>{try{const j=JSON.parse(await f.files[0].text());if(!Array.isArray(j.cust))throw 0;j.tix=j.tix||[];j.tseq=j.tseq||0;DB=j;save();render();toast('เปิดไฟล์สำรองแล้ว '+j.cust.length+' ราย')}catch(x){toast('ไฟล์นี้ไม่ใช่ไฟล์สำรองของฝ่ายขาย')}};f.click()}});
