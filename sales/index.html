<script>
let PRI=null;const PUBX='wyXLWhvzv-0vF50q9rOZ8sMoh2QIg9Nsr_5IpR8f7jo',KK='penum.sales.key';
const KEY='penum.sales.v1';
const PLAN={pilot:['ทดลองใช้ฟรี',0,10],starter:['เริ่มต้น',1490,10],std:['มาตรฐาน',3900,30],biz:['ธุรกิจ',7900,80],ent:['องค์กร',0,200],rent:['เช่ารายเดือน',0,0]};
// one code per customer lists the programs it opens (payload ap); a code without ap is PENUM PM only.
// PM is priced by package (PLAN), MEP and BIM per month, all three together less the bundle discount (ราคาสมมติ, from pm/files/plans.json)
const APN={pm:'PENUM PM',mep:'PENUM MEP',bim:'PENUM BIM'};
let APPR={mep:1490,bim:1990,off:20};
fetch('https://fongdabo.github.io/penum/pm/files/plans.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(!j)return;
  (j.apps||[]).forEach(a=>{if(a&&a.k in APPR&&a.price!=null)APPR[a.k]=+a.price});if(j.bundle&&j.bundle.off!=null)APPR.off=+j.bundle.off}).catch(()=>{});
const apOf=x=>Array.isArray(x&&x.ap)&&x.ap.length?x.ap:['pm'];
function priceOf(ap,pl){if(pl==='pilot')return 0;const s=(ap.includes('pm')?(PLAN[pl]||[0,0])[1]:0)+(ap.includes('mep')?APPR.mep:0)+(ap.includes('bim')?APPR.bim:0);
  return ap.length===3?Math.round(s*(100-APPR.off)/100):s}
// what a customer (or one of its codes) has: "แพ็กรวม · PM มาตรฐาน 30 คน + MEP + BIM"
function pkgTxt(x,c){const ap=apOf(x),pl=x.pl||(c&&c.pl),P=PLAN[pl],mx=x.mx||(c&&c.mx);
  return (pl==='pilot'?'ทดลองใช้ฟรี · ':ap.length===3?'แพ็กรวม · ':'')+ap.map(a=>a==='pm'?`PM ${pl!=='pilot'&&P?P[0]+' ':''}${mx} คน`:APN[a].replace('PENUM ','')).join(' + ')}
const apBox=(ap,id)=>`<div class="aps" id="${id}"><span class="mut">โปรแกรมที่เช่า (รหัสเดียวเปิดได้ทุกโปรแกรมที่เลือก · ครบ 3 โปรแกรมลดราคาแพ็กรวม)</span><div class="row">${Object.entries(APN).map(([k,v])=>`<label class="ck"><input type="checkbox" value="${k}"${ap.includes(k)?' checked':''}> ${v}</label>`).join('')}</div></div>`;
const apRead=id=>[...document.querySelectorAll('#'+id+' input:checked')].map(x=>x.value);
// แพ็กเกจ: PENUM PM's tiers when PM is ticked, otherwise ทดลองใช้ฟรี or เช่ารายเดือน (rent)
const plOpts=(pm,cur)=>Object.entries(PLAN).filter(([k])=>k==='pilot'||(pm?k!=='rent':k==='rent')).map(([k,v])=>`<option value="${k}"${k===cur?' selected':''}>${v[0]}</option>`).join('');
const plFit=(pm,pl)=>pm?(pl==='rent'?'starter':pl):(pl==='pilot'?'pilot':'rent');
// programs, package, users and price in the customer and renewal forms (f = 'f' or 'r'): ticking a program or a package sets the price
function pkgWire(f){const pl=$('#'+f+'Pl'),mx=$('#'+f+'Mx'),pr=$('#'+f+'Pr');
  const sync=tier=>{const a=apRead(f+'Ap'),pm=a.includes('pm'),v=plFit(pm,pl.value);if(v!==pl.value)tier=true;pl.innerHTML=plOpts(pm,v);pl.value=v;
    mx.disabled=!pm;if(tier&&pm)mx.value=PLAN[v][2];pr.value=priceOf(a,v)};
  $('#'+f+'Ap').onchange=()=>sync(false);pl.onchange=()=>sync(true)}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const addM=(d,m)=>{const x=new Date(d+'T00:00:00');x.setMonth(x.getMonth()+m);return x.toISOString().slice(0,10)};
const thD=d=>d?new Date(d+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'}):'–';
const thDL=d=>new Date(d+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'});
const days=d=>Math.round((new Date(d+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);
const baht=n=>Number(n||0).toLocaleString('th-TH');
const uid=()=>Math.random().toString(36).slice(2,9);
const dlgOpen=()=>{const d=$('#dlg');if(!d.open)d.showModal();$('#dlgB').scrollTop=0};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2400)}
let SHOWGONE=false,PUBREV=[];
// licence ids already published as revoked (PENUM PM checks the same list when it opens online)
fetch('https://fongdabo.github.io/penum/pm/files/revoked.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&Array.isArray(j.ids)){PUBREV=j.ids.map(String);render()}}).catch(()=>{});
// รหัสลูกค้า: fixed per customer (L26-0005). Serial number: a new 10-digit number for every code issued.
const snOf=c=>c.sn||String(((c.lics||[])[0]||{}).id||'').replace(/-R\d+$/,'');
const lk=l=>l.no||l.id;// the code's own number: its serial, or its old id

const u8b64=u=>{let t='';for(let i=0;i<u.length;i+=0x8000)t+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(t)};
const utf8b64=t=>u8b64(new TextEncoder().encode(t)),wrap76=t=>t.replace(/.{1,76}/g,'$&\r\n');
async function gDraft(x,tok,guide=true){const bd='orien-'+Date.now().toString(36);let pdf='';
  if(guide)try{const r=await fetch(DB.set.guide);if(r.ok)pdf=u8b64(new Uint8Array(await r.arrayBuffer()))}catch(e){}
  const L=[...(DB.set.from?['From: '+DB.set.from]:[]),'To: '+x.to,'Subject: =?UTF-8?B?'+utf8b64(x.su)+'?=','MIME-Version: 1.0','Content-Type: multipart/mixed; boundary="'+bd+'"','',
    '--'+bd,'Content-Type: text/plain; charset="UTF-8"','Content-Transfer-Encoding: base64','',wrap76(utf8b64(x.body))];
  if(pdf)L.push('--'+bd,'Content-Type: application/pdf; name="PENUM-PM-start-guide.pdf"','Content-Disposition: attachment; filename="PENUM-PM-start-guide.pdf"','Content-Transfer-Encoding: base64','',wrap76(pdf));
  L.push('--'+bd+'--','');
  const raw=btoa(L.join('\r\n')).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');

/* ---- ใบเสนอราคา / ใบแจ้งหนี้ / ใบเสร็จ: one form for all three; pre fills a new one (from a quotation, an invoice or a code) ---- */
function docForm(d,k,pre){const n=!d;k=d?d.k:k;let x;
  if(d)x=JSON.parse(JSON.stringify(d));
  else{x={id:'',k,no:'',date:today(),cid:'',to:toOf(),items:[],disc:0,vat:vatOn(),wht:0,note:k==='qt'?DB.set.qtTerms||'':'',valid:30,due:addD(today(),+DB.set.dueDays||7),
      st:k==='qt'?'sent':k==='inv'?'due':'paid',ref:'',src:'',lic:'',pay:k==='rc'?{how:'โอนเงิน',ref:'',cert:false}:null};
    const c=pre&&pre.cid&&DB.cust.find(c=>c.id===pre.cid);if(c){x.to=toOf(c);x.wht=whtDef(c)}
    Object.assign(x,pre||{});if(k==='rc'&&!x.pay)x.pay={how:'โอนเงิน',ref:'',cert:false}}
  if(!x.items.length)x.items.push({d:'',q:1,u:'',p:0});
  $('#dlgT').textContent=(n?'ออก':'')+kdT(x)+(x.no?' '+x.no:'');
  const prOpts=`<option value="">+ เพิ่มจากรายการสินค้าและบริการ…</option><optgroup label="ค่าเช่าโปรแกรม (ต่อเดือน)">${['starter','std','biz'].map(p=>`<option value="r:${p}">PENUM PM แพ็กเกจ${PLAN[p][0]} ${PLAN[p][2]} ผู้ใช้ · ${baht(PLAN[p][1])}</option>`).join('')}<option value="a:mep">PENUM MEP · ${baht(APPR.mep)}</option><option value="a:bim">PENUM BIM · ${baht(APPR.bim)}</option></optgroup>
    <optgroup label="บริการและฟอร์ม">${DB.prod.map((p,i)=>`<option value="p:${i}">${esc(p.d)} · ${baht(p.p)}</option>`).join('')}</optgroup>`;
  const T=x.to;
  $('#dlgB').innerHTML=`<div class="g"><label>ลูกค้า<select id="dC"><option value="">ลูกค้าอื่น (กรอกเอง)</option>${DB.cust.map(c=>`<option value="${c.id}"${c.id===x.cid?' selected':''}>${esc(c.co)}</option>`).join('')}</select></label>
    <label>${k==='rc'?'วันที่รับเงิน':'วันที่'}<input id="dD" type="date" value="${x.date}"></label>
    ${k==='qt'?`<label>ยืนราคา (วัน)<input id="dV" type="number" min="1" value="${x.valid}"></label><label>สถานะ<select id="dS">${['sent','ok','no','draft','void'].map(s=>`<option value="${s}"${x.st===s?' selected':''}>${DST[s][0]}</option>`).join('')}</select></label>`:''}
    ${k==='inv'?`<label>ครบกำหนดชำระ<input id="dU" type="date" value="${x.due}"></label>`:''}</div>
  <details class="dcu" id="dCu"${x.cid&&T.co?'':' open'}><summary>ชื่อและที่อยู่ลูกค้าบนเอกสาร: <b id="dCoT">${esc(T.co||'ยังไม่ได้กรอก')}</b></summary><div class="g">
    <label>ชื่อบริษัท / ชื่อลูกค้า *<input id="dCo" value="${esc(T.co)}"></label><label>เลขประจำตัวผู้เสียภาษี<input id="dTx" inputmode="numeric" value="${esc(T.tax)}"></label>
    <label>สำนักงานใหญ่ / สาขา<input id="dBr" value="${esc(T.br||'')}"></label><label>ผู้ติดต่อ<input id="dAn" value="${esc(T.an)}"></label>
    <label>โทรศัพท์<input id="dPh" value="${esc(T.ph)}"></label><label>อีเมล<input id="dEm" value="${esc(T.em)}"></label></div>
    <label style="margin-top:8px">ที่อยู่<textarea id="dAd" rows="2">${esc(T.addr)}</textarea></label></details>
  <div class="its"><div class="it h"><span>รายการ</span><span>จำนวน</span><span>หน่วย</span><span>ราคา/หน่วย</span><span style="text-align:right">จำนวนเงิน</span><span></span></div><div class="its" id="dIt"></div></div>
  <div class="row"><button type="button" class="sm" id="dAdd">+ เพิ่มบรรทัด</button><select id="dPr" style="width:auto;max-width:100%">${prOpts}</select><button type="button" class="sm" id="dRent">+ ค่าเช่าตามรหัสล่าสุดของลูกค้า</button></div>
  <div class="g"><label>ส่วนลด (บาท)<input id="dDi" type="number" min="0" step="0.01" value="${x.disc||''}" placeholder="0"></label>
    <label>ภาษีมูลค่าเพิ่ม<select id="dVa"${!vatOn()&&!x.vat?' disabled':''}><option value="0">ไม่คิด VAT</option><option value="1"${x.vat?' selected':''}>คิด VAT 7%</option></select></label>
    <label>ลูกค้าหัก ณ ที่จ่าย<select id="dWh">${[0,1,2,3,5].map(w=>`<option value="${w}"${+x.wht===w?' selected':''}>${w?w+'% ของยอดก่อน VAT':'ไม่หัก'}</option>`).join('')}</select></label></div>
  ${!vatOn()&&!x.vat?'<p class="mut" style="margin:-4px 0 0">ORIEN ยังไม่ได้จดทะเบียนภาษีมูลค่าเพิ่ม เอกสารจึงไม่คิด VAT (จดแล้วเปลี่ยนที่ ตั้งค่า › ข้อมูลบริษัทบนเอกสาร) · ลูกค้าที่เป็นบริษัทหัก ณ ที่จ่าย 3% เมื่อจ่ายตั้งแต่ 1,000 บาท</p>':''}
  ${k==='rc'?`<div class="g"><label>ชำระโดย<select id="dHo">${PAYHOW.map(h=>`<option${h===x.pay.how?' selected':''}>${h}</option>`).join('')}</select></label><label>ธนาคาร / เลขที่อ้างอิง<input id="dRf" value="${esc(x.pay.ref)}" placeholder="เช่น กสิกรไทย 13 ต.ค. 10:42"></label></div>
    <label class="ck" id="dCeL"><input type="checkbox" id="dCe"${x.pay.cert?' checked':''}> ได้รับหนังสือรับรองการหักภาษี ณ ที่จ่าย (50 ทวิ) จากลูกค้าแล้ว</label>`:''}
  <div class="tot" id="dTo"></div>
  <label>${k==='qt'?'เงื่อนไข / หมายเหตุ':'หมายเหตุ'}<textarea id="dNo" rows="3">${esc(x.note)}</textarea></label>`;
  const rd=()=>{x.disc=r2($('#dDi').value);x.vat=$('#dVa').value==='1';x.wht=+$('#dWh').value||0};
  const totR=()=>{rd();const a=amt(x);$('#dTo').innerHTML=`<div><span>รวมเป็นเงิน</span><b>${m2(a.sub)}</b></div>${a.disc?`<div><span>หักส่วนลด</span><b>${m2(a.disc)}</b></div>`:''}${x.vat?`<div><span>มูลค่าก่อนภาษี</span><b>${m2(a.base)}</b></div><div><span>ภาษีมูลค่าเพิ่ม 7%</span><b>${m2(a.vat)}</b></div>`:''}
    <div class="gt"><span>จำนวนเงินรวมทั้งสิ้น</span><b>${m2(a.tot)}</b></div>${a.wht?`<div><span>หัก ณ ที่จ่าย ${x.wht}%</span><b>${m2(a.wht)}</b></div><div class="gt"><span>${k==='rc'?'รับเงินสุทธิ':'ยอดชำระสุทธิ'}</span><b>${m2(a.net)}</b></div>`:''}`;
    const ce=$('#dCeL');if(ce)ce.hidden=!a.wht};
  const itR=()=>{$('#dIt').innerHTML=x.items.map((it,i)=>`<div class="it"><textarea data-i="${i}" data-f="d" rows="${Math.min(4,Math.max(1,String(it.d).split('\n').length))}" placeholder="รายการ">${esc(it.d)}</textarea>
    <input data-i="${i}" data-f="q" type="number" step="any" value="${it.q}" placeholder="จำนวน"><input data-i="${i}" data-f="u" value="${esc(it.u)}" placeholder="หน่วย"><input data-i="${i}" data-f="p" type="number" step="any" value="${it.p}" placeholder="ราคา/หน่วย">
    <span class="am" id="dL${i}">${m2((+it.q||0)*(+it.p||0))}</span><button type="button" class="sm del" data-x="${i}" title="ลบบรรทัดนี้" aria-label="ลบบรรทัดนี้">✕</button></div>`).join('');totR();requestAnimationFrame(()=>$('#dIt').querySelectorAll('textarea').forEach(fit))};
  const fit=t=>{t.style.height='auto';t.style.height=t.scrollHeight+2+'px'};
  const add=it=>{const e=x.items[x.items.length-1];if(e&&!String(e.d).trim()&&!+e.p)x.items.pop();x.items.push(it);itR()};
  $('#dIt').oninput=e=>{const f=e.target.dataset.f,i=+e.target.dataset.i;if(!f)return;x.items[i][f]=e.target.value;if(f==='d')fit(e.target);const l=$('#dL'+i);if(l)l.textContent=m2((+x.items[i].q||0)*(+x.items[i].p||0));totR()};
  $('#dIt').onclick=e=>{const b=e.target.closest('[data-x]');if(!b)return;x.items.splice(+b.dataset.x,1);if(!x.items.length)x.items.push({d:'',q:1,u:'',p:0});itR()};
  ['#dDi','#dVa','#dWh'].forEach(s=>{$(s).oninput=$(s).onchange=totR});
  $('#dAdd').onclick=()=>{x.items.push({d:'',q:1,u:'',p:0});itR();const t=$('#dIt').querySelectorAll('textarea');t[t.length-1].focus()};
  $('#dPr').onchange=e=>{const [t,v]=e.target.value.split(':');e.target.value='';

    if(t==='p'){const p=DB.prod[+v];if(p)add({d:p.d,q:1,u:p.u,p:+p.p||0})}};
  const cSel=()=>{const c=DB.cust.find(c=>c.id===$('#dC').value);$('#dRent').hidden=!(c&&newestLic(c));return c};
  $('#dRent').onclick=()=>{const c=cSel();if(!c)return;const r=rentPre(c);if(r.items){add(r.items[0]);x.lic=r.lic}};
  $('#dC').onchange=()=>{const c=cSel();x.cid=c?c.id:'';const t=toOf(c);
    [['#dCo','co'],['#dTx','tax'],['#dBr','br'],['#dAn','an'],['#dPh','ph'],['#dEm','em'],['#dAd','addr']].forEach(([s,f])=>$(s).value=t[f]);$('#dCoT').textContent=t.co||'ยังไม่ได้กรอก';
    $('#dWh').value=whtDef(c);$('#dCu').open=!c;totR()};
  $('#dCo').oninput=()=>$('#dCoT').textContent=$('#dCo').value||'ยังไม่ได้กรอก';
  cSel();itR();
  const keep=()=>{rd();x.cid=$('#dC').value;x.to={co:$('#dCo').value.trim(),en:x.to.en||'',tax:$('#dTx').value.replace(/[^\d]/g,''),br:$('#dBr').value.trim(),an:$('#dAn').value.trim(),ph:$('#dPh').value.trim(),em:$('#dEm').value.trim(),addr:$('#dAd').value.trim()};
    if(x.cid){const c=DB.cust.find(c=>c.id===x.cid);if(c&&c.co===x.to.co)x.to.en=c.en||''}
    x.date=$('#dD').value||today();if(k==='qt'){x.valid=Math.max(1,+$('#dV').value||30);x.st=$('#dS').value}if(k==='inv')x.due=$('#dU').value||x.date;
    if(k==='rc')x.pay={how:$('#dHo').value,ref:$('#dRf').value.trim(),cert:$('#dCe').checked};x.note=$('#dNo').value;
    x.items=x.items.filter(i=>String(i.d).trim()||+i.p).map(i=>({d:String(i.d).trim(),q:+i.q||0,u:String(i.u||'').trim(),p:+i.p||0}));
    if(!x.to.co){toast('ใส่ชื่อลูกค้า');$('#dCu').open=true;$('#dCo').focus();return null}
    if(!x.items.length){toast('ใส่รายการอย่างน้อย 1 บรรทัด');if(!x.items.length)x.items.push({d:'',q:1,u:'',p:0});itR();return null}
    if(n){x.id=uid();x.no=nextNo(k,x.date);x.made=today();DB.docs.push(x);
      // the step before it moves on: a quotation the customer accepted, an invoice paid
      const s=x.src&&docById(x.src);if(s){if(s.k==='qt'&&s.st!=='void')s.st='ok';if(s.k==='inv'&&k==='rc'){s.st='paid';s.rc=x.id}}}
    else Object.assign(docById(x.id),x);
    save();return docById(x.id)};
  $('#dlgF').innerHTML='';
  dlgBtn(n?'บันทึก':'บันทึกการแก้ไข','pri',()=>{const r=keep();if(!r)return;dlg.close();render();toast(n?'ออก'+kdT(r)+' '+r.no+' แล้ว':'บันทึกแล้ว')});
  dlgBtn('บันทึกและพิมพ์','',()=>{const r=keep();if(!r)return;dlg.close();render();docPrint(r)});

function finChart(n,end){const M=lastMonths(n,end||today().slice(0,7)),I=M.map(inc),E=M.map(outg),mx=Math.max(...I,...E);

  const W=Math.max(640,Math.round((($('#view')||{}).clientWidth-42)/1.3)||0),H=230,pl=44,pr=6,pt=14,pb=28,cw=W-pl-pr,ch=H-pt-pb,r=mx/4,p=10**Math.floor(Math.log10(r)),f=r/p,st=(f<=1?1:f<=2?2:f<=5?5:10)*p,top=st*Math.ceil(mx/st),y=v=>pt+ch-v/top*ch;
