name: Check apps

# Every pull request: each app's scripts still parse, versions and link keys are still there, and the site still builds.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/check-apps.mjs
      - run: node tools/build-pages.mjs site
