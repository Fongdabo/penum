<script>/* ---------- 3.70.10 กลับหน้าแรก: one tap back to the home page ----------
   A house button sits in the header next to the page name (the icon alone, so the page name keeps its room; the menu still lists หน้าแรก on top).
   On a phone a round button also floats at the bottom left, where the thumb reaches, while you are away from the home page;
   it can be dragged to another spot. */
(()=>{
const SV=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10.5 9-7 9 7"/><path d="M5 9v10.5a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9"/></svg>`;
ACT.goHome=()=>{if(typeof ACT.sbClose==='function')ACT.sbClose();ACT.dept({dataset:{k:'home'}})};
// the phone button can be dragged anywhere; let go and it moves to the nearer side, and the spot is remembered.
// A tap still goes home; a drag does not.
const FK='pmHomeFab',M=14;
function fabPlace(f,o){if(!o){f.style.left=f.style.top=f.style.right='';f.style.bottom='';return}
  const W=innerWidth,H=innerHeight,s=f.offsetWidth||60;let y=Math.min(Math.max(o.y*H,M+60),H-s-M);
  if(o.r&&y>H-s-M-70)y=H-s-M-76;// keep clear of the chat button in the bottom right corner
  f.style.bottom='auto';f.style.top=y+'px';if(o.r){f.style.left='auto';f.style.right=M+'px'}else{f.style.right='auto';f.style.left=M+'px'}}
function fabDrag(f){let o=null;try{o=JSON.parse(localStorage.getItem(FK)||'null')}catch(e){}fabPlace(f,o);
  let st=null,moved=false;
  f.addEventListener('pointerdown',e=>{if(e.button)return;const r=f.getBoundingClientRect();st={x:e.clientX,y:e.clientY,dx:e.clientX-r.left,dy:e.clientY-r.top};moved=false;try{f.setPointerCapture(e.pointerId)}catch(_){}});
  f.addEventListener('pointermove',e=>{if(!st)return;if(!moved&&Math.hypot(e.clientX-st.x,e.clientY-st.y)<8)return;
    if(!moved){moved=true;f.classList.add('drag')}
    const s=f.offsetWidth;f.style.right=f.style.bottom='auto';
    f.style.left=Math.min(Math.max(e.clientX-st.dx,4),innerWidth-s-4)+'px';f.style.top=Math.min(Math.max(e.clientY-st.dy,4),innerHeight-s-4)+'px'});
  const end=()=>{if(!st)return;st=null;if(!moved)return;f.classList.remove('drag');
    const r=f.getBoundingClientRect();o={r:r.left+r.width/2>innerWidth/2?1:0,y:r.top/innerHeight};fabPlace(f,o);try{localStorage.setItem(FK,JSON.stringify(o))}catch(e){}};
  f.addEventListener('pointerup',end);f.addEventListener('pointercancel',end);
  // the click that ends a drag must not open the home page
  f.addEventListener('click',e=>{if(moved){moved=false;e.stopImmediatePropagation();e.preventDefault()}},true);
  addEventListener('resize',()=>fabPlace(f,o))}
function draw(){let h=$('#homeBtn');
  if(!h){const cr=$('#crumb');if(!cr)return;
    cr.insertAdjacentHTML('beforebegin',`<button type="button" class="bbtn home-btn" id="homeBtn" data-a="goHome" title="กลับหน้าแรก" aria-label="กลับหน้าแรก">${SV}</button>`);
    document.body.insertAdjacentHTML('beforeend',`<button type="button" class="home-fab" id="homeFab" data-a="goHome" title="กลับหน้าแรก" aria-label="กลับหน้าแรก">${SV}<b>หน้าแรก</b></button>`);h=$('#homeBtn');fabDrag($('#homeFab'))}
  const on=S.dept==='home';h.setAttribute('aria-current',on?'page':'false');$('#homeFab').hidden=on}
{const r=render;render=function(){const x=r.apply(this,arguments);try{draw()}catch(e){}return x}}
document.head.insertAdjacentHTML('beforeend',`<style>
.home-btn{min-height:34px;padding:6px 9px;cursor:pointer;flex:none;transition:transform .15s,background .15s,box-shadow .15s}
.home-btn:hover{transform:translateY(-1px);background:color-mix(in srgb,var(--band-ink) 26%,transparent);box-shadow:0 6px 14px -6px rgba(0,0,0,.35)}
.home-btn:active{transform:translateY(0) scale(.95)}
.home-btn svg{width:19px;height:19px}
.home-btn[aria-current="page"]{background:var(--band-ink)!important;color:var(--band);border-color:transparent;box-shadow:0 4px 12px -4px rgba(0,0,0,.35)}
/* the phone button: a glossy round tile in the header colours, lifted off the page, with its name under the house */
.home-fab{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:3px solid #fff;padding:0;background:var(--band-g);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  box-shadow:0 10px 24px -6px rgba(8,60,90,.55),0 3px 8px rgba(0,0,0,.18),inset 0 -4px 8px rgba(0,0,0,.18);z-index:870;cursor:pointer;overflow:hidden;animation:homeIn .28s cubic-bezier(.2,1.4,.4,1);transition:transform .12s,left .2s ease,right .2s ease,top .2s ease;-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;-webkit-user-select:none}
.home-fab.drag{transition:none;transform:scale(1.1);box-shadow:0 18px 34px -8px rgba(8,60,90,.6),0 4px 10px rgba(0,0,0,.2);cursor:grabbing}
.home-fab::before{content:'';position:absolute;left:8%;right:8%;top:3%;height:46%;border-radius:50% 50% 45% 45%;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.home-fab svg{width:24px;height:24px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25));position:relative}
.home-fab b{font-size:10px;font-weight:700;line-height:1;letter-spacing:.01em;text-shadow:0 1px 1px rgba(0,0,0,.25);position:relative}
.home-fab:active{transform:scale(.9)}
@keyframes homeIn{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.home-fab[hidden]{display:none!important}
@media (max-width:999px){body.sb .brand>.crumb{flex:1 1 calc(100% - 196px)}}
@media (max-width:700px){.home-fab{display:flex}body.sb-open .home-fab{display:none}}
@media (prefers-reduced-motion:reduce){.home-fab{animation:none}}
.pin-lock .home-btn,.pin-lock .home-fab{display:none!important}
@media print{.home-btn,.home-fab{display:none!important}}
</style>`);
if(typeof I18N==='object'&&I18N.en&&I18N.en.x)Object.assign(I18N.en.x,{'กลับหน้าแรก':'Back to home'});
draw();
})();
</script>
