<title>PENUM PM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Sarabun:wght@400;500;600&display=swap">
<style>
/* PENUM PM: project department (schedule, purchasing, cost, site, documents, handover). Same band + work surface as PENUM MEP. */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --sunk:#F5F8F7; --ink:#1D2B33; --muted:#62737C; --line:#E1E8E6;
  --accent:#16707F; --accent-ink:#FFFFFF; --accent-soft:#E2F1F2;
  --band:#123A42; --band-2:#1A4A53; --band-ink:#F1F7F6; --band-muted:#A8C4C6; --band-line:#2A5961; --accent-hi:#7FD3D8;
  --plan:#8A9BA3; --act:#16707F; --crit:#C2410C; --base:#C9D3D1;
  --good:#1E7B4A; --good-soft:#E2F3EA; --warn-c:#A65F00; --warn-soft:#FFF1DC; --danger:#B42318; --danger-soft:#FDE8E6;
  --shadow:0 1px 2px rgba(20,50,56,.04),0 8px 24px rgba(20,50,56,.06);
  --f-display:"Anuphan","Sarabun",system-ui,sans-serif;
  --f-body:"Sarabun","Anuphan",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C1416; --surface:#132024; --sunk:#0F1A1D; --ink:#E3ECEB; --muted:#94A9AC; --line:#22343A;
  --accent:#5CC2CC; --accent-ink:#06191C; --accent-soft:#16363B;
  --band:#0A1F24; --band-2:#12313A; --band-ink:#E8F3F2; --band-muted:#86A6AA; --band-line:#1D3E45;
  --plan:#6F8790; --act:#5CC2CC; --crit:#F08A4B; --base:#2E4249;
  --good:#5CC78E; --good-soft:#12301F; --warn-c:#F0B25A; --warn-soft:#33240D; --danger:#F27A6E; --danger-soft:#3A1714;
  --shadow:none; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0C1416; --surface:#132024; --sunk:#0F1A1D; --ink:#E3ECEB; --muted:#94A9AC; --line:#22343A;
  --accent:#5CC2CC; --accent-ink:#06191C; --accent-soft:#16363B;
  --band:#0A1F24; --band-2:#12313A; --band-ink:#E8F3F2; --band-muted:#86A6AA; --band-line:#1D3E45;
  --plan:#6F8790; --act:#5CC2CC; --crit:#F08A4B; --base:#2E4249;
  --good:#5CC78E; --good-soft:#12301F; --warn-c:#F0B25A; --warn-soft:#33240D; --danger:#F27A6E; --danger-soft:#3A1714;
  --shadow:none; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.55;padding:0 16px 48px;margin:0}
h1,h2,h3{font-family:var(--f-display);margin:0;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.r,input.r{font-variant-numeric:tabular-nums lining-nums}
.wrap{max-width:1440px;margin:0 auto}

/* band */
.band{background:var(--band);color:var(--band-ink);margin-inline:-16px;padding:14px 16px 0;border-bottom:1px solid var(--band-line)}
.band-in{max-width:1440px;margin:0 auto}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand h1{font-size:20px;letter-spacing:.2px}
.brand h1 small{font-weight:500;color:var(--band-muted);font-size:14px;margin-left:6px}
.brand .sp{flex:1}
.proj{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.proj select{background:var(--band-2);border:1px solid var(--band-line);color:var(--band-ink);border-radius:8px;padding:6px 10px;max-width:280px}
.bbtn{background:transparent;border:1px solid var(--band-line);color:var(--band-ink);border-radius:8px;padding:6px 11px;font-size:13.5px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.bbtn:hover{background:var(--band-2)}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:12px;scrollbar-width:none}
.tabs button{background:none;border:0;color:var(--band-muted);padding:10px 14px;border-bottom:3px solid transparent;white-space:nowrap;font-family:var(--f-display);font-weight:500}
.tabs button:hover{color:var(--band-ink)}
.tabs button[aria-selected="true"]{color:var(--band-ink);border-bottom-color:var(--accent-hi)}

/* surface */
main{padding-top:18px;display:flex;flex-direction:column;gap:16px}
.sub{display:flex;gap:6px;flex-wrap:wrap}
.sub button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:13.5px}
.sub button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card>h2{font-size:17px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:10px}
.card>h2 small{font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted)}
.card>h2 .sp{flex:1}
.hint{color:var(--muted);font-size:13px;margin:0 0 10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:10px 14px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.form label.w2{grid-column:span 2}
.form label.full{grid-column:1/-1}
.form input,.form select,.form textarea{color:var(--ink)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0}
textarea{resize:vertical;min-height:64px;width:100%}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:inherit}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:none}
.btn.del{color:var(--danger)}
.x{border:0;background:none;color:var(--muted);padding:2px 6px;border-radius:6px;font-size:15px;line-height:1}
.x:hover{color:var(--danger);background:var(--danger-soft)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:5px 7px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:var(--sunk);font-weight:600;font-family:var(--f-display);font-size:12.5px;color:var(--muted);white-space:nowrap;position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
td input,td select,td textarea{width:100%;border-color:transparent;background:transparent;padding:4px 5px;border-radius:5px}
td input:hover,td select:hover,td textarea:hover{border-color:var(--line)}
td input:focus,td select:focus,td textarea:focus{border-color:var(--accent);background:var(--surface)}
td textarea{min-height:32px;height:32px}
td input[type=checkbox]{width:auto}
td input.r{text-align:right}
tr.grp td{background:var(--accent-soft);font-weight:600;font-family:var(--f-display)}
tr.tot td{font-weight:600;border-top:2px solid var(--line);background:var(--sunk)}
tr.sel td{background:var(--accent-soft)}
.muted{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:22px}

/* pills */
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn-c)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.info{background:var(--accent-soft);color:var(--accent)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px;margin:0}
.stats>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.stats dt{font-size:12.5px;color:var(--muted)}
.stats dd{margin:2px 0 0;font-family:var(--f-display);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
.stats dd small{font-size:12.5px;font-weight:400;color:var(--muted);font-family:var(--f-body)}
.bar{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}

/* gantt */
.gt td{padding:3px 5px;white-space:nowrap}
.gt td.nm{min-width:220px}
.gt td.nm input{font-weight:500}
.gt tr.crit td.nm input{color:var(--crit)}
.gt td.ch{padding:0;position:relative;height:34px;border-left:1px solid var(--line)}
.gt th.ch{padding:0;position:relative;height:42px;border-left:1px solid var(--line)}
.gb{position:absolute;top:9px;height:14px;border-radius:4px;background:var(--plan);overflow:hidden}
.gb i{position:absolute;inset:0 auto 0 0;background:var(--act)}
.gb.crit{background:color-mix(in srgb,var(--crit) 45%,var(--plan))}
.gb.crit i{background:var(--crit)}
.gbl{position:absolute;top:25px;height:4px;border-radius:2px;background:var(--base)}
.gm{position:absolute;top:9px;width:14px;height:14px;transform:rotate(45deg);background:var(--ink);margin-left:-7px}
.gm.done{background:var(--act)}
.gtd{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--danger);opacity:.6}
.gh{position:absolute;top:0;font-size:11px;color:var(--muted);white-space:nowrap;padding-left:3px;border-left:1px solid var(--line);height:100%}
.gh.m{font-weight:600;color:var(--ink);height:20px}
.gh.w{top:20px;height:22px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:18px;height:8px;border-radius:3px;margin-right:5px;vertical-align:middle}

/* charts */
svg text{font-family:var(--f-body)}
.chart{width:100%;height:auto;display:block}

/* compare */
.cmp td.best{background:var(--good-soft)}
.cmp td.best input{color:var(--good);font-weight:600}

/* photos */
.ph{display:flex;flex-wrap:wrap;gap:8px}
.ph figure{margin:0;position:relative;width:140px}
.ph img{width:140px;height:105px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block;background:var(--sunk)}
.ph figure button{position:absolute;top:4px;right:4px;background:var(--surface)}
.ph input{width:100%;font-size:12px;margin-top:3px}

/* modal + toast */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;max-width:min(760px,calc(100vw - 32px));width:100%;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,25,30,.45)}
dialog .hd{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
dialog .hd h2{font-size:17px;flex:1}
dialog .bd{padding:16px;display:flex;flex-direction:column;gap:12px;max-height:70vh;overflow:auto}
dialog .ft{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:calc(100vw - 32px)}
#toast.on{opacity:1}
.steps{margin:0;padding-left:20px}
.steps li{margin:3px 0}

/* print */
#print{display:none}
@media print{
  body{background:#fff;color:#000;padding:0;font-size:12px}
  .wrap,dialog,#toast{display:none!important}
  #print{display:block}
  #print h1{font-size:18px;margin:0 0 2px}
  #print .co{font-size:12px;color:#444;margin-bottom:10px;border-bottom:2px solid #000;padding-bottom:6px;display:flex;justify-content:space-between;gap:12px}
  #print table{font-size:11px;page-break-inside:auto}
  #print th{background:#eee;color:#000;position:static}
  #print th,#print td{border:1px solid #999;padding:3px 5px}
  #print tr{page-break-inside:avoid}
  #print .meta{display:grid;grid-template-columns:1fr 1fr;gap:2px 20px;margin:8px 0 12px}
  #print .sign{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px;text-align:center}
  #print .sign div{border-top:1px solid #000;padding-top:4px}
  #print .box{border:1px solid #999;padding:8px;margin:6px 0;white-space:pre-wrap;min-height:40px}
  #print img{width:31%;margin:1%;border:1px solid #999}
  #print .pill{border:1px solid #999;background:none;color:#000}
  .gb,.gm,.gb i{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (max-width:640px){
  .brand h1 small{display:none}
  .form label.w2{grid-column:auto}
}
</style>

<div class="wrap">
  <header class="band"><div class="band-in">
    <div class="brand">
      <h1>PENUM PM <small>ฝ่ายโครงการ</small></h1>
      <div class="proj"><select id="projSel" aria-label="โครงการ"></select>
        <button type="button" class="bbtn" data-a="newProj">+ โครงการใหม่</button></div>
      <span class="sp"></span>
      <div class="proj">
        <button type="button" class="bbtn" data-a="backup">สำรองข้อมูล</button>
        <button type="button" class="bbtn" data-a="restore">เปิดไฟล์สำรอง</button>
        <a class="bbtn" id="lnkMep" href="../mep/">PENUM MEP</a>
        <a class="bbtn" id="lnkBim" href="../bim/">PENUM BIM</a>
      </div>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div></header>
  <main id="view"></main>
</div>
<dialog id="dlg"></dialog>

<div id="print"></div>
<input type="file" id="fileIn" hidden>
<script>
/* ---------- basics ---------- */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>{const x=typeof v==='string'?parseFloat(v.replace(/,/g,'')):+v;return isFinite(x)?x:0};
const fmt=(v,d=0)=>n(v).toLocaleString('th-TH',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtq=v=>n(v).toLocaleString('th-TH',{maximumFractionDigits:2});
const pct=v=>`${fmt(v,1)}%`;
const uid=()=>'k'+Math.random().toString(36).slice(2,9);
const pad=(v,k=3)=>String(v).padStart(k,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1,2)}-${pad(d.getDate(),2)}`;
const pd=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const today=()=>iso(new Date());
const addD=(s,k)=>{const d=pd(s);d.setDate(d.getDate()+k);return iso(d)};
const diffD=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const okD=s=>/^\d{4}-\d\d-\d\d$/.test(s||'');
const thD=s=>okD(s)?pd(s).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'}):'–';
const thDL=s=>okD(s)?pd(s).toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'}):'–';
const sum=(a,f)=>a.reduce((s,x)=>s+n(f?f(x):x),0);
const nextNo=(pre,list)=>pre+pad(list.reduce((m,x)=>{const k=parseInt(String(x.no||'').replace(/\D+/g,''));return isFinite(k)&&k>m?k:m},0)+1);
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}

/* BOQ groups as PENUM MEP names them */
const BOQ_G={eq:'งานเครื่องปรับอากาศ',pipe:'งานท่อน้ำยาและท่อน้ำทิ้ง',duct:'งานท่อลมและอุปกรณ์',chw:'งานระบบน้ำเย็น',el:'งานไฟฟ้าระบบปรับอากาศ',smk:'งานระบบควบคุมควันไฟ',fp:'งานระบบดับเพลิง',elb:'งานระบบไฟฟ้าอาคาร',plb:'งานระบบสุขาภิบาล',civ:'งานโยธาที่เกี่ยวข้อง',oth:'งานทดสอบและอื่นๆ',ex:'งานเพิ่มเติม'};
const gName=g=>BOQ_G[g]||(g?g:'ไม่ระบุหมวด');
const G_OPTS=()=>[['','–'],...Object.entries(BOQ_G)];

/* ---------- storage ---------- */
const KEY='penum.pm.v1',MEP_LINK='penum.mep.link';
const SUITE=/\.github\.io$/.test(location.hostname)||/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
let DB,P,saveT;
function blankProject(name){
  const s=today();
  return {id:uid(),name:name||'โครงการใหม่',created:s,
    info:{client:'',site:'',contractNo:'',company:'',pm:'',start:s,finish:addD(s,120),cv:0,cvAuto:1,adv:15,ret:5,vat:7,wht:3,handover:''},
    boq:{items:[],src:'',at:'',sub:0,ohp:0,vat:0,grand:0},rooms:[],
    tasks:[],hist:{},inst:[],vendors:[],prs:[],pos:[],subs:[],spay:[],costs:[],bills:[],
    daily:[],rfis:[],vos:[],subm:[],tc:[],tabA:[],tabW:[],punch:[],om:[],war:[]};
}
function migrate(p){const b=blankProject();for(const k in b)if(p[k]==null)p[k]=b[k];for(const k in b.info)if(p.info[k]==null)p.info[k]=b.info[k];return p}
function load(){
  try{DB=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){DB=null}
  if(!DB||!DB.projects||!Object.keys(DB.projects).length){const p=blankProject('โครงการแรก');DB={v:1,cur:p.id,projects:{[p.id]:p}};}
  Object.values(DB.projects).forEach(migrate);
  if(!DB.projects[DB.cur])DB.cur=Object.keys(DB.projects)[0];
  P=DB.projects[DB.cur];
}
function save(now){clearTimeout(saveT);const go=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('บันทึกไม่ได้ พื้นที่เก็บข้อมูลเต็ม ลองลบรูปหรือสำรองข้อมูลแล้วลบโครงการเก่า')}};now?go():saveT=setTimeout(go,250)}
addEventListener('pagehide',()=>save(true));

/* photos live in IndexedDB so the project data stays small */
const IDB={db:null,
  open(){return this.db||(this.db=new Promise((ok,no)=>{try{const r=indexedDB.open('penum-pm',1);r.onupgradeneeded=()=>r.result.createObjectStore('ph');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}}))},
  async put(k,v){const d=await this.open();return new Promise((ok,no)=>{const t=d.transaction('ph','readwrite');t.objectStore('ph').put(v,k);t.oncomplete=ok;t.onerror=()=>no(t.error)})},
  async get(k){const d=await this.open();return new Promise(ok=>{const r=d.transaction('ph').objectStore('ph').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)})},
  async del(k){const d=await this.open();return new Promise(ok=>{const t=d.transaction('ph','readwrite');t.objectStore('ph').delete(k);t.oncomplete=ok;t.onerror=ok})}};
const phCache={};
async function phSrc(k){if(phCache[k])return phCache[k];try{const v=await IDB.get(k);if(v)phCache[k]=v;return v||''}catch(e){return ''}}
function fillPhotos(root){(root||document).querySelectorAll('img[data-ph]').forEach(async im=>{const s=await phSrc(im.dataset.ph);if(s)im.src=s})}
function shrink(file,max=1280,q=.72){return new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',q))};im.onerror=no;im.src=fr.result};fr.onerror=no;fr.readAsDataURL(file)})}

/* file download: Artifact host downloads service when present, else a browser download */
async function download(name,data,type='application/json'){
  let svc=null;
  if(window.claude&&window.claude.use){try{svc=await Promise.race([window.claude.use('downloads'),new Promise(r=>setTimeout(()=>r(null),1500))])}catch(e){svc=null}}

function cell(base,r,c){
  if(c.t==='calc')return `<td class="${c.r?'r':''}">${c.f(r)}</td>`;
  const p=`${base}.${r.id}.${c.k}`,v=r[c.k]??'',w=c.w?` style="min-width:${c.w}px"`:'';
  if(c.t==='sel')return `<td${w}><select data-p="${p}" aria-label="${esc(c.h)}">${(typeof c.o==='function'?c.o(r):c.o).map(([k,l])=>`<option value="${esc(k)}"${String(k)===String(v)?' selected':''}>${esc(l)}</option>`).join('')}</select></td>`;
  if(c.t==='area')return `<td${w}><textarea data-p="${p}" rows="1" aria-label="${esc(c.h)}">${esc(v)}</textarea></td>`;
  if(c.t==='chk')return `<td class="c"><input type="checkbox" data-p="${p}" data-t="chk"${v?' checked':''} aria-label="${esc(c.h)}"></td>`;
  if(c.t==='num')return `<td${w}><input class="r" inputmode="decimal" data-p="${p}" data-t="num" value="${v===''?'':esc(v)}" aria-label="${esc(c.h)}"></td>`;
  if(c.t==='date')return `<td${w}><input type="date" data-p="${p}" value="${esc(v)}" aria-label="${esc(c.h)}"></td>`;

}
function gtable(base,rows,cols,o={}){

  const body=rows.length?rows.map(r=>`<tr${o.rowCls?` class="${o.rowCls(r)}"`:''}>${cols.map(c=>cell(base,r,c)).join('')}${o.extra?`<td style="white-space:nowrap">${o.extra(r)}</td>`:''}${del?`<td><button type="button" class="x" data-a="delRow" data-c="${base}" data-id="${r.id}" title="ลบแถว" aria-label="ลบแถว">✕</button></td>`:''}</tr>`).join('')

}

/* ---------- schedule: forward/backward pass, weights, plan vs actual ---------- */
const durOf=t=>Math.max(0,Math.round(n(t.dur)));
function sched(){
  const T=P.tasks,by={},st=okD(P.info.start)?P.info.start:today(),R={};
  T.forEach(t=>{by[t.id]=t;R[t.id]={es:okD(t.start)?t.start:st,ef:''}});
  const deps=t=>(t.dep||[]).filter(d=>by[d.id]&&d.id!==t.id);
  const gap=(p,lag)=>(durOf(p)>0?1:0)+n(lag);
  for(let pass=0;pass<=T.length;pass++){let ch=false;
    T.forEach(t=>{let es=okD(t.start)?t.start:st;
      deps(t).forEach(x=>{const r=R[x.id];if(r.ef){const c=addD(r.ef,gap(by[x.id],x.lag));if(c>es)es=c}});
      const d=durOf(t),ef=d>0?addD(es,d-1):es;if(R[t.id].es!==es||R[t.id].ef!==ef){R[t.id]={es,ef};ch=true}});
    if(!ch)break}
  const fin=T.reduce((m,t)=>R[t.id].ef>m?R[t.id].ef:m,st),succ={};
  T.forEach(t=>deps(t).forEach(x=>(succ[x.id]=succ[x.id]||[]).push({t,lag:x.lag})));
  T.forEach(t=>{R[t.id].lf=fin});
  for(let pass=0;pass<=T.length;pass++){let ch=false;
    T.forEach(t=>{let lf=fin;(succ[t.id]||[]).forEach(s=>{const c=addD(R[s.t.id].ls||fin,-gap(t,s.lag));if(c<lf)lf=c});
      const d=durOf(t),ls=d>0?addD(lf,-(d-1)):lf;if(R[t.id].lf!==lf||R[t.id].ls!==ls){R[t.id].lf=lf;R[t.id].ls=ls;ch=true}});
    if(!ch)break}
  // weights: BOQ value of the task's work group, shared among that group's tasks by duration; manual value wins
  const gT={},gD={};P.boq.items.forEach(i=>gT[i.g]=(gT[i.g]||0)+n(i.t||boqCost(i)));
  T.forEach(t=>{if(t.g&&gT[t.g])gD[t.g]=(gD[t.g]||0)+Math.max(1,durOf(t))});
  const linked=T.some(t=>t.g&&gT[t.g]);
  T.forEach(t=>{const r=R[t.id];r.w=n(t.w)>0?n(t.w):t.g&&gT[t.g]?gT[t.g]*Math.max(1,durOf(t))/gD[t.g]:linked?0:durOf(t);
    r.fl=diffD(r.es,r.ls);r.crit=r.fl<=0&&T.length>1;r.done=n(t.pct)>=100});
  const W=sum(T,t=>R[t.id].w)||1;
  return {R,st,fin,W,
    planAt(d){return 100*sum(T,t=>{const r=R[t.id],a=okD(t.bs)?t.bs:r.es,b=okD(t.bf)?t.bf:r.ef;if(d<a)return 0;if(d>=b)return r.w;return r.w*(diffD(a,d)+1)/(diffD(a,b)+1)})/W},
    act(){return sum(T,t=>R[t.id].w*Math.min(100,n(t.pct))/100)*100/W},
    gAct(g){const L=T.filter(t=>t.g===g),w=sum(L,t=>Math.max(1,durOf(t)));return w?sum(L,t=>Math.max(1,durOf(t))*Math.min(100,n(t.pct)))/w:null}};
}

/* S-curve */
function scurve(wd=760,ht=260){
  const s=sched();if(!P.tasks.length)return '<p class="empty">ยังไม่มีแผนงาน</p>';
  const a=P.tasks.reduce((m,t)=>{const x=okD(t.bs)&&t.bs<m?t.bs:m;return s.R[t.id].es<x?s.R[t.id].es:x},s.st),b=P.tasks.reduce((m,t)=>okD(t.bf)&&t.bf>m?t.bf:m,s.fin),span=Math.max(1,diffD(a,b));
  const L=44,Rr=14,T=14,B=30,X=d=>L+(wd-L-Rr)*Math.max(0,Math.min(1,diffD(a,d)/span)),Y=v=>T+(ht-T-B)*(1-v/100);
  const step=Math.max(1,Math.round(span/40)),pts=[];for(let k=0;k<=span;k+=step)pts.push(addD(a,k));pts.push(b);
  const plan=pts.map((d,i)=>`${i?'L':'M'}${X(d).toFixed(1)},${Y(s.planAt(d)).toFixed(1)}`).join('');
  const hk=Object.keys(P.hist).filter(okD).sort(),td=today(),cur=s.act();
  const ah=[...hk.filter(d=>d<td).map(d=>[d,P.hist[d]]),[td,cur]].filter(x=>x[0]>=a);
  const act=ah.map(([d,v],i)=>`${i?'L':'M'}${X(d).toFixed(1)},${Y(v).toFixed(1)}`).join('');
  const grid=[0,25,50,75,100].map(v=>`<line x1="${L}" x2="${wd-Rr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}%</text>`).join('');
  const months=[];let m=pd(a);m.setDate(1);m.setMonth(m.getMonth()+1);while(iso(m)<=b){months.push(iso(m));m.setMonth(m.getMonth()+1)}
  const ev=Math.ceil(months.length/8)||1;
  const mx=months.filter((_,i)=>i%ev===0).map(d=>`<line x1="${X(d)}" x2="${X(d)}" y1="${T}" y2="${ht-B}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="${X(d)}" y="${ht-B+16}" text-anchor="middle" font-size="11" fill="var(--muted)">${pd(d).toLocaleDateString('th-TH',{month:'short',year:'2-digit'})}</text>`).join('');
  const tx=td>=a&&td<=b?`<line x1="${X(td)}" x2="${X(td)}" y1="${T}" y2="${ht-B}" stroke="var(--danger)" stroke-dasharray="4 3"/><text x="${X(td)+4}" y="${T+10}" font-size="11" fill="var(--danger)">วันนี้</text>`:'';
  return `<svg class="chart" viewBox="0 0 ${wd} ${ht}" role="img" aria-label="กราฟความคืบหน้าแผนเทียบจริง">${grid}${mx}${tx}
    <path d="${plan}" fill="none" stroke="var(--plan)" stroke-width="2.5"/><path d="${act}" fill="none" stroke="var(--act)" stroke-width="3"/>
    ${ah.length?`<circle cx="${X(td)}" cy="${Y(cur)}" r="4.5" fill="var(--act)"/>`:''}</svg>
    <div class="legend"><span><i style="background:var(--plan)"></i>ตามแผน ${pct(s.planAt(td))}</span><span><i style="background:var(--act)"></i>ทำได้จริง ${pct(cur)}</span></div>`;
}

VIEWS.sched=()=>{
  const s=sched(),T=P.tasks,td=today(),px={d:26,w:7,m:2.4}[S.zoom]||7;
  let a=s.st,b=s.fin;T.forEach(t=>{if(okD(t.bs)&&t.bs<a)a=t.bs;if(okD(t.bf)&&t.bf>b)b=t.bf;if(s.R[t.id].es<a)a=s.R[t.id].es});
  const ad=pd(a);ad.setDate(ad.getDate()-((ad.getDay()+6)%7));a=iso(ad);b=addD(b,14);
  const days=diffD(a,b)+1,Wd=Math.round(days*px),X=d=>diffD(a,d)*px;
  let hdr='';const m=pd(a);m.setDate(1);while(iso(m)<=b){const d=iso(m);if(d>=a||1){const x=Math.max(0,X(d));hdr+=`<span class="gh m" style="left:${x}px">${pd(d).toLocaleDateString('th-TH',{month:'short',year:'2-digit'})}</span>`}m.setMonth(m.getMonth()+1)}
  const wk=S.zoom==='m'?28:7;for(let k=0;k<days;k+=wk){const d=addD(a,k);hdr+=`<span class="gh w" style="left:${X(d)}px">${S.zoom==='d'?thD(d).split(' ')[0]+' '+thD(d).split(' ')[1]:pd(d).getDate()}</span>`;if(S.zoom==='d')for(let j=1;j<7;j++){}}

  const tdl=td>=a&&td<=b?`<span class="gtd" style="left:${X(td)}px"></span>`:'';
  const rows=T.map((t,i)=>{const r=s.R[t.id],d=durOf(t),p=Math.min(100,n(t.pct)),late=!r.done&&r.ef<td;
    const base=okD(t.bs)&&okD(t.bf)?`<span class="gbl" style="left:${X(t.bs)}px;width:${Math.max(3,(diffD(t.bs,t.bf)+1)*px)}px" title="แผนฐาน ${thD(t.bs)} – ${thD(t.bf)}"></span>`:'';
    const bar=d>0?`<span class="gb${r.crit?' crit':''}" style="left:${X(r.es)}px;width:${Math.max(3,d*px)}px" title="${esc(t.name)} ${thD(r.es)} – ${thD(r.ef)} · ${p}%"><i style="width:${p}%"></i></span>`:`<span class="gm${p>=100?' done':''}" style="left:${X(r.es)+px/2}px" title="${esc(t.name)} ${thD(r.es)}"></span>`;
    return `<tr class="${r.crit?'crit':''}"><td class="muted r">${i+1}</td>
      <td class="nm"><input data-p="tasks.${t.id}.name" value="${esc(t.name)}" aria-label="ชื่องาน"></td>
      <td><select data-p="tasks.${t.id}.g" aria-label="หมวดงาน BOQ" style="width:150px">${G_OPTS().map(([k,l])=>`<option value="${k}"${k===(t.g||'')?' selected':''}>${esc(l)}</option>`).join('')}</select></td>
      <td><input type="date" data-p="tasks.${t.id}.start" value="${esc(okD(t.start)?t.start:r.es)}" title="${(t.dep||[]).length?'เริ่มหลังงานก่อนหน้าเสร็จ ใส่วันที่เพื่อกำหนดวันเริ่มไม่ก่อนวันนั้น':''}" aria-label="วันเริ่ม" style="width:128px"></td>
      <td><input class="r" inputmode="numeric" data-p="tasks.${t.id}.dur" data-t="num" value="${d}" aria-label="จำนวนวัน" style="width:52px"></td>
      <td><input data-p="tasks.${t.id}.depTxt" value="${esc(depTxt(t))}" placeholder="เช่น 2,3" aria-label="งานก่อนหน้า" style="width:70px"></td>
      <td class="${late?'':'muted'}" style="${late?'color:var(--danger)':''}">${thD(r.ef)}</td>
      <td><input class="r" inputmode="numeric" data-p="tasks.${t.id}.pct" data-t="num" value="${n(t.pct)}" aria-label="ร้อยละที่ทำได้" style="width:52px"></td>
      <td class="r muted">${fmt(r.w*100/s.W,1)}</td>
      <td style="white-space:nowrap"><button type="button" class="x" data-a="mvTask" data-id="${t.id}" data-d="-1" aria-label="เลื่อนขึ้น">↑</button><button type="button" class="x" data-a="mvTask" data-id="${t.id}" data-d="1" aria-label="เลื่อนลง">↓</button><button type="button" class="x" data-a="delRow" data-c="tasks" data-id="${t.id}" aria-label="ลบงาน">✕</button></td>
      <td class="ch" style="min-width:${Wd}px;${bg}">${base}${bar}${tdl}</td></tr>`}).join('');
  const plan=s.planAt(td),act=s.act(),spi=plan>0?act/plan:1,crit=T.filter(t=>s.R[t.id].crit&&!s.R[t.id].done).length,late=T.filter(t=>!s.R[t.id].done&&s.R[t.id].ef<td).length;
  return `<dl class="stats">
    <div><dt>ความคืบหน้าจริง</dt><dd>${pct(act)}</dd><div class="bar"><i style="width:${Math.min(100,act)}%"></i></div></div>

    <div><dt>เร็ว/ช้ากว่าแผน</dt><dd style="color:${act>=plan-0.5?'var(--good)':'var(--danger)'}">${act>=plan?'+':''}${fmt(act-plan,1)}% <small>SPI ${fmt(spi,2)}</small></dd></div>
    <div><dt>ระยะเวลา</dt><dd>${fmt(diffD(s.st,s.fin)+1)} <small>วัน · เสร็จ ${thD(s.fin)}</small></dd></div>
    <div><dt>งานล่าช้า / วิกฤต</dt><dd>${late} <small>/ ${crit} งาน</small></dd></div></dl>
  <section class="card"><h2><span>แผนงาน (Gantt)</span><small>ใส่จำนวนวันและงานก่อนหน้า (เลขแถว เช่น 2,3 หรือ 2+5 = รอ 5 วัน) แล้ววันที่จะคำนวณให้ แถบสีส้ม = สายงานวิกฤต</small></h2>
    <div class="row" style="margin-bottom:10px">
      <button type="button" class="btn pri" data-a="add" data-c="tasks">+ เพิ่มงาน</button>
      <button type="button" class="btn" data-a="addMs">+ หมุดหมาย/งวดงาน</button>
      <button type="button" class="btn" data-a="genTasks">สร้างแผนตั้งต้นจาก BOQ</button>
      <button type="button" class="btn" data-a="baseline" title="เก็บวันที่ปัจจุบันไว้เทียบ">บันทึกแผนฐาน${P.info.baseAt?` <small class="muted">(${thD(P.info.baseAt)})</small>`:''}</button>
      <span class="sp" style="flex:1"></span>
      <span class="sub">${[['d','วัน'],['w','สัปดาห์'],['m','เดือน']].map(([k,l])=>`<button type="button" data-a="zoom" data-k="${k}" aria-selected="${S.zoom===k}">${l}</button>`).join('')}</span>
      <button type="button" class="btn" data-a="print" data-k="sched">พิมพ์</button></div>
    <div class="tw"><table class="gt"><thead><tr><th>#</th><th>งาน</th><th>หมวด BOQ</th><th>เริ่ม</th><th class="r">วัน</th><th>ก่อนหน้า</th><th>เสร็จ</th><th class="r">%</th><th class="r" title="น้ำหนักงานตามมูลค่า BOQ">น้ำหนัก %</th><th></th>
      <th class="ch" style="min-width:${Wd}px">${hdr}</th></tr></thead><tbody>${rows||`<tr><td colspan="11" class="empty">ยังไม่มีแผนงาน กด “สร้างแผนตั้งต้นจาก BOQ” หรือ “+ เพิ่มงาน”</td></tr>`}</tbody></table></div>
    <div class="legend" style="margin-top:8px"><span><i style="background:var(--plan)"></i>ช่วงงาน</span><span><i style="background:var(--act)"></i>ทำแล้ว</span><span><i style="background:var(--crit)"></i>สายงานวิกฤต</span><span><i style="background:var(--base)"></i>แผนฐาน</span><span><i style="background:none;border-left:2px dashed var(--danger);border-radius:0;width:2px"></i>วันนี้</span></div>
  </section>
  <section class="card"><h2><span>กราฟความคืบหน้า (S-Curve)</span><small>เส้นจริงเก็บค่าทุกวันที่มีการแก้ % งาน</small></h2>${scurve(1300,300)}</section>`;
};

/* ---------- purchasing: BOQ materials → PR → quotes → PO → deliveries ---------- */
const poTotal=po=>{const s=sum(po.items,l=>n(l.q)*n(l.p)),v=po.novat?0:s*n(P.info.vat)/100;return {s,v,t:s+v}};
const recvOf=(po,lid)=>sum((po.dl||[]).filter(d=>d.line===lid),d=>d.q);
function poState(po){const td=today();let full=true,any=false;po.items.forEach(l=>{const r=recvOf(po,l.id);if(r>0)any=true;if(r<n(l.q))full=false});
  const late=!full&&okD(po.due)&&po.due<td;
  return full&&po.items.length?{k:'ok',l:'ส่งครบ'}:late?{k:'bad',l:any?'ส่งบางส่วน · ล่าช้า':'ล่าช้า'}:any?{k:'warn',l:'ส่งบางส่วน'}:{k:'',l:'รอส่ง'}}
const orderedOf=bid=>sum(P.pos.flatMap(p=>p.items).filter(l=>l.bid===bid),l=>l.q);

  P.prs.push(pr);S.pick={};S.sub.buy='pr';S.sel.pr=pr.id;save();render();toast(`สร้างใบขอซื้อ ${pr.no} แล้ว`)};

function buyPR(){

function buyDL(){

function costTable(){
  const G={},row=g=>G[g]||(G[g]={g,bud:0,po:0,sub:0,exp:0,paid:0});
  P.boq.items.forEach(i=>row(i.g).bud+=boqCost(i));
  P.pos.forEach(p=>{const k=p.novat?1:1;p.items.forEach(l=>{const v=n(l.q)*n(l.p)*k;row(l.g||'').po+=v;if(p.paid)row(l.g||'').paid+=v})});
  P.subs.forEach(s=>row(s.g||'').sub+=n(s.value));
  P.spay.forEach(x=>{const s=P.subs.find(y=>y.id===x.sub);row(s?s.g||'':'').paid+=n(x.amt)});
  P.costs.forEach(c=>{row(c.g||'').exp+=n(c.amt);row(c.g||'').paid+=n(c.amt)});
  const L=Object.values(G).map(r=>Object.assign(r,{com:r.po+r.sub+r.exp,fc:Math.max(r.bud,r.po+r.sub+r.exp)}));
  const order=Object.keys(BOQ_G);L.sort((a,b)=>(order.indexOf(a.g)+99*!a.g)-(order.indexOf(b.g)+99*!b.g));
  const T={bud:sum(L,r=>r.bud),com:sum(L,r=>r.com),paid:sum(L,r=>r.paid),fc:sum(L,r=>r.fc)};return {L,T};
}

function billsSorted(){return P.bills.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')||String(a.no).localeCompare(String(b.no),undefined,{numeric:true}))}
function cumVal(b){if(!b)return 0;const uv=unitVal();return sum(P.boq.items,i=>Math.min(n(i.q),n((b.qty||{})[i.id]))*uv(i))+sum(P.vos.filter(v=>v.status==='ok'),v=>(v.type==='omit'?-1:1)*n(v.amt)*Math.min(100,n((b.vo||{})[v.id]))/100)}
function billCalc(b){
  const I=P.info,C=contract(),prog=billsSorted().filter(x=>(x.kind||'prog')==='prog');
  let amt=0,cum=0;
  if(b.kind==='adv')amt=C.base*n(I.adv)/100;
  else if(b.kind==='ret')amt=sum(P.bills.filter(x=>x.id!==b.id&&(x.kind||'prog')==='prog'),x=>billCalc(x).ret);
  else if(I.billMode==='pct'){const it=(P.inst||[]).find(x=>x.id===b.inst);amt=it?C.total*n(it.pct)/100:0;cum=sum(prog.slice(0,prog.indexOf(b)+1),x=>{const k=(P.inst||[]).find(y=>y.id===x.inst);return k?n(k.pct):0})}
  else{const i=prog.indexOf(b);cum=cumVal(b);amt=cum-(i>0?cumVal(prog[i-1]):0);cum=C.total?cum*100/C.total:0}
  const isP=(b.kind||'prog')==='prog',adv=isP?amt*n(I.adv)/100:0,ret=isP?amt*n(I.ret)/100:0,base=amt-adv,vat=base*n(I.vat)/100,wht=base*n(I.wht)/100;
  return {amt,adv,ret,base,vat,wht,net:base+vat-wht-ret,cum};
}

  return {no:nextNo('INV-',arr),date:today(),kind:'prog',inst:ni?ni.id:'',qty:prev?Object.assign({},prev.qty):{},vo:prev?Object.assign({},prev.vo||{}):{},status:'draft',paid:'',note:''}};

ACT.pasteBoq=()=>{dialog('วาง BOQ จาก PENUM MEP',`<ol class="steps"><li>เปิด PENUM MEP ไปที่หน้า BOQ</li><li>กดปุ่ม <b>คัดลอก BOQ (วางใน Excel)</b></li><li>กลับมาที่นี่ คลิกในช่องด้านล่าง แล้วกด Ctrl+V</li></ol><textarea id="boqTxt" rows="8" placeholder="วาง BOQ ที่นี่"></textarea>`,`<button type="button" class="btn pri" data-a="pasteGo">นำเข้า</button>`)};
ACT.pasteGo=()=>{const r=parseBoqTSV($('#boqTxt').value);if(!r.items.length){toast('ไม่พบรายการ BOQ ในข้อความที่วาง');return}setBoq(r.items,{src:'วางจาก PENUM MEP',sub:r.sub,ohp:r.ohp,vat:r.vat,grand:r.grand});$('#dlg').close();save();render();toast(`นำเข้า BOQ ${r.items.length} รายการแล้ว`)};
function parseBoqTSV(txt){
  const GL={};Object.entries(BOQ_G).forEach(([k,v])=>GL[v]=k);
  let g='',head='',type='';const items=[],tot={};
  txt.split(/\r?\n/).forEach(line=>{const c=line.split('\t');const a=(c[0]||'').trim(),b=(c[1]||'');const bt=b.trim();if(!bt)return;
    const num=k=>c[k]!=null&&/^-?[\d,]+(\.\d+)?$/.test(String(c[k]).trim())?n(c[k]):null;
    if(/^รวมค่าของและค่าแรง/.test(bt)){tot.sub=num(8);return}if(/^ค่าดำเนินการ/.test(bt)){tot.ohp=num(11);return}if(/^VAT/.test(bt)){tot.vat=num(11);return}if(/^รวมทั้งสิ้น/.test(bt)){tot.grand=num(11);return}
    if(/^หมวด/.test(bt)&&/^[A-Z]$/.test(a))return;
    if(/^\d+$/.test(a)&&GL[bt]){g=GL[bt];head='';type='';return}
    const q=num(2);
    if(q==null){if(/^\d+\.\d+$/.test(a)){head=bt;type=''}else if(!a&&/^\s{2}/.test(b))type=bt;return}
    const sub=/^\s*-\s/.test(b);if(!sub){head='';type=''}
    items.push({g,head:sub?head:'',type:sub?type:'',desc:bt.replace(/^-\s*/,''),unit:(c[3]||'').trim(),q,m:n(c[4]),l:n(c[6]),t:n(c[11])||n(c[8])});
  });
  return {items,sub:tot.sub||sum(items,i=>i.t),ohp:tot.ohp||0,vat:tot.vat||0,grand:tot.grand||0};
}
