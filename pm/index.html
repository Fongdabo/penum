<title>PENUM PM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Anuphan:wght@500;600;700&family=Sarabun:wght@400;500;600&display=swap">
<style>
/* PENUM PM: project and company management. Same suite as PENUM MEP and BIM, refreshed look (1.5). */
:root{
  --bg:#F3F8FC; --surface:#FFFFFF; --sunk:#F5F9FC; --ink:#102A3A; --muted:#567080; --line:#DEE8F0; --line-2:#EBF2F7;
  --accent:#0891B2; --accent-ink:#FFFFFF; --accent-soft:#DDF4FA; --accent-2:#4F6BF5;
  --band:#0EA5E9; --band-g:linear-gradient(110deg,#06B6D4 0%,#0EA5E9 48%,#5B6CF0 100%); --band-2:rgba(255,255,255,.18); --band-ink:#FFFFFF; --band-muted:rgba(255,255,255,.86); --band-line:rgba(255,255,255,.34); --accent-hi:#FFFFFF;
  --tab-hover:rgba(255,255,255,.14); --tab-on:rgba(255,255,255,.24); --tab-ul:#FFFFFF; --mode-bg:rgba(255,255,255,.16);
  --pill-on:#FFFFFF; --pill-on-ink:#0B7896; --mark-bg:#FFFFFF; --mark-ink:#0891B2; --band-shadow:0 10px 30px -16px rgba(14,120,200,.55);
  --plan:#94A9B6; --act:#0891B2; --crit:#EA580C; --base:#CBD8E1;
  --good:#059669; --good-soft:#DDF7EC; --warn-c:#B45309; --warn-soft:#FFF3D6; --danger:#DC2626; --danger-soft:#FEE7E7;
  --shadow:0 1px 2px rgba(16,60,90,.05),0 8px 24px -12px rgba(16,60,90,.16);
  --shadow-hi:0 2px 4px rgba(16,60,90,.06),0 14px 32px -12px rgba(16,60,90,.22);
  --glow:radial-gradient(1100px 460px at 6% -14%,rgba(6,182,212,.16),transparent 62%),radial-gradient(900px 420px at 100% -12%,rgba(91,108,240,.12),transparent 62%);
  --r:16px;
  --f-display:"IBM Plex Sans Thai","Anuphan",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai","Sarabun",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#05070A; --surface:#0F141B; --sunk:#0A0E14; --ink:#F1F5F9; --muted:#9AA8BA; --line:#1E2632; --line-2:#161C26;
  --accent:#22D3EE; --accent-ink:#03222A; --accent-soft:rgba(34,211,238,.14); --accent-2:#818CF8;
  --band:#0369A1; --band-g:linear-gradient(110deg,#0E7490 0%,#0369A1 48%,#4338CA 100%); --band-2:rgba(255,255,255,.13); --band-ink:#FFFFFF; --band-muted:rgba(255,255,255,.82); --band-line:rgba(255,255,255,.24);
  --plan:#64748B; --act:#22D3EE; --crit:#FB923C; --base:#2A3442;
  --good:#34D399; --good-soft:rgba(52,211,153,.14); --warn-c:#FBBF24; --warn-soft:rgba(251,191,36,.14); --danger:#F87171; --danger-soft:rgba(248,113,113,.15);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 28px -14px rgba(0,0,0,.8); --shadow-hi:0 1px 0 rgba(255,255,255,.06) inset,0 16px 36px -14px rgba(0,0,0,.9);
  --glow:radial-gradient(1100px 460px at 6% -14%,rgba(34,211,238,.13),transparent 62%),radial-gradient(900px 420px at 100% -12%,rgba(129,140,248,.13),transparent 62%);
  --tab-hover:rgba(255,255,255,.10); --tab-on:rgba(255,255,255,.18); --tab-ul:#FFFFFF; --mode-bg:rgba(0,0,0,.18);
  --pill-on:#FFFFFF; --pill-on-ink:#0E7490; --mark-bg:#FFFFFF; --mark-ink:#0891B2; --band-shadow:0 10px 30px -14px rgba(3,105,161,.55);
  color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--glow),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.6;padding:0 16px 56px;margin:0;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);margin:0;font-weight:600;letter-spacing:-.005em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.r,input.r{font-variant-numeric:tabular-nums lining-nums}
.wrap{max-width:1440px;margin:0 auto}
::selection{background:color-mix(in srgb,var(--accent) 30%,transparent)}

/* band */
.band{background:var(--band-g);color:var(--band-ink);margin-inline:-16px;padding:14px 16px 0;position:sticky;top:0;z-index:20;box-shadow:0 1px 0 var(--band-line),var(--band-shadow)}
.band-in{max-width:1440px;margin:0 auto}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.brand h1{font-size:19px;letter-spacing:.2px;display:flex;align-items:center;gap:10px;font-weight:700}
.brand h1 .mark{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:16px;font-weight:700;color:var(--mark-ink);background:var(--mark-bg);box-shadow:0 4px 14px -4px rgba(0,0,0,.25)}
.brand h1 small{font-weight:400;color:var(--band-muted);font-size:13.5px;margin-left:2px}
.brand .sp{flex:1}
.proj{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.usel,.proj select{background:var(--band-2);border:1px solid var(--band-line);color:var(--band-ink);border-radius:10px;padding:7px 10px;max-width:280px}
.usel option,.proj select option{color:#13232B;background:#fff}
.appr{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.bbtn{background:var(--band-2);border:1px solid var(--band-line);color:var(--band-ink);border-radius:10px;padding:7px 12px;font-size:13.5px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s}
.bbtn:hover{background:rgba(255,255,255,.26);border-color:rgba(255,255,255,.45)}
.more{position:relative}
.more>summary{list-style:none;cursor:pointer}
.more>summary::-webkit-details-marker{display:none}
.more .menu{position:absolute;right:0;top:calc(100% + 8px);min-width:270px;white-space:nowrap;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-hi);padding:6px;display:flex;flex-direction:column;z-index:30}
.more .menu button,.more .menu a{background:none;border:0;text-align:left;padding:9px 12px;border-radius:9px;color:inherit;text-decoration:none;font-size:14px;display:flex;gap:10px;align-items:center}
.more .menu button:hover,.more .menu a:hover{background:var(--sunk)}
.more .menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;color:var(--band-muted);padding:10px 14px 11px;border-radius:12px 12px 0 0;white-space:nowrap;font-family:var(--f-display);font-weight:500;display:inline-flex;align-items:center;gap:8px;position:relative;transition:color .15s,background .15s}
.tabs button svg{width:17px;height:17px;flex:none;opacity:.95}
.tabs button:hover{color:var(--band-ink);background:var(--tab-hover)}
.tabs button[aria-selected="true"]{color:var(--band-ink);background:var(--tab-on);font-weight:600}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--tab-ul)}

.mode{display:inline-flex;background:var(--mode-bg);border:1px solid var(--band-line);border-radius:12px;padding:3px}
.mode.theme button{display:inline-flex;align-items:center;gap:6px;padding:5px 11px}
.mode.theme span{display:none}.mode.theme button{padding:5px 10px}
.brand:has(#projBox:not([hidden])) h1 small{display:none}
.mode button{background:none;border:0;color:var(--band-muted);padding:5px 14px;border-radius:9px;font-family:var(--f-display);font-weight:500;transition:all .15s}
.mode button[aria-pressed="true"]{background:var(--pill-on);color:var(--pill-on-ink);font-weight:600;box-shadow:0 2px 10px -3px rgba(0,0,0,.25)}
/* surface */
main{padding-top:20px;display:flex;flex-direction:column;gap:18px}
.sub{display:flex;gap:4px;flex-wrap:wrap;align-self:flex-start;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;box-shadow:var(--shadow)}
.sub button{border:0;background:none;border-radius:10px;padding:6px 14px;font-size:13.5px;color:var(--muted);font-weight:500;transition:all .15s}
.sub button:hover{color:var(--ink);background:var(--sunk)}
.sub button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 10px -4px color-mix(in srgb,var(--accent) 70%,transparent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.card>h2{font-size:16.5px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:14px}
.card>h2 small{font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted)}
.card>h2 .sp{flex:1}
.hint{color:var(--muted);font-size:13px;margin:0 0 10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px 16px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500}
.form label.w2{grid-column:span 2}
.form label.full{grid-column:1/-1}
.form input,.form select,.form textarea{color:var(--ink);font-weight:400;font-size:14px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-width:0;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:64px;width:100%}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 14px;font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:inherit;transition:border-color .15s,transform .1s,box-shadow .15s,background .15s}
.btn:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 72%,var(--accent-2)));color:var(--accent-ink);border-color:transparent;box-shadow:0 4px 14px -6px color-mix(in srgb,var(--accent) 80%,transparent)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:8px}
.btn.ghost{border-color:transparent;background:none}
.btn.del{color:var(--danger)}
.btn.del:hover{border-color:var(--danger)}
.x{border:0;background:none;color:var(--muted);padding:3px 7px;border-radius:7px;font-size:15px;line-height:1}
.x:hover{color:var(--danger);background:var(--danger-soft)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:middle}
th{background:var(--sunk);font-weight:600;font-family:var(--f-display);font-size:12px;color:var(--muted);white-space:nowrap;position:sticky;top:0;border-bottom:1px solid var(--line);letter-spacing:.01em}
tbody tr{transition:background .12s}
tbody tr:hover td{background:color-mix(in srgb,var(--accent) 4%,transparent)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
td input,td select,td textarea{width:100%;border-color:transparent;background:transparent;padding:4px 6px;border-radius:7px;box-shadow:none}
td input:hover,td select:hover,td textarea:hover{border-color:var(--line)}
td input:focus,td select:focus,td textarea:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
td textarea{min-height:32px;height:32px}
td input[type=checkbox]{width:auto;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent)}
td input.r{text-align:right}
tr.grp td{background:var(--accent-soft);font-weight:600;font-family:var(--f-display)}
tr.tot td{font-weight:700;border-top:1px solid var(--line);background:var(--sunk)}
tr.sel td{background:var(--accent-soft)}
.muted{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:26px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--sunk);color:var(--muted);border:1px solid var(--line-2)}
.pill.ok,.pill.warn,.pill.bad,.pill.info{border-color:transparent}
.pill.ok::before,.pill.warn::before,.pill.bad::before,.pill.info::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn-c)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.info{background:var(--accent-soft);color:var(--accent)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:14px;margin:0}
.stats>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 15px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
.stats>div::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--k,linear-gradient(90deg,#4FD1C5,#7AA2FF))}
.stats>div:nth-child(6n+2){--k:linear-gradient(90deg,#7AA2FF,#A78BFA);--kc:rgba(122,162,255,.10)}
.stats>div:nth-child(6n+3){--k:linear-gradient(90deg,#34D399,#4FD1C5);--kc:rgba(52,211,153,.10)}
.stats>div:nth-child(6n+4){--k:linear-gradient(90deg,#FBBF24,#FB923C);--kc:rgba(251,191,36,.10)}
.stats>div:nth-child(6n+5){--k:linear-gradient(90deg,#22D3EE,#34D399);--kc:rgba(34,211,238,.10)}
.stats>div:nth-child(6n+6){--k:linear-gradient(90deg,#F472B6,#A78BFA);--kc:rgba(244,114,182,.09)}
.stats>div:hover{transform:translateY(-2px);box-shadow:var(--shadow-hi)}
.stats dt{font-size:12.5px;color:var(--muted);font-weight:500;position:relative}
.stats dd{margin:6px 0 0;font-family:var(--f-display);font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.2;position:relative}
.stats dd small{font-size:12.5px;font-weight:400;color:var(--muted);font-family:var(--f-body);letter-spacing:0}
.bar{height:7px;background:var(--sunk);border-radius:7px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:7px}

/* gantt */
.gt td{padding:3px 5px;white-space:nowrap}
.gt td.nm{min-width:220px}
.gt td.nm input{font-weight:500}
.gt tr.crit td.nm input{color:var(--crit)}
.gt td.ch{padding:0;position:relative;height:34px;border-left:1px solid var(--line)}
.gt th.ch{padding:0;position:relative;height:42px;border-left:1px solid var(--line)}
.gb{position:absolute;top:9px;height:14px;border-radius:7px;background:var(--plan);overflow:hidden}
.gb i{position:absolute;inset:0 auto 0 0;background:var(--act)}
.gb.crit{background:color-mix(in srgb,var(--crit) 45%,var(--plan))}
.gb.crit i{background:var(--crit)}
.gbl{position:absolute;top:25px;height:4px;border-radius:2px;background:var(--base)}
.gm{position:absolute;top:9px;width:14px;height:14px;transform:rotate(45deg);background:var(--ink);margin-left:-7px}
.gm.done{background:var(--act)}
.gtd{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--danger);opacity:.6}
.gh{position:absolute;top:0;font-size:11px;color:var(--muted);white-space:nowrap;padding-left:3px;border-left:1px solid var(--line);height:100%}
.gh.m{font-weight:600;color:var(--ink);height:20px}
.gh.w{top:20px;height:22px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:18px;height:8px;border-radius:3px;margin-right:5px;vertical-align:middle}

/* charts */
svg text{font-family:var(--f-body)}
.chart{width:100%;height:auto;display:block}

/* compare */
.cmp td.best{background:var(--good-soft)}
.cmp td.best input{color:var(--good);font-weight:600}

/* photos */
.ph{display:flex;flex-wrap:wrap;gap:8px}
.ph figure{margin:0;position:relative;width:140px}
.ph img{width:140px;height:105px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block;background:var(--sunk)}
.ph figure button{position:absolute;top:4px;right:4px;background:var(--surface)}
.ph input{width:100%;font-size:12px;margin-top:3px}

.lvd{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.lvd i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--accent);display:inline-block}
.lvd i.on{background:var(--accent)}
.lvd b{font-size:12px;color:var(--muted);margin-left:4px}
/* modal + toast */
dialog{border:1px solid var(--line);border-radius:20px;padding:0;max-width:min(760px,calc(100vw - 32px));width:100%;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,25,30,.45)}
dialog .hd{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
dialog .hd h2{font-size:17px;flex:1}
dialog .bd{padding:16px;display:flex;flex-direction:column;gap:12px;max-height:70vh;overflow:auto}
dialog .ft{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:color-mix(in srgb,var(--ink) 92%,transparent);backdrop-filter:blur(8px);color:var(--bg);padding:10px 18px;border-radius:999px;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:calc(100vw - 32px)}
#toast.on{opacity:1}
.steps{margin:0;padding-left:20px}
.steps li{margin:3px 0}

/* org chart, workflow, forms library */
.og{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.og b{font-weight:600}
.og small{color:var(--muted)}
.og-top{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;position:relative}
.og-md,.og-dir{background:var(--band-g);color:#fff;border-radius:14px;padding:10px 16px;text-align:center;box-shadow:var(--shadow)}
.og-md small,.og-dir small{color:rgba(255,255,255,.85)}
.og-md{min-width:240px}
.og-she{border:1.5px dashed var(--accent);border-radius:14px;padding:10px 14px;max-width:360px;font-size:13px;background:var(--accent-soft)}
.og-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;border-top:2px solid var(--line);padding-top:14px}
.og-col{display:flex;flex-direction:column;gap:10px}
.og-dept{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:9px 12px;background:var(--sunk);font-size:13px}
.og-dn{font-weight:600;font-size:14px;margin-bottom:3px}
.og-head{color:var(--accent);font-weight:500;margin-bottom:4px}
.og-role{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;padding:2px 0;border-top:1px dashed var(--line-2)}
.og-role>span:first-child{flex:1 1 130px}
.og-vac{color:var(--muted);font-style:italic}
.og-md .og-vac,.og-dir .og-vac{color:rgba(255,255,255,.82)}
@media (max-width:860px){.og-cols{grid-template-columns:1fr}}
.fl{min-width:980px}
.fl th,.fl td{vertical-align:top;text-align:center}
.fl th.fl-l{text-align:left;white-space:nowrap}
.fl td{padding:6px 5px}
.fl-s{display:block;width:100%;border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:12.5px;line-height:1.35;background:var(--surface);color:var(--ink);text-decoration:none;font:inherit;font-size:12.5px}
.fl-s.pen{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--ink);cursor:pointer}
.fl-s.pen:hover{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.fl-s.ap{background:#FFEDD5;border-color:#FDBA74;color:#7C2D12}

<script>
/* ---------- basics ---------- */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>{const x=typeof v==='string'?parseFloat(v.replace(/,/g,'')):+v;return isFinite(x)?x:0};
const fmt=(v,d=0)=>n(v).toLocaleString('th-TH',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtq=v=>n(v).toLocaleString('th-TH',{maximumFractionDigits:2});
const pct=v=>`${fmt(v,1)}%`;
const uid=()=>'k'+Math.random().toString(36).slice(2,9);
const pad=(v,k=3)=>String(v).padStart(k,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1,2)}-${pad(d.getDate(),2)}`;
const pd=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const today=()=>iso(new Date());
const addD=(s,k)=>{const d=pd(s);d.setDate(d.getDate()+k);return iso(d)};
const diffD=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const okD=s=>/^\d{4}-\d\d-\d\d$/.test(s||'');
const thD=s=>okD(s)?pd(s).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'}):'–';
const thDL=s=>okD(s)?pd(s).toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'}):'–';
const sum=(a,f)=>a.reduce((s,x)=>s+n(f?f(x):x),0);
const nextNo=(pre,list)=>pre+pad(list.reduce((m,x)=>{const k=parseInt(String(x.no||'').replace(/\D+/g,''));return isFinite(k)&&k>m?k:m},0)+1);
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}

/* BOQ groups as PENUM MEP names them */
const BOQ_G={eq:'งานเครื่องปรับอากาศ',pipe:'งานท่อน้ำยาและท่อน้ำทิ้ง',duct:'งานท่อลมและอุปกรณ์',chw:'งานระบบน้ำเย็น',el:'งานไฟฟ้าระบบปรับอากาศ',smk:'งานระบบควบคุมควันไฟ',fp:'งานระบบดับเพลิง',elb:'งานระบบไฟฟ้าอาคาร',plb:'งานระบบสุขาภิบาล',civ:'งานโยธาที่เกี่ยวข้อง',oth:'งานทดสอบและอื่นๆ',ex:'งานเพิ่มเติม'};
const gName=g=>BOQ_G[g]||(g==='lab'?'ค่าแรงพนักงานบริษัท':g?g:'ไม่ระบุหมวด');
const G_OPTS=()=>[['','–'],...Object.entries(BOQ_G)];

/* ---------- storage ---------- */
const KEY='penum.pm.v1',MEP_LINK='penum.mep.link';
const SUITE=/\.github\.io$/.test(location.hostname)||/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
let DB,P,saveT;
function blankProject(name){
  const s=today();
  return {id:uid(),name:name||'โครงการใหม่',created:s,
    info:{client:'',site:'',contractNo:'',company:'',pm:'',start:s,finish:addD(s,120),cv:0,cvAuto:1,adv:15,ret:5,vat:7,wht:3,handover:''},
    boq:{items:[],src:'',at:'',sub:0,ohp:0,vat:0,grand:0},rooms:[],
    tasks:[],hist:{},inst:[],vendors:[],prs:[],pos:[],subs:[],spay:[],costs:[],bills:[],
    daily:[],safe:[],permits:[],incid:[],rfis:[],vos:[],subm:[],tc:[],tabA:[],tabW:[],punch:[],om:[],war:[]};
}
function blankCo(){return {name:'',tax:'',addr:'',phone:'',email:'',terms:'ยืนราคา 30 วัน · ชำระเงินตามงวดงาน · รับประกันผลงาน 1 ปี',customers:[],leads:[],quotes:[],staff:[],ts:[],skills:null,svc:[],tickets:[],equip:[],apprOn:false,roles:null}}
function migrate(p){const b=blankProject();for(const k in b)if(p[k]==null)p[k]=b[k];for(const k in b.info)if(p.info[k]==null)p.info[k]=b.info[k];return p}
function load(){
  try{DB=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){DB=null}
  if(!DB||!DB.projects||!Object.keys(DB.projects).length){const p=blankProject('โครงการแรก');DB={v:1,cur:p.id,projects:{[p.id]:p}};}
  Object.values(DB.projects).forEach(migrate);
  DB.co=Object.assign(blankCo(),DB.co||{});
  if(!DB.projects[DB.cur])DB.cur=Object.keys(DB.projects)[0];
  P=DB.projects[DB.cur];
}
function save(now){clearTimeout(saveT);const go=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('บันทึกไม่ได้ พื้นที่เก็บข้อมูลเต็ม ลองลบรูปหรือสำรองข้อมูลแล้วลบโครงการเก่า')}};now?go():saveT=setTimeout(go,250)}
addEventListener('pagehide',()=>save(true));

/* photos live in IndexedDB so the project data stays small */
const IDB={db:null,
  open(){return this.db||(this.db=new Promise((ok,no)=>{try{const r=indexedDB.open('penum-pm',1);r.onupgradeneeded=()=>r.result.createObjectStore('ph');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}}))},
  async put(k,v){const d=await this.open();return new Promise((ok,no)=>{const t=d.transaction('ph','readwrite');t.objectStore('ph').put(v,k);t.oncomplete=ok;t.onerror=()=>no(t.error)})},
  async get(k){const d=await this.open();return new Promise(ok=>{const r=d.transaction('ph').objectStore('ph').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)})},
  async del(k){const d=await this.open();return new Promise(ok=>{const t=d.transaction('ph','readwrite');t.objectStore('ph').delete(k);t.oncomplete=ok;t.onerror=ok})}};
const phCache={};
async function phSrc(k){if(phCache[k])return phCache[k];try{const v=await IDB.get(k);if(v)phCache[k]=v;return v||''}catch(e){return ''}}
function fillPhotos(root){(root||document).querySelectorAll('img[data-ph]').forEach(async im=>{const s=await phSrc(im.dataset.ph);if(s)im.src=s})}
function shrink(file,max=1280,q=.72){return new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',q))};im.onerror=no;im.src=fr.result};fr.onerror=no;fr.readAsDataURL(file)})}

/* file download: Artifact host downloads service when present, else a browser download */
async function download(name,data,type='application/json'){
  let svc=null;
  if(window.claude&&window.claude.use){try{svc=await Promise.race([window.claude.use('downloads'),new Promise(r=>setTimeout(()=>r(null),1500))])}catch(e){svc=null}}
  if(svc&&svc.save){try{await svc.save({filename:name,data:new Blob([data],{type})});return true}catch(e){}}
  try{const b=new Blob([data],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return true}catch(e){return false}
}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}a.remove();return ok}}

/* ---------- path binding: data-p="tasks.k123.pct" ---------- */
function walk(path){const seg=path.split('.');let o=P,i0=0;if(seg[0]==='co'){o=DB.co;i0=1}for(let i=i0;i<seg.length-1;i++){const s=seg[i];o=Array.isArray(o)&&!/^\d+$/.test(s)?o.find(x=>x.id===s):o[s];if(o==null)return null}return {o,k:seg[seg.length-1]}}
function setPath(path,v){const w=walk(path);if(!w)return;w.o[w.k]=v}
function getPath(path){const w=walk(path);return w?w.o[w.k]:undefined}

/* ---------- generic editable table ----------
   cols: {k,h,t:'text'|'num'|'date'|'sel'|'area'|'chk'|'calc', o:[[v,label]], f:row=>html, w, r:right-align, sum} */
function cell(base,r,c){
  if(c.t==='calc')return `<td class="${c.r?'r':''}">${c.f(r)}</td>`;
  const p=`${base}.${r.id}.${c.k}`,v=r[c.k]??'',w=c.w?` style="min-width:${c.w}px"`:'';
  if(c.t==='sel')return `<td${w}><select data-p="${p}" aria-label="${esc(c.h)}">${(typeof c.o==='function'?c.o(r):c.o).map(([k,l])=>`<option value="${esc(k)}"${String(k)===String(v)?' selected':''}>${esc(l)}</option>`).join('')}</select></td>`;
  if(c.t==='area')return `<td${w}><textarea data-p="${p}" rows="1" aria-label="${esc(c.h)}">${esc(v)}</textarea></td>`;
  if(c.t==='chk')return `<td class="c"><input type="checkbox" data-p="${p}" data-t="chk"${v?' checked':''} aria-label="${esc(c.h)}"></td>`;
  if(c.t==='num')return `<td${w}><input class="r" inputmode="decimal" data-p="${p}" data-t="num" value="${v===''?'':esc(v)}" aria-label="${esc(c.h)}"></td>`;
  if(c.t==='date')return `<td${w}><input type="date" data-p="${p}" value="${esc(v)}" aria-label="${esc(c.h)}"></td>`;
  return `<td${w}><input data-p="${p}" value="${esc(v)}" aria-label="${esc(c.h)}"></td>`;
}
function gtable(base,rows,cols,o={}){
  const del=o.del!==false;
  const head=`<tr>${cols.map(c=>`<th class="${c.r||c.t==='num'?'r':''}">${c.h}</th>`).join('')}${o.extra?'<th></th>':''}${del?'<th></th>':''}</tr>`;
  const body=rows.length?rows.map(r=>`<tr${o.rowCls?` class="${o.rowCls(r)}"`:''}>${cols.map(c=>cell(base,r,c)).join('')}${o.extra?`<td style="white-space:nowrap">${o.extra(r)}</td>`:''}${del?`<td><button type="button" class="x" data-a="delRow" data-c="${base}" data-id="${r.id}" title="ลบแถว" aria-label="ลบแถว">✕</button></td>`:''}</tr>`).join('')
    :`<tr><td colspan="${cols.length+(del?1:0)+(o.extra?1:0)}" class="empty">${o.empty||'ยังไม่มีรายการ'}</td></tr>`;
  const tot=cols.some(c=>c.sum)&&rows.length?`<tr class="tot">${cols.map((c,i)=>`<td class="r">${c.sum?fmt(sum(rows,c.sum)):(i===0?'รวม':'')}</td>`).join('')}${o.extra?'<td></td>':''}${del?'<td></td>':''}</tr>`:'';
  return `<div class="tw"><table${o.cls?` class="${o.cls}"`:''}><thead>${head}</thead><tbody>${body}${tot}</tbody></table></div>`;
}
function tsvOf(rows,cols){return [cols.map(c=>c.h.replace(/<[^>]+>/g,'')).join('\t'),...rows.map(r=>cols.map(c=>{const v=c.t==='calc'?(c.tv?c.tv(r):String(c.f(r)).replace(/<[^>]+>/g,'')):c.t==='sel'?((typeof c.o==='function'?c.o(r):c.o).find(x=>String(x[0])===String(r[c.k]))||['',''])[1]:r[c.k]??'';return String(v).replace(/[\t\n]/g,' ')}).join('\t'))].join('\n')}
const TABLES={};// key -> {rows(),cols} for copy buttons
function copyBtn(key){return `<button type="button" class="btn sm" data-a="copyTbl" data-k="${key}">คัดลอกตาราง (วางใน Excel)</button>`}

/* ---------- shared lookups ---------- */
const itemName=it=>[it.head,it.type,it.desc].filter(Boolean).join(' · ');
const vName=id=>(P.vendors.find(v=>v.id===id)||{}).name||'–';
const subName=id=>(P.subs.find(v=>v.id===id)||{}).name||'–';
const boqCost=it=>n(it.q)*(n(it.m)+n(it.l));
const groupsInBoq=()=>[...new Set(P.boq.items.map(i=>i.g))].filter(Boolean);
function contract(){
  const I=P.info,base=I.cvAuto&&P.boq.items.length?(n(P.boq.sub)+n(P.boq.ohp)):n(I.cv);
  const vo=sum(P.vos.filter(v=>v.status==='ok'),v=>(v.type==='omit'?-1:1)*n(v.amt));
  return {base,vo,total:base+vo};
}

/* ---------- UI state ---------- */
const UIKEY='penum.pm.ui';
let S={mode:'pj',ctab:'exec',tab:'dash',sub:{},sel:{},zoom:'w',bg:'',pick:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem(UIKEY)||'{}'));S.pick={}}catch(e){}
const saveUI=()=>{try{const {pick,...r}=S;localStorage.setItem(UIKEY,JSON.stringify(r))}catch(e){}};
const COTABS=[['exec','ภาพรวมบริษัท'],['sales','ขายและใบเสนอราคา'],['acct','บัญชีการเงิน'],['hr','บุคคลและแรงงาน'],['svc','บริการหลังการขาย'],['coset','ตั้งค่าบริษัท']];
const TABS=[['dash','ภาพรวม'],['sched','แผนงาน'],['buy','จัดซื้อและวัสดุ'],['cost','งบและเบิกงวด'],['site','หน้างาน'],['docs','เอกสาร'],['hand','ส่งมอบ'],['setup','ข้อมูลโครงการและ BOQ']];
const VIEWS={},CVIEWS={};const curTab=()=>S.mode==='co'?S.ctab:S.tab;

/* ---------- schedule: forward/backward pass, weights, plan vs actual ---------- */
const durOf=t=>Math.max(0,Math.round(n(t.dur)));
function sched(){
  const T=P.tasks,by={},st=okD(P.info.start)?P.info.start:today(),R={};
  T.forEach(t=>{by[t.id]=t;R[t.id]={es:okD(t.start)?t.start:st,ef:''}});
  const deps=t=>(t.dep||[]).filter(d=>by[d.id]&&d.id!==t.id);
  const gap=(p,lag)=>(durOf(p)>0?1:0)+n(lag);
  for(let pass=0;pass<=T.length;pass++){let ch=false;
    T.forEach(t=>{let es=okD(t.start)?t.start:st;
      deps(t).forEach(x=>{const r=R[x.id];if(r.ef){const c=addD(r.ef,gap(by[x.id],x.lag));if(c>es)es=c}});
      const d=durOf(t),ef=d>0?addD(es,d-1):es;if(R[t.id].es!==es||R[t.id].ef!==ef){R[t.id]={es,ef};ch=true}});
    if(!ch)break}
  const fin=T.reduce((m,t)=>R[t.id].ef>m?R[t.id].ef:m,st),succ={};
  T.forEach(t=>deps(t).forEach(x=>(succ[x.id]=succ[x.id]||[]).push({t,lag:x.lag})));
  T.forEach(t=>{R[t.id].lf=fin});
  for(let pass=0;pass<=T.length;pass++){let ch=false;
    T.forEach(t=>{let lf=fin;(succ[t.id]||[]).forEach(s=>{const c=addD(R[s.t.id].ls||fin,-gap(t,s.lag));if(c<lf)lf=c});
      const d=durOf(t),ls=d>0?addD(lf,-(d-1)):lf;if(R[t.id].lf!==lf||R[t.id].ls!==ls){R[t.id].lf=lf;R[t.id].ls=ls;ch=true}});
    if(!ch)break}
  // weights: BOQ value of the task's work group, shared among that group's tasks by duration; manual value wins
  const gT={},gD={};P.boq.items.forEach(i=>gT[i.g]=(gT[i.g]||0)+n(i.t||boqCost(i)));
  T.forEach(t=>{if(t.g&&gT[t.g])gD[t.g]=(gD[t.g]||0)+Math.max(1,durOf(t))});
  const linked=T.some(t=>t.g&&gT[t.g]);
  T.forEach(t=>{const r=R[t.id];r.w=n(t.w)>0?n(t.w):t.g&&gT[t.g]?gT[t.g]*Math.max(1,durOf(t))/gD[t.g]:linked?0:durOf(t);
    r.fl=diffD(r.es,r.ls);r.crit=r.fl<=0&&T.length>1;r.done=n(t.pct)>=100});
  const W=sum(T,t=>R[t.id].w)||1;
  return {R,st,fin,W,
    planAt(d){return 100*sum(T,t=>{const r=R[t.id],a=okD(t.bs)?t.bs:r.es,b=okD(t.bf)?t.bf:r.ef;if(d<a)return 0;if(d>=b)return r.w;return r.w*(diffD(a,d)+1)/(diffD(a,b)+1)})/W},
    act(){return sum(T,t=>R[t.id].w*Math.min(100,n(t.pct))/100)*100/W},
    gAct(g){const L=T.filter(t=>t.g===g),w=sum(L,t=>Math.max(1,durOf(t)));return w?sum(L,t=>Math.max(1,durOf(t))*Math.min(100,n(t.pct)))/w:null}};
}

  t.dep=String(v).split(/[,;\s]+/).filter(Boolean).map(s=>{const k=s.match(/^(\d+)\s*([+-]\s*\d+)?$/);if(!k)return null;const p=P.tasks[+k[1]-1];return p&&p.id!==t.id?{id:p.id,lag:k[2]?n(k[2].replace(/\s/g,'')):0}:null}).filter(Boolean)});

/* S-curve */
function scurve(wd=760,ht=260){
  const s=sched();if(!P.tasks.length)return '<p class="empty">ยังไม่มีแผนงาน</p>';
  const a=P.tasks.reduce((m,t)=>{const x=okD(t.bs)&&t.bs<m?t.bs:m;return s.R[t.id].es<x?s.R[t.id].es:x},s.st),b=P.tasks.reduce((m,t)=>okD(t.bf)&&t.bf>m?t.bf:m,s.fin),span=Math.max(1,diffD(a,b));
  const L=44,Rr=14,T=14,B=30,X=d=>L+(wd-L-Rr)*Math.max(0,Math.min(1,diffD(a,d)/span)),Y=v=>T+(ht-T-B)*(1-v/100);
  const step=Math.max(1,Math.round(span/40)),pts=[];for(let k=0;k<=span;k+=step)pts.push(addD(a,k));pts.push(b);
  const plan=pts.map((d,i)=>`${i?'L':'M'}${X(d).toFixed(1)},${Y(s.planAt(d)).toFixed(1)}`).join('');
  const hk=Object.keys(P.hist).filter(okD).sort(),td=today(),cur=s.act();
  const ah=[...hk.filter(d=>d<td).map(d=>[d,P.hist[d]]),[td,cur]].filter(x=>x[0]>=a);
  const act=ah.map(([d,v],i)=>`${i?'L':'M'}${X(d).toFixed(1)},${Y(v).toFixed(1)}`).join('');
  const grid=[0,25,50,75,100].map(v=>`<line x1="${L}" x2="${wd-Rr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}%</text>`).join('');
  const months=[];let m=pd(a);m.setDate(1);m.setMonth(m.getMonth()+1);while(iso(m)<=b){months.push(iso(m));m.setMonth(m.getMonth()+1)}
  const ev=Math.ceil(months.length/8)||1;
  const mx=months.filter((_,i)=>i%ev===0).map(d=>`<line x1="${X(d)}" x2="${X(d)}" y1="${T}" y2="${ht-B}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="${X(d)}" y="${ht-B+16}" text-anchor="middle" font-size="11" fill="var(--muted)">${pd(d).toLocaleDateString('th-TH',{month:'short',year:'2-digit'})}</text>`).join('');
  const tx=td>=a&&td<=b?`<line x1="${X(td)}" x2="${X(td)}" y1="${T}" y2="${ht-B}" stroke="var(--danger)" stroke-dasharray="4 3"/><text x="${X(td)+4}" y="${T+10}" font-size="11" fill="var(--danger)">วันนี้</text>`:'';
  return `<svg class="chart" viewBox="0 0 ${wd} ${ht}" role="img" aria-label="กราฟความคืบหน้าแผนเทียบจริง">${grid}${mx}${tx}
    <path d="${plan}" fill="none" stroke="var(--plan)" stroke-width="2.5"/><path d="${act}" fill="none" stroke="var(--act)" stroke-width="3"/>
    ${ah.length?`<circle cx="${X(td)}" cy="${Y(cur)}" r="4.5" fill="var(--act)"/>`:''}</svg>
    <div class="legend"><span><i style="background:var(--plan)"></i>ตามแผน ${pct(s.planAt(td))}</span><span><i style="background:var(--act)"></i>ทำได้จริง ${pct(cur)}</span></div>`;
}

VIEWS.sched=()=>{
  const s=sched(),T=P.tasks,td=today(),px={d:26,w:7,m:2.4}[S.zoom]||7;
  let a=s.st,b=s.fin;T.forEach(t=>{if(okD(t.bs)&&t.bs<a)a=t.bs;if(okD(t.bf)&&t.bf>b)b=t.bf;if(s.R[t.id].es<a)a=s.R[t.id].es});
  const ad=pd(a);ad.setDate(ad.getDate()-((ad.getDay()+6)%7));a=iso(ad);b=addD(b,14);
  const days=diffD(a,b)+1,Wd=Math.round(days*px),X=d=>diffD(a,d)*px;
  let hdr='';const m=pd(a);m.setDate(1);while(iso(m)<=b){const d=iso(m);if(d>=a||1){const x=Math.max(0,X(d));hdr+=`<span class="gh m" style="left:${x}px">${pd(d).toLocaleDateString('th-TH',{month:'short',year:'2-digit'})}</span>`}m.setMonth(m.getMonth()+1)}
  const wk=S.zoom==='m'?28:7;for(let k=0;k<days;k+=wk){const d=addD(a,k);hdr+=`<span class="gh w" style="left:${X(d)}px">${S.zoom==='d'?thD(d).split(' ')[0]+' '+thD(d).split(' ')[1]:pd(d).getDate()}</span>`;if(S.zoom==='d')for(let j=1;j<7;j++){}}
  const bg=`background-image:repeating-linear-gradient(to right,var(--line) 0 1px,transparent 1px ${wk*px}px);background-size:${Wd}px 100%`;
  const tdl=td>=a&&td<=b?`<span class="gtd" style="left:${X(td)}px"></span>`:'';
  const rows=T.map((t,i)=>{const r=s.R[t.id],d=durOf(t),p=Math.min(100,n(t.pct)),late=!r.done&&r.ef<td;
    const base=okD(t.bs)&&okD(t.bf)?`<span class="gbl" style="left:${X(t.bs)}px;width:${Math.max(3,(diffD(t.bs,t.bf)+1)*px)}px" title="แผนฐาน ${thD(t.bs)} – ${thD(t.bf)}"></span>`:'';
    const bar=d>0?`<span class="gb${r.crit?' crit':''}" style="left:${X(r.es)}px;width:${Math.max(3,d*px)}px" title="${esc(t.name)} ${thD(r.es)} – ${thD(r.ef)} · ${p}%"><i style="width:${p}%"></i></span>`:`<span class="gm${p>=100?' done':''}" style="left:${X(r.es)+px/2}px" title="${esc(t.name)} ${thD(r.es)}"></span>`;
    return `<tr class="${r.crit?'crit':''}"><td class="muted r">${i+1}</td>
      <td class="nm"><input data-p="tasks.${t.id}.name" value="${esc(t.name)}" aria-label="ชื่องาน"></td>
      <td><select data-p="tasks.${t.id}.g" aria-label="หมวดงาน BOQ" style="width:150px">${G_OPTS().map(([k,l])=>`<option value="${k}"${k===(t.g||'')?' selected':''}>${esc(l)}</option>`).join('')}</select></td>

PRINT.sched=()=>{const s=sched();return phead('แผนงานโครงการ',`ความคืบหน้า ${pct(s.act())} (แผน ${pct(s.planAt(today()))})`)+`<table><thead><tr><th>#</th><th>งาน</th><th>เริ่ม</th><th>เสร็จ</th><th>วัน</th><th>ก่อนหน้า</th><th>%</th></tr></thead><tbody>${P.tasks.map((t,i)=>{const r=s.R[t.id];return `<tr><td>${i+1}</td><td>${r.crit?'<b>':''}${esc(t.name)}${r.crit?'</b>':''}</td><td>${thD(r.es)}</td><td>${thD(r.ef)}</td><td>${durOf(t)}</td><td>${depTxt(t)}</td><td>${n(t.pct)}</td></tr>`}).join('')}</tbody></table><h3 style="margin-top:14px">S-Curve</h3>${scurve(900,260)}`};

/* ---------- purchasing: BOQ materials → PR → quotes → PO → deliveries ---------- */
const poTotal=po=>{const s=sum(po.items,l=>n(l.q)*n(l.p)),v=po.novat?0:s*n(P.info.vat)/100;return {s,v,t:s+v}};
const recvOf=(po,lid)=>sum((po.dl||[]).filter(d=>d.line===lid),d=>d.q);
function poState(po){const td=today();let full=true,any=false;po.items.forEach(l=>{const r=recvOf(po,l.id);if(r>0)any=true;if(r<n(l.q))full=false});
  const late=!full&&okD(po.due)&&po.due<td;
  return full&&po.items.length?{k:'ok',l:'ส่งครบ'}:late?{k:'bad',l:any?'ส่งบางส่วน · ล่าช้า':'ล่าช้า'}:any?{k:'warn',l:'ส่งบางส่วน'}:{k:'',l:'รอส่ง'}}
const orderedOf=bid=>sum(P.pos.flatMap(p=>p.items).filter(l=>l.bid===bid),l=>l.q);
const requestedOf=bid=>sum(P.prs.filter(r=>!r.po).flatMap(r=>r.items).filter(l=>l.bid===bid),l=>l.q);
function needDate(g){const s=sched(),L=P.tasks.filter(t=>t.g===g);if(!L.length)return '';const es=L.map(t=>s.R[t.id].es).sort()[0];return addD(es,-7)}

  const nd=its.map(i=>needDate(i.g)).filter(Boolean).sort();pr.need=nd[0]||addD(today(),14);
  P.prs.push(pr);S.pick={};S.sub.buy='pr';S.sel.pr=pr.id;save();render();toast(`สร้างใบขอซื้อ ${pr.no} แล้ว`)};
ACT.addQ=b=>{const pr=P.prs.find(r=>r.id===b.dataset.id);if(!pr)return;const used=pr.qs.map(q=>q.vid);const v=P.vendors.find(v=>!used.includes(v.id));pr.qs.push({id:uid(),vid:v?v.id:'',p:{},days:7,credit:30,note:''});save();render()};

  if(!q.vid){toast('เลือกผู้ขายของใบเสนอราคานี้ก่อน');return}

function costTable(){
  const G={},row=g=>G[g]||(G[g]={g,bud:0,po:0,sub:0,exp:0,paid:0});
  P.boq.items.forEach(i=>row(i.g).bud+=boqCost(i));
  P.pos.forEach(p=>{const k=p.novat?1:1;p.items.forEach(l=>{const v=n(l.q)*n(l.p)*k;row(l.g||'').po+=v;if(p.paid)row(l.g||'').paid+=v})});
  P.subs.forEach(s=>row(s.g||'').sub+=n(s.value));
  P.spay.forEach(x=>{const s=P.subs.find(y=>y.id===x.sub);row(s?s.g||'':'').paid+=n(x.amt)});
  P.costs.forEach(c=>{row(c.g||'').exp+=n(c.amt);row(c.g||'').paid+=n(c.amt)});
  if(typeof labCost==='function'){const v=labCost(P.id);if(v){row('lab').exp+=v;row('lab').paid+=v}}
  const L=Object.values(G).map(r=>Object.assign(r,{com:r.po+r.sub+r.exp,fc:Math.max(r.bud,r.po+r.sub+r.exp)}));
  const order=[...Object.keys(BOQ_G),'lab'];L.sort((a,b)=>(order.indexOf(a.g)+99*!a.g)-(order.indexOf(b.g)+99*!b.g));
  const T={bud:sum(L,r=>r.bud),com:sum(L,r=>r.com),paid:sum(L,r=>r.paid),fc:sum(L,r=>r.fc)};return {L,T};
}

const BKIND=[['prog','เบิกงวดงาน'],['adv','เบิกเงินล่วงหน้า'],['ret','คืนเงินประกันผลงาน']];

function unitVal(){const t=sum(P.boq.items,i=>n(i.t||boqCost(i)));const k=t?contract().base/t:0;return i=>n(i.t||boqCost(i))/Math.max(1e-9,n(i.q))*k}
function billsSorted(){return P.bills.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')||String(a.no).localeCompare(String(b.no),undefined,{numeric:true}))}
function cumVal(b){if(!b)return 0;const uv=unitVal();return sum(P.boq.items,i=>Math.min(n(i.q),n((b.qty||{})[i.id]))*uv(i))+sum(P.vos.filter(v=>v.status==='ok'),v=>(v.type==='omit'?-1:1)*n(v.amt)*Math.min(100,n((b.vo||{})[v.id]))/100)}
function billCalc(b){
  const I=P.info,C=contract(),prog=billsSorted().filter(x=>(x.kind||'prog')==='prog');
  let amt=0,cum=0;
  if(b.kind==='adv')amt=C.base*n(I.adv)/100;
  else if(b.kind==='ret')amt=sum(P.bills.filter(x=>x.id!==b.id&&(x.kind||'prog')==='prog'),x=>billCalc(x).ret);
  else if(I.billMode==='pct'){const it=(P.inst||[]).find(x=>x.id===b.inst);amt=it?C.total*n(it.pct)/100:0;cum=sum(prog.slice(0,prog.indexOf(b)+1),x=>{const k=(P.inst||[]).find(y=>y.id===x.inst);return k?n(k.pct):0})}
  else{const i=prog.indexOf(b);cum=cumVal(b);amt=cum-(i>0?cumVal(prog[i-1]):0);cum=C.total?cum*100/C.total:0}
  const isP=(b.kind||'prog')==='prog',adv=isP?amt*n(I.adv)/100:0,ret=isP?amt*n(I.ret)/100:0,base=amt-adv,vat=base*n(I.vat)/100,wht=base*n(I.wht)/100;
  return {amt,adv,ret,base,vat,wht,net:base+vat-wht-ret,cum};
}

  return {no:nextNo('INV-',arr),date:today(),kind:'prog',inst:ni?ni.id:'',qty:prev?Object.assign({},prev.qty):{},vo:prev?Object.assign({},prev.vo||{}):{},status:'draft',paid:'',note:''}};

function costSum(){

    margin=C.total-T.fc,ret=sum(bl.filter(([b])=>(b.kind||'prog')==='prog'&&b.status!=='draft'),x=>x[1].ret)-sum(bl.filter(([b])=>b.kind==='ret'&&b.status==='paid'),x=>x[1].amt);
  const bar=(v,m)=>`<div class="bar"><i style="width:${Math.min(100,m?v*100/m:0)}%;${v>m&&m?'background:var(--danger)':''}"></i></div>`;

ACT.pasteGo=()=>{const r=parseBoqTSV($('#boqTxt').value);if(!r.items.length){toast('ไม่พบรายการ BOQ ในข้อความที่วาง');return}setBoq(r.items,{src:'วางจาก PENUM MEP',sub:r.sub,ohp:r.ohp,vat:r.vat,grand:r.grand});$('#dlg').close();save();render();toast(`นำเข้า BOQ ${r.items.length} รายการแล้ว`)};
function parseBoqTSV(txt){
  const GL={};Object.entries(BOQ_G).forEach(([k,v])=>GL[v]=k);
  let g='',head='',type='';const items=[],tot={};
  txt.split(/\r?\n/).forEach(line=>{const c=line.split('\t');const a=(c[0]||'').trim(),b=(c[1]||'');const bt=b.trim();if(!bt)return;
    const num=k=>c[k]!=null&&/^-?[\d,]+(\.\d+)?$/.test(String(c[k]).trim())?n(c[k]):null;
    if(/^รวมค่าของและค่าแรง/.test(bt)){tot.sub=num(8);return}if(/^ค่าดำเนินการ/.test(bt)){tot.ohp=num(11);return}if(/^VAT/.test(bt)){tot.vat=num(11);return}if(/^รวมทั้งสิ้น/.test(bt)){tot.grand=num(11);return}
    if(/^หมวด/.test(bt)&&/^[A-Z]$/.test(a))return;
    if(/^\d+$/.test(a)&&GL[bt]){g=GL[bt];head='';type='';return}
    const q=num(2);
    if(q==null){if(/^\d+\.\d+$/.test(a)){head=bt;type=''}else if(!a&&/^\s{2}/.test(b))type=bt;return}
    const sub=/^\s*-\s/.test(b);if(!sub){head='';type=''}
    items.push({g,head:sub?head:'',type:sub?type:'',desc:bt.replace(/^-\s*/,''),unit:(c[3]||'').trim(),q,m:n(c[4]),l:n(c[6]),t:n(c[11])||n(c[8])});
  });
  return {items,sub:tot.sub||sum(items,i=>i.t),ohp:tot.ohp||0,vat:tot.vat||0,grand:tot.grand||0};
}

VIEWS.dash=()=>{

function cashflow(ps,months=12){
  const td=today(),M={},add=(d,k,v)=>{if(!okD(d)||!v)return;const m=ym(d);(M[m]=M[m]||{in:0,po:0,sub:0,exp:0,fin:0,fout:0})[k]+=v};
  ps.forEach(p=>withP(p,()=>{
    let billed=0;p.bills.forEach(b=>{const c=billCalc(b);if(b.status==='paid')add(b.paid||b.date,'in',c.net);else if(b.status!=='draft')add(maxD(billDue(p,b),td),'in',c.net);if(b.status!=='draft'&&(b.kind||'prog')==='prog')billed+=c.amt});
    p.pos.forEach(po=>{const t=poTotal(po).t;if(po.paid)add(po.paidDate||po.date,'po',t);else add(maxD(poPayDue(po),td),'po',t)});
    p.spay.forEach(x=>add(x.date,'sub',n(x.amt)));p.costs.forEach(x=>add(x.date,'exp',n(x.amt)));labEntries(p.id).forEach(e=>add(e.date,'exp',e.cost));
    // forecast: unbilled contract and uncommitted budget follow the plan curve
    if(!p.tasks.length)return;const s=sched(),C=contract(),{T}=costTable(),k=1+n(p.info.vat)/100-n(p.info.wht)/100-n(p.info.ret)/100;
    const leftIn=Math.max(0,C.total-billed),leftOut=Math.max(0,T.bud-T.com)+Math.max(0,sum(p.subs,x=>x.value)-sum(p.spay,x=>x.amt)),now=s.planAt(td);
    if(now>=99.9)return;let prev=now;for(let i=0;i<36;i++){const d0=pd(td);d0.setDate(1);d0.setMonth(d0.getMonth()+i+1);const e=iso(new Date(d0-864e5)),v=s.planAt(e<td?td:e),f=(v-prev)/(100-now);prev=v;if(f<=0)continue;
      add(addD(e,30),'fin',leftIn*f*k);add(e,'fout',leftOut*f*1.07);if(v>=99.9)break}
  }));
  const keys=Object.keys(M).sort(),first=keys[0]||ym(td),L=[];let m=pd(first+'-01'),cum=0;const end=keys[keys.length-1]||ym(td);
  while(ym(iso(m))<=end&&L.length<60){const k=ym(iso(m)),r=M[k]||{in:0,po:0,sub:0,exp:0,fin:0,fout:0};const net=r.in+r.fin-r.po-r.sub-r.exp-r.fout;cum+=net;L.push(Object.assign({k,net,cum},r));m.setMonth(m.getMonth()+1)}
  return L;
}
const maxD=(a,b)=>a>b?a:b;
function cfChart(L){if(!L.length)return '';const wd=900,ht=230,l=70,r=10,t=12,bt=28,mx=Math.max(1,...L.map(x=>Math.max(Math.abs(x.net),Math.abs(x.cum)))),bw=(wd-l-r)/L.length,Y=v=>t+(ht-t-bt)/2*(1-v/mx),td=ym(today());
  return `<svg class="chart" viewBox="0 0 ${wd} ${ht}" role="img" aria-label="กระแสเงินสดรายเดือน"><line x1="${l}" x2="${wd-r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--muted)"/>
  ${[mx,mx/2,-mx/2,-mx].map(v=>`<line x1="${l}" x2="${wd-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${l-6}" y="${Y(v)+4}" text-anchor="end" font-size="10.5" fill="var(--muted)">${fmt(v/1e6,1)} ล.</text>`).join('')}
  ${L.map((x,i)=>`<rect x="${l+i*bw+bw*.18}" width="${bw*.64}" y="${Math.min(Y(0),Y(x.net))}" height="${Math.max(1,Math.abs(Y(x.net)-Y(0)))}" fill="${x.net>=0?'var(--good)':'var(--danger)'}" opacity="${x.k>td?.45:.85}" rx="2"><title>${thM(x.k)} สุทธิ ${fmt(x.net)}</title></rect>${L.length<=18||i%2===0?`<text x="${l+i*bw+bw/2}" y="${ht-10}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${thM(x.k)}</text>`:''}`).join('')}
  <path d="${L.map((x,i)=>`${i?'L':'M'}${(l+i*bw+bw/2).toFixed(1)},${Y(x.cum).toFixed(1)}`).join('')}" fill="none" stroke="var(--accent)" stroke-width="2.5"/></svg>
  <div class="legend"><span><i style="background:var(--good)"></i>เงินเข้าสุทธิ</span><span><i style="background:var(--danger)"></i>เงินออกสุทธิ</span><span><i style="background:var(--accent)"></i>สะสม</span><span>สีจาง = คาดการณ์</span></div>`}
CVIEWS.acct=()=>{const {cur,html}=subTabs('acct',[['ar','ลูกหนี้ (เงินรับ)'],['ap','เจ้าหนี้ (เงินจ่าย)'],['cf','กระแสเงินสด']]);return html+({ar:acctAR,ap:acctAP,cf:acctCF}[cur])()};
function acctAR(){const td=today(),R=arRows().sort((a,b)=>a.due.localeCompare(b.due)),open=R.filter(x=>x.b.status!=='paid');
  const age=d=>{const k=diffD(d,td);return k<=0?0:k<=30?1:k<=60?2:3},bk=[0,0,0,0];open.forEach(x=>bk[age(x.due)]+=x.c.net);
  return `<dl class="stats"><div><dt>ลูกหนี้ค้างรับทั้งหมด</dt><dd>${fmt(sum(open,x=>x.c.net))}</dd></div><div><dt>ยังไม่ถึงกำหนด</dt><dd>${fmt(bk[0])}</dd></div><div><dt>เกิน 1–30 วัน</dt><dd style="color:var(--warn-c)">${fmt(bk[1])}</dd></div><div><dt>เกิน 31–60 วัน</dt><dd style="color:var(--danger)">${fmt(bk[2])}</dd></div><div><dt>เกิน 60 วัน</dt><dd style="color:var(--danger)">${fmt(bk[3])}</dd></div></dl>
  <section class="card"><h2><span>ใบแจ้งหนี้ / ใบเบิกงวดทุกโครงการ</span><small>ใบที่ยังเป็น “ร่าง” ไม่แสดง ออกใบแจ้งหนี้จากแท็บเบิกงวดของแต่ละโครงการ</small></h2>
  <div class="tw"><table><thead><tr><th>โครงการ</th><th>เลขที่</th><th>วันที่</th><th>ครบกำหนด</th><th class="r">รับสุทธิ</th><th>สถานะ</th><th></th></tr></thead><tbody>
  ${R.length?R.map(({p,b,c,due})=>{const late=b.status!=='paid'&&due<td;return `<tr><td>${esc(p.name)}</td><td><b>${esc(b.no)}</b></td><td>${thD(b.date)}</td><td>${late?`<span class="pill bad">${thD(due)} · เกิน ${diffD(due,td)} วัน</span>`:thD(due)}</td><td class="r">${fmt(c.net)}</td><td>${b.status==='paid'?`<span class="pill ok">รับแล้ว ${thD(b.paid)}</span>`:`<span class="pill info">${BSTAT.find(s=>s[0]===b.status)[1]}</span>`}</td>
    <td style="white-space:nowrap">${b.status!=='paid'?`<button type="button" class="btn sm" data-a="arPaid" data-p="${p.id}" data-id="${b.id}">รับเงินแล้ว</button>`:''} <button type="button" class="btn sm" data-a="printTax" data-p="${p.id}" data-id="${b.id}">ใบกำกับภาษี</button></td></tr>`}).join(''):'<tr><td colspan="7" class="empty">ยังไม่มีใบแจ้งหนี้</td></tr>'}</tbody></table></div></section>`}
ACT.printTax=b=>{const p=DB.projects[b.dataset.p];if(!p)return;$('#print').innerHTML=withP(p,()=>taxInv(b.dataset.id));setTimeout(()=>print(),300)};
function taxInv(id){const b=P.bills.find(x=>x.id===id);if(!b)return '';const c=billCalc(b),cu=CO().customers.find(x=>x.id===P.info.cust)||{},k=b.kind||'prog',I=P.info;
  const what=k==='adv'?'เงินล่วงหน้า':k==='ret'?'คืนเงินประกันผลงาน':I.billMode==='pct'?`ค่างานงวดที่ ${esc(((P.inst||[]).find(x=>x.id===b.inst)||{}).no||'')}`:`ค่างานตามผลงานสะสม ${fmt(c.cum,2)}%`;
  return cphead(`ใบแจ้งหนี้ / ใบกำกับภาษี ${esc(b.no)}`,`วันที่ ${thDL(b.date)}<br>ครบกำหนดชำระ ${thDL(billDue(P,b))}`)+`<div class="meta"><div><b>ลูกค้า</b> ${esc(cu.name||I.client||'')}<br>${esc(cu.addr||'')}<br>${cu.tax?'เลขประจำตัวผู้เสียภาษี '+esc(cu.tax):''}</div><div>โครงการ ${esc(P.name)}<br>สัญญาเลขที่ ${esc(I.contractNo||'')}</div></div>
  <table><thead><tr><th>รายการ</th><th>จำนวนเงิน</th></tr></thead><tbody><tr><td>${what} โครงการ ${esc(P.name)}</td><td style="text-align:right">${fmt(c.amt,2)}</td></tr>${c.adv?`<tr><td>หักคืนเงินล่วงหน้า</td><td style="text-align:right">-${fmt(c.adv,2)}</td></tr>`:''}
  <tr><td>มูลค่าก่อนภาษี</td><td style="text-align:right">${fmt(c.base,2)}</td></tr><tr><td>ภาษีมูลค่าเพิ่ม ${n(I.vat)}%</td><td style="text-align:right">${fmt(c.vat,2)}</td></tr><tr><td><b>รวมเงิน</b></td><td style="text-align:right"><b>${fmt(c.base+c.vat,2)}</b></td></tr>
  ${c.ret?`<tr><td>หักเงินประกันผลงาน ${n(I.ret)}%</td><td style="text-align:right">-${fmt(c.ret,2)}</td></tr>`:''}<tr><td>หักภาษี ณ ที่จ่าย ${n(I.wht)}% (ลูกค้าหัก)</td><td style="text-align:right">-${fmt(c.wht,2)}</td></tr><tr><td><b>ยอดชำระสุทธิ</b></td><td style="text-align:right"><b>${fmt(c.net,2)}</b></td></tr></tbody></table>
  <div class="sign"><div>ผู้รับเงิน</div><div>ผู้มีอำนาจลงนาม</div><div>ผู้รับวางบิล</div></div>`}
function acctAP(){const td=today(),R=apRows().sort((a,b)=>a.due.localeCompare(b.due)),open=R.filter(x=>!x.po.paid);
  return `<dl class="stats"><div><dt>เจ้าหนี้ค้างจ่าย</dt><dd>${fmt(sum(open,x=>x.t))}</dd></div><div><dt>ถึงกำหนดใน 7 วัน</dt><dd>${fmt(sum(open.filter(x=>x.due>=td&&x.due<=addD(td,7)),x=>x.t))}</dd></div><div><dt>เลยกำหนดจ่าย</dt><dd style="color:var(--danger)">${fmt(sum(open.filter(x=>x.due<td),x=>x.t))}</dd></div></dl>
  <section class="card"><h2><span>ใบสั่งซื้อที่ต้องจ่ายเงิน</span><small>ครบกำหนด = วันที่รับของล่าสุด + เครดิต</small></h2>
  <div class="tw"><table><thead><tr><th>โครงการ</th><th>PO</th><th>ผู้ขาย</th><th>ครบกำหนดจ่าย</th><th class="r">ยอดรวม VAT</th><th>สถานะ</th><th></th></tr></thead><tbody>
  ${R.length?R.map(({p,po,t,due})=>`<tr><td>${esc(p.name)}</td><td><b>${esc(po.no)}</b></td><td>${esc(withP(p,()=>vName(po.vid)))}</td><td>${!po.paid&&due<td?`<span class="pill bad">${thD(due)}</span>`:thD(due)}</td><td class="r">${fmt(t)}</td><td>${po.paid?`<span class="pill ok">จ่ายแล้ว ${thD(po.paidDate)}</span>`:'<span class="pill">ค้างจ่าย</span>'}</td><td>${po.paid?'':`<button type="button" class="btn sm" data-a="apPaid" data-p="${p.id}" data-id="${po.id}">จ่ายแล้ว</button>`}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">ยังไม่มี PO</td></tr>'}</tbody></table></div></section>`}
function acctCF(){const sel=S.sel.cfp||'',ps=sel?[DB.projects[sel]].filter(Boolean):projects(),L=cashflow(ps),td=ym(today());
  const row=(h,k,sg)=>`<tr><td>${h}</td>${L.map(x=>`<td class="r${x.k>td?' muted':''}">${x[k]?fmt(sg*x[k]):''}</td>`).join('')}</tr>`;
  return `<section class="card"><h2><span>กระแสเงินสดรายเดือน</span><small>เดือนที่ผ่านมาใช้ยอดจริง เดือนข้างหน้าใช้ใบที่ออกแล้วและคาดการณ์ส่วนที่เหลือตามแผนงาน</small></h2>
  <div class="row" style="margin-bottom:10px"><select id="cfSel" aria-label="โครงการ"><option value="">ทุกโครงการ</option>${projects().map(p=>`<option value="${p.id}"${p.id===sel?' selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
  ${cfChart(L)}<div class="tw" style="margin-top:12px"><table><thead><tr><th></th>${L.map(x=>`<th class="r">${thM(x.k)}</th>`).join('')}</tr></thead><tbody>
  ${row('รับจากลูกค้า','in',1)}${row('รับ (คาดการณ์)','fin',1)}${row('จ่ายผู้ขาย','po',-1)}${row('จ่ายผู้รับเหมาช่วง','sub',-1)}${row('ค่าใช้จ่ายอื่น','exp',-1)}${row('จ่าย (คาดการณ์)','fout',-1)}
  <tr class="tot"><td>สุทธิ</td>${L.map(x=>`<td class="r" style="color:${x.net<0?'var(--danger)':'inherit'}">${fmt(x.net)}</td>`).join('')}</tr><tr class="tot"><td>สะสม</td>${L.map(x=>`<td class="r" style="color:${x.cum<0?'var(--danger)':'inherit'}">${fmt(x.cum)}</td>`).join('')}</tr></tbody></table></div></section>`}
document.addEventListener('change',e=>{if(e.target.id==='cfSel'){S.sel.cfp=e.target.value;render()}});

/* ---------- owner dashboard across projects ---------- */
function pjSummary(p){return withP(p,()=>{const s=sched(),td=today(),C=contract(),{T}=costTable(),bl=p.bills.map(b=>[b,billCalc(b)]);
  const billed=sum(bl.filter(([b])=>b.status!=='draft'),x=>x[1].amt),recv=sum(bl.filter(([b])=>b.status==='paid'),x=>x[1].net),ar=sum(bl.filter(([b])=>b.status!=='draft'&&b.status!=='paid'),x=>x[1].net);
  const act=p.tasks.length?s.act():0,plan=p.tasks.length?s.planAt(td):0;
  return {p,C,act,plan,T,margin:C.total-T.fc,billed,recv,ar,issues:p.rfis.filter(r=>r.status==='open').length+p.punch.filter(r=>r.status!=='done').length+p.pos.filter(x=>poState(x).k==='bad').length,done:act>=99.9&&p.tasks.length}})}
CVIEWS.exec=()=>{
  const R=projects().map(pjSummary),run=R.filter(r=>!r.done),td=today(),C=CO();
  const tot=k=>sum(R,r=>typeof k==='function'?k(r):r[k]),open=C.leads.filter(l=>!['won','lost'].includes(l.stage)),pipe=sum(open,l=>n(l.value)*(l.prob===''||l.prob==null?LPROB[l.stage]:n(l.prob))/100);
  const cf=cashflow(projects()),next=cf.filter(x=>x.k>ym(td)).slice(0,3),cash3=sum(next,x=>x.net);
  const behind=run.filter(r=>r.act<r.plan-5),loss=R.filter(r=>r.margin<0);
  return `<dl class="stats">
    <div><dt>โครงการที่กำลังทำ</dt><dd>${run.length} <small>/ ${R.length} โครงการ</small></dd></div>
    <div><dt>มูลค่างานในมือ (ยังไม่เบิก)</dt><dd>${fmt(sum(run,r=>Math.max(0,r.C.total-r.billed)))}</dd></div>
    <div><dt>กำไรขั้นต้นคาดการณ์รวม</dt><dd style="color:${tot('margin')>=0?'var(--good)':'var(--danger)'}">${fmt(tot('margin'))} <small>${tot(r=>r.C.total)?fmt(tot('margin')*100/tot(r=>r.C.total),1)+'%':''}</small></dd></div>
    <div><dt>ลูกหนี้ค้างรับ</dt><dd>${fmt(tot('ar'))}</dd></div>
    <div><dt>เงินสดสุทธิ 3 เดือนหน้า</dt><dd style="color:${cash3>=0?'var(--good)':'var(--danger)'}">${fmt(cash3)}</dd></div>
    <div><dt>งานขายถ่วงน้ำหนัก</dt><dd>${fmt(pipe)} <small>${open.length} งาน</small></dd></div></dl>
  ${behind.length||loss.length?`<section class="card" style="border-color:var(--danger)"><h2>ต้องดูแล</h2><ul style="margin:0;padding-left:20px">${behind.map(r=>`<li>${esc(r.p.name)} ช้ากว่าแผน ${fmt(r.plan-r.act,1)}%</li>`).join('')}${loss.map(r=>`<li>${esc(r.p.name)} คาดว่าขาดทุน ${fmt(-r.margin)} บาท</li>`).join('')}</ul></section>`:''}
  <section class="card"><h2><span>ทุกโครงการ</span><small>กดชื่อโครงการเพื่อเปิด</small></h2>
  <div class="tw"><table><thead><tr><th>โครงการ</th><th>ลูกค้า</th><th class="r">มูลค่าสัญญา</th><th class="r">คืบหน้า จริง/แผน</th><th class="r">ต้นทุนผูกพัน/งบ</th><th class="r">กำไรคาดการณ์</th><th class="r">เบิกแล้ว</th><th class="r">รับเงินแล้ว</th><th class="r">ค้างรับ</th><th class="r">เรื่องค้าง</th></tr></thead><tbody>
  ${R.length?R.map(r=>`<tr><td><button type="button" class="btn ghost sm" data-a="go" data-m="pj" data-k="dash" data-p="${r.p.id}"><b>${esc(r.p.name)}</b></button></td><td>${esc(r.p.info.client||'')}</td><td class="r">${fmt(r.C.total)}</td>
    <td class="r"><span class="pill ${r.done?'ok':r.act<r.plan-5?'bad':r.act<r.plan-0.5?'warn':'ok'}">${fmt(r.act,0)}% / ${fmt(r.plan,0)}%</span></td><td class="r">${r.T.bud?fmt(r.T.com*100/r.T.bud,0)+'%':'–'}</td><td class="r" style="color:${r.margin<0?'var(--danger)':'inherit'}">${fmt(r.margin)} <small class="muted">${r.C.total?fmt(r.margin*100/r.C.total,1)+'%':''}</small></td>
    <td class="r">${fmt(r.billed)}</td><td class="r">${fmt(r.recv)}</td><td class="r">${r.ar?fmt(r.ar):''}</td><td class="r">${r.issues||''}</td></tr>`).join('')
    +`<tr class="tot"><td colspan="2">รวม</td><td class="r">${fmt(tot(r=>r.C.total))}</td><td></td><td></td><td class="r">${fmt(tot('margin'))}</td><td class="r">${fmt(tot('billed'))}</td><td class="r">${fmt(tot('recv'))}</td><td class="r">${fmt(tot('ar'))}</td><td></td></tr>`:'<tr><td colspan="10" class="empty">ยังไม่มีโครงการ</td></tr>'}</tbody></table></div></section>
  <section class="card"><h2><span>กระแสเงินสดทั้งบริษัท</span><span class="sp"></span><button type="button" class="btn sm" data-a="go" data-m="co" data-k="acct" data-s="cf">ดูรายละเอียด</button></h2>${cfChart(cf)}</section>`;
};

function reqSkills(s){const d=SKILLS.depts.find(x=>x.c===s.dept),r=roleOf(s),L=[];
  COMMON.forEach(([k,b,dl,h,off])=>{if(off&&isCrew(s))return;let v=dl[s.dept]||b;if(h&&isHead(s))v=Math.max(v,h);L.push({k,req:v,src:'ทุกตำแหน่ง'})});
  if(d)d.core.forEach(([k,v])=>L.push({k,req:v,src:'ฝ่าย'}));if(r)r.sk.forEach(([k,v])=>L.push({k,req:v,src:'ตำแหน่ง'}));
  const seen={};return L.filter(x=>seen[x.k]?(seen[x.k].req=Math.max(seen[x.k].req,x.req),false):(seen[x.k]=x,true))}

function labCost(pid){return sum(labEntries(pid),e=>e.cost)}

const DAYS_M=26;// a daily-paid person's month = 26 working days, the same base rateH() uses
function payCfg(){const C=CO();if(!C.pay)C.pay={bands:PAY0.bands.map(([g,nm,min,max])=>({id:uid(),g,n:nm,min,max})),merit:PAY0.merit.map(([g,lo,mid,hi])=>({id:uid(),g,lo,mid,hi})),allow:PAY0.allow.map(([nm,amt])=>({id:uid(),n:nm,amt}))};return C.pay}
const r100=v=>Math.round(v/100)*100,r10=v=>Math.round(v/10)*10;
function band(g){const b=payCfg().bands.find(x=>x.g===g);if(!b)return null;const lo=n(b.min),hi=n(b.max);return {g:b.g,n:b.n,min:lo,max:hi,mid:r100((lo+hi)/2),p25:r100(lo+(hi-lo)*0.25),p75:r100(lo+(hi-lo)*0.75)}}
const gradeOf=s=>s.grade||PAY0.map[s.role]||'';
const monthly=s=>s.wtype==='month'?n(s.wage):n(s.wage)*DAYS_M;
const fromMonthly=(s,m)=>s.wtype==='month'?m:Math.round(m/DAYS_M);
// % of the role's required skills the person meets; null until at least one is assessed
function skillPct(s){const R=reqSkills(s),sk=s.sk||{};if(!R.length||!R.some(x=>sk[x.k]!=null&&sk[x.k]!==''))return null;return Math.round(R.filter(x=>n(sk[x.k])>=x.req).length*100/R.length)}
// starting pay range from skill %: <70 min–p25 · 70–89 p25–mid · ≥90 mid–p75 (p75–max kept for proven people)
function startRange(s){const b=band(gradeOf(s)),p=skillPct(s);if(!b||p==null)return null;return p<70?[b.min,b.p25,'ต่ำกว่า 70%']:p<90?[b.p25,b.mid,'70–89%']:[b.mid,b.p75,'90% ขึ้นไป']}
function review(s){const sp=skillPct(s),ok=sp!=null&&s.kpi!==''&&s.kpi!=null&&s.beh!==''&&s.beh!=null;
  const tot=ok?Math.round((sp*0.4+n(s.kpi)*0.4+n(s.beh)*0.2)*10)/10:null,gr=tot==null?'':tot>=90?'A':tot>=75?'B':tot>=60?'C':'D';
  const b=band(gradeOf(s)),cur=monthly(s),compa=b&&cur?Math.round(cur/b.mid*100)/100:null;
  const m=payCfg().merit.find(x=>x.g===gr),pct=m&&compa!=null?n(compa<0.9?m.lo:compa<=1.1?m.mid:m.hi):null;
  const raw=pct!=null?r10(cur*(1+pct)):null,nw=raw!=null?Math.min(raw,Math.max(b.max,cur)):null,lump=raw!=null?Math.max(0,raw-nw):0;
  return {sp,tot,gr,b,cur,compa,pct,nw,lump}}
function alwOf(s){return sum(payCfg().allow.filter(a=>s['a_'+a.id]),a=>a.amt)}
const bandPill=s=>{const b=band(gradeOf(s));if(!b)return '<span class="muted">–</span>';const m=monthly(s);return `${b.g} <span class="pill ${!m?'':m<b.min?'bad':m>b.max?'warn':'ok'}">${!m?'':m<b.min?'ต่ำกว่ากระบอก':m>b.max?'เกินเพดาน':'อยู่ในกระบอก'}</span>`};

/* ---------- shared data on OneDrive, Microsoft sign-in ----------
   One JSON file in the owner's OneDrive folder "PENUM-PM", shared with staff by e-mail invitation.
   Every device keeps its own copy (works offline) and merges with the file: record by record, by id,
   so two people editing different rows never lose each other's work. Photos sit next to it in photos/,
   and a dated copy goes to backup/ once a day (last 30 kept). */
const CKEY='penum.pm.cloud',AUTH='https://login.microsoftonline.com/common/oauth2/v2.0',GR='https://graph.microsoft.com/v1.0',
  SCOPE='offline_access User.Read Files.ReadWrite.All',FOLDER='PENUM-PM',FNAME='penum-pm.json';
let CL={};try{CL=JSON.parse(localStorage.getItem(CKEY)||'{}')}catch(e){}
const clSave=()=>{try{localStorage.setItem(CKEY,JSON.stringify(CL))}catch(e){}};
const CS={state:'',msg:'',busy:false,dirty:false};// sync status for the band button
const cloudOn=()=>!!(CL.tok&&CL.file);
const redirectUri=()=>location.origin+location.pathname.replace(/index\.html$/,'');
const b64u=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const myMail=()=>((CL.user||{}).mail||'').toLowerCase();

/* sign-in: OAuth code flow with PKCE, no library */
async function msLogin(){if(!CL.clientId){toast('ใส่ Application (client) ID ก่อน');return}
  if(!SUITE){toast('ล็อกอินได้เฉพาะในแอปที่ติดตั้งจาก fongdabo.github.io');return}
  const v=b64u(crypto.getRandomValues(new Uint8Array(32))),st=b64u(crypto.getRandomValues(new Uint8Array(12)));
  const ch=b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
  CL.pkce={v,st};clSave();save(true);
  location.href=AUTH+'/authorize?'+new URLSearchParams({client_id:CL.clientId,response_type:'code',redirect_uri:redirectUri(),scope:SCOPE,code_challenge:ch,code_challenge_method:'S256',state:st,prompt:'select_account'})}
async function tokenReq(body){const r=await fetch(AUTH+'/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CL.clientId,scope:SCOPE,...body})});
  const j=await r.json().catch(()=>({}));if(!r.ok||!j.access_token)throw new Error(j.error_description||j.error||'ล็อกอินไม่สำเร็จ');
  CL.tok={at:j.access_token,exp:Date.now()+(n(j.expires_in)||3600)*1000,rt:j.refresh_token||(CL.tok||{}).rt};clSave()}
async function msRedirect(){const q=new URLSearchParams(location.search);
  if(q.get('cid')){CL.clientId=q.get('cid').trim();clSave()}
  if(!q.get('code')&&!q.get('error')){if(q.get('cid'))history.replaceState(null,'',redirectUri());return false}
  history.replaceState(null,'',redirectUri());
  if(q.get('error')){toast('ล็อกอินไม่สำเร็จ: '+(q.get('error_description')||q.get('error')).slice(0,120));return false}
  const pk=CL.pkce||{};delete CL.pkce;if(pk.st!==q.get('state')){toast('ล็อกอินไม่สำเร็จ ลองใหม่อีกครั้ง');return false}
  try{await tokenReq({grant_type:'authorization_code',code:q.get('code'),redirect_uri:redirectUri(),code_verifier:pk.v});
    const u=await (await gfetch('/me?$select=displayName,mail,userPrincipalName')).json();CL.user={name:u.displayName||'',mail:(u.mail||u.userPrincipalName||'').toLowerCase()};clSave();
    toast(`ล็อกอินแล้ว: ${CL.user.name||CL.user.mail}`);return true}catch(e){toast(e.message);return false}}
async function accessToken(){const t=CL.tok;if(!t)return null;if(t.at&&t.exp>Date.now()+60000)return t.at;if(!t.rt)return null;
  try{await tokenReq({grant_type:'refresh_token',refresh_token:t.rt});return CL.tok.at}catch(e){CL.tok=null;clSave();return null}}
async function gfetch(path,opt={}){const t=await accessToken();if(!t){CS.state='login';cloudBadge();throw new Error('ต้องล็อกอิน Microsoft อีกครั้ง')}
  return fetch(path.startsWith('http')?path:GR+path,{...opt,headers:{Authorization:'Bearer '+t,...(opt.headers||{})}})}
async function gjson(path,opt){const r=await gfetch(path,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error((j.error&&j.error.message)||('OneDrive ตอบกลับ '+r.status));return j}
const itemPath=(rel)=>`/drives/${CL.file.drive}/items/${CL.file.folder}:/${rel.split('/').map(encodeURIComponent).join('/')}:`;

/* what is shared: projects and company data (not which project this device has open) */
const payload=()=>JSON.stringify({v:DB.v||1,projects:DB.projects,co:DB.co});
const eq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
const isObj=x=>x&&typeof x==='object'&&!Array.isArray(x);
const byId=a=>Array.isArray(a)&&a.length>0&&a.every(x=>isObj(x)&&x.id!=null);
// three-way merge: base = last synced, l = this device, r = the file now. A side that did not change gives way.
function merge3(b,l,r){if(l===undefined)return r;if(r===undefined)return l;if(eq(l,r)||eq(l,b))return r;if(eq(r,b))return l;
  if(Array.isArray(l)&&Array.isArray(r)&&(byId(l)||byId(r)||byId(b))&&[l,r,b||[]].every(a=>a.every(x=>isObj(x)&&x.id!=null))){
    const M=a=>new Map((a||[]).map(x=>[x.id,x])),B=M(b),L=M(l),R=M(r),ids=[...R.keys(),...[...L.keys()].filter(k=>!R.has(k))],out=[];
    for(const id of ids){const bi=B.get(id),li=L.get(id),ri=R.get(id);
      if(bi&&!li){if(ri&&!eq(ri,bi))out.push(ri);continue}// deleted here; keep only if edited there
      if(bi&&!ri){if(li&&!eq(li,bi))out.push(li);continue}// deleted there; keep only if edited here
      out.push(li&&ri?merge3(bi,li,ri):li||ri)}
    return out}
  if(isObj(l)&&isObj(r)){const bb=isObj(b)?b:{},out={};
    for(const k of new Set([...Object.keys(r),...Object.keys(l)])){const inL=k in l,inR=k in r;
      if(!inL&&k in bb){if(inR&&!eq(r[k],bb[k]))out[k]=r[k];continue}
      if(!inR&&k in bb){if(inL&&!eq(l[k],bb[k]))out[k]=l[k];continue}
      out[k]=merge3(bb[k],l[k],r[k])}
    return out}
  return l}
async function baseGet(){try{return JSON.parse(await IDB.get('__cloudbase')||'null')}catch(e){return null}}
const baseSet=s=>IDB.put('__cloudbase',s).catch(()=>{});
function applyData(d){DB.projects=d.projects||{};Object.values(DB.projects).forEach(migrate);DB.co=Object.assign(blankCo(),d.co||{});

async function cloudPull(force){if(!cloudOn())return;
  const it=await gjson(`/drives/${CL.file.drive}/items/${CL.file.id}?$select=id,eTag,lastModifiedDateTime,lastModifiedBy`);
  if(!force&&it.eTag===CL.file.etag)return false;
  const dl=await gjson(`/drives/${CL.file.drive}/items/${CL.file.id}?$select=id,eTag,@microsoft.graph.downloadUrl`);
  const txt=await (await fetch(dl['@microsoft.graph.downloadUrl'])).text(),remote=JSON.parse(txt||'{}'),base=await baseGet(),local=JSON.parse(payload());
  const merged=base?merge3(base,local,remote):remote;applyData(merged);
  CL.file.etag=dl.eTag;clSave();await baseSet(txt);CS.dirty=payload()!==txt;
  const by=((it.lastModifiedBy||{}).user||{}).displayName;if(by&&(it.lastModifiedBy.user.email||'').toLowerCase()!==myMail())CS.msg=`อัปเดตจาก ${by}`;
  render();return true}
async function cloudPush(){if(!cloudOn())return;const body=payload(),base=await baseGet();
  if(base&&JSON.stringify(base)===body&&!CS.dirty)return;
  for(let i=0;i<3;i++){const r=await gfetch(`/drives/${CL.file.drive}/items/${CL.file.id}/content`,{method:'PUT',headers:{'Content-Type':'application/json','If-Match':CL.file.etag||'*'},body:payload()});
    if(r.status===412||r.status===409){await cloudPull(true);continue}// someone saved first: merge their changes in, then try again
    const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error((j.error&&j.error.message)||('บันทึกขึ้น OneDrive ไม่ได้ '+r.status));
    CL.file.etag=j.eTag;clSave();await baseSet(payload());CS.dirty=false;await dailyBackup().catch(()=>{});pushPhotos().catch(()=>{});return}
  throw new Error('มีคนแก้ไขพร้อมกันหลายครั้ง ลองซิงค์อีกครั้ง')}
async function cloudSync(force){if(!cloudOn()||CS.busy)return;if(!navigator.onLine){CS.state='off';cloudBadge();return}
  CS.busy=true;CS.state='busy';cloudBadge();
  try{await cloudPull(force);await cloudPush();CS.state='ok';CL.last=Date.now();clSave()}
  catch(e){CS.state=CS.state==='login'?'login':'err';CS.msg=e.message}
  finally{CS.busy=false;cloudBadge()}}
let pushT;const schedPush=()=>{if(!cloudOn())return;clearTimeout(pushT);CS.state=CS.busy?CS.state:'wait';cloudBadge();pushT=setTimeout(()=>cloudSync(),2500)};
{const s=save;save=function(now){s(now);if(cloudOn())schedPush()}}

/* a dated copy once a day, keep the last 30 */
async function dailyBackup(){const d=today();if(CL.bk===d)return;
  const r=await gfetch(itemPath(`backup/penum-pm-${d}.json`)+'/content',{method:'PUT',headers:{'Content-Type':'application/json'},body:payload()});if(!r.ok)return;
  CL.bk=d;clSave();const L=await gjson(itemPath('backup')+'/children?$select=id,name&$top=200').catch(()=>({value:[]}));
  const old=(L.value||[]).filter(x=>/^penum-pm-\d{4}-\d\d-\d\d\.json$/.test(x.name)).sort((a,b)=>b.name.localeCompare(a.name)).slice(30);
  for(const x of old)await gfetch(`/drives/${CL.file.drive}/items/${x.id}`,{method:'DELETE'}).catch(()=>{})}

function alerts(){const td=today(),A=[],soon=k=>addD(td,k),add=(lv,kind,p,txt,due,go)=>A.push({lv,kind,p,txt,due,go});
  projects().forEach(p=>withP(p,()=>{
    p.pos.forEach(po=>{if(poState(po).k==='bad')add('bad','ของส่งล่าช้า',p,`${po.no} ${vName(po.vid)}`,po.due,{m:'pj',k:'buy',s:'po'})});
    (p.rfis||[]).forEach(r=>{if(r.status==='open'&&okD(r.due)&&r.due<=soon(1))add(r.due<td?'bad':'warn','RFI รอคำตอบ',p,`${r.no} ${r.subject||''}`,r.due,{m:'pj',k:'site',s:'rfi'})});
    (p.punch||[]).forEach(r=>{if(r.status!=='done'&&okD(r.due)&&r.due<td)add('warn','Punch list เกินกำหนด',p,`${r.no} ${r.item||''} ${r.loc||''}`,r.due,{m:'pj',k:'hand',s:'punch'})});
    (p.war||[]).forEach(w=>{if(!okD(w.start))return;const d=pd(w.start);d.setMonth(d.getMonth()+n(w.months));const end=iso(d);if(end>=td&&end<=soon(60))add('warn','ประกันใกล้หมด',p,`${w.item||''} ${w.vendor||''}`,end,{m:'pj',k:'hand',s:'war'})});
    if(p.tasks.length){const s=sched();p.tasks.forEach(t=>{const r=s.R[t.id];if(r&&r.crit&&n(t.pct)<100&&okD(r.ef)&&r.ef<td)add('bad','งานวิกฤตล่าช้า',p,t.name||'',r.ef,{m:'pj',k:'sched'})})}}));

/* Thai baht in words, for receipts */
function bahtText(v){v=Math.round(n(v)*100)/100;if(!v)return 'ศูนย์บาทถ้วน';const D=['','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'],U=['','สิบ','ร้อย','พัน','หมื่น','แสน'];
  const rd=s=>{s=String(s).replace(/^0+/,'');if(!s)return '';if(s.length>6)return rd(s.slice(0,-6))+'ล้าน'+rd(s.slice(-6));let o='';const L=s.length;
    for(let i=0;i<L;i++){const d=+s[i],p=L-i-1;if(!d)continue;if(p===1&&d===1)o+='สิบ';else if(p===1&&d===2)o+='ยี่สิบ';else if(p===0&&d===1&&L>1)o+='เอ็ด';else o+=D[d]+U[p]}return o};
  const neg=v<0;v=Math.abs(v);const b=Math.floor(v),s=Math.round((v-b)*100);return (neg?'ลบ':'')+(b?rd(b)+'บาท':'')+(s?rd(s)+'สตางค์':'ถ้วน')}

const skKey=(d,u)=>`${String(d||'').trim()}|${String(u||'').trim()}`;
function stockCard(){const M=new Map(),get=(d,u)=>{const k=skKey(d,u);if(!M.has(k))M.set(k,{k,desc:String(d||'').trim(),unit:String(u||'').trim(),inq:0,out:0,last:''});return M.get(k)};
  P.pos.forEach(po=>(po.dl||[]).forEach(dl=>{const l=po.items.find(x=>x.id===dl.line);if(!l||!String(l.desc||'').trim())return;const r=get(l.desc,l.unit);r.inq+=n(dl.q);if(dl.date>r.last)r.last=dl.date}));
  P.stockIn.forEach(x=>{if(!String(x.item||'').trim())return;const r=get(x.item,x.unit);r.inq+=n(x.q);if(x.date>r.last)r.last=x.date});
  P.stock.forEach(x=>{if(!x.item)return;const [d,u]=String(x.item).split('|');const r=get(d,u);r.out+=n(x.q);if(x.date>r.last)r.last=x.date});
  return [...M.values()].sort((a,b)=>a.desc.localeCompare(b.desc,'th'))}

function orgForms(){const card=([f,t])=>`<div class="fm"><a href="files/${f}.pdf" target="_blank" rel="noopener" class="fm-pv"><img src="files/pv/${f}.jpg" alt="" loading="lazy"></a><div class="fm-t">${t}</div><div class="row"><a class="btn sm" href="files/${f}.pdf" target="_blank" rel="noopener">เปิด</a><a class="btn sm" href="files/${f}.pdf" download>ดาวน์โหลด</a></div></div>`;

function ohead(title,sub,extra){const C=CO(),t=String(title),en=(DOC_EN.find(([r])=>r.test(t))||[0,''])[1];
  let th=t.replace(/\s*\([A-Za-z&\s]+\)/,''),no='';const m=th.match(/\s([A-Z][A-Z0-9]*-[\w-]+(?:\s+Rev\.\S+)?)\s*$/);if(m){no=m[1];th=th.slice(0,m.index)}
  const rows=[...(no?[['เลขที่',no]]:[]),...extra,...String(sub||'').split(/<br\s*\/?>/i).map(x=>x.trim()).filter(Boolean).map(x=>{const k=x.indexOf(' ');return k>0&&k<22?[x.slice(0,k),x.slice(k+1)]:['',x]}),['พิมพ์',thDL(today())]];
  return `<div class="oh"><div>${C.logo?`<img src="${C.logo}" alt="">`:''}</div><div class="oh-c"><b>${esc(C.name||'')}</b>${C.addr?`<br>${esc(C.addr)}`:''}<br>${[C.phone?'โทร '+esc(C.phone):'',esc(C.email||''),C.tax?'เลขประจำตัวผู้เสียภาษี '+esc(C.tax):''].filter(Boolean).join(' · ')}</div></div>
  <div class="ot"><div class="ot-t">${en?`<small>${en}</small>`:''}<h1>${th}</h1></div><div class="ot-m">${rows.map(([k,v])=>`<div><span>${k}</span>${v}</div>`).join('')}</div></div>
  <div class="ofoot"><span>${esc(C.name||'')}${C.email?' · '+esc(C.email):''}</span><span>PENUM PM</span></div>`}
