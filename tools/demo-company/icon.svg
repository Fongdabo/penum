<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512"><defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1f4d"/><stop offset="1" stop-color="#132f74"/></linearGradient>
 <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
 <radialGradient id="glow"><stop offset="0" stop-color="#fff7d6"/><stop offset=".45" stop-color="#fcd34d"/><stop offset="1" stop-color="#fcd34d" stop-opacity="0"/></radialGradient>
</defs><g transform="translate(0 0) scale(1)">
 <rect width="200" height="200" rx="44" fill="url(#bg)"/>
 <!-- O made of an airflow ring, open at upper right like a swirl -->
 <path d="M150 62A62 62 0 1 0 162 112" fill="none" stroke="url(#ring)" stroke-width="16" stroke-linecap="round"/>
 <!-- Orion's belt: three stars on a slight diagonal -->
 <line x1="72" y1="114" x2="128" y2="88" stroke="#fde68a" stroke-width="1.5" opacity=".5"/>
 <circle cx="72" cy="114" r="16" fill="url(#glow)"/><circle cx="72" cy="114" r="4.5" fill="#fff"/>
 <circle cx="100" cy="101" r="18" fill="url(#glow)"/><circle cx="100" cy="101" r="5.5" fill="#fff"/>
 <circle cx="128" cy="88" r="16" fill="url(#glow)"/><circle cx="128" cy="88" r="4.5" fill="#fff"/>
 <!-- guiding star -->
 <path d="M158 40l3.2 8.8 8.8 3.2-8.8 3.2-3.2 8.8-3.2-8.8-8.8-3.2 8.8-3.2z" fill="#fde68a"/>
</g></svg>